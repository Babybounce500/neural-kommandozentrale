    .hero h1 .pink{color:var(--accent2);text-shadow:0 0 40px rgba(255,0,127,.3)}
    .hero-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:2px;text-transform:uppercase}
    .hero-stats{display:flex;justify-content:center;gap:32px;margin-top:24px;flex-wrap:wrap}
    .h-stat{text-align:center}
    .h-stat .num{font-family:var(--mono);font-size:28px;font-weight:900;color:var(--accent);text-shadow:0 0 16px rgba(0,255,204,.2)}
    .h-stat .lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
    .search-wrap{max-width:600px;margin:0 auto 28px;padding:0 20px}
    .search-box{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:12px 18px;display:flex;align-items:center;gap:10px;transition:border-color .2s}
    .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 12px rgba(0,255,204,.08)}
    .search-box input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:13px;outline:none}
    .search-box input::placeholder{color:var(--dim)}
    .filter-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center}
    .ftag{background:var(--bg4);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:20px;font-size:10px;cursor:pointer;font-family:var(--mono);transition:all .15s;letter-spacing:.5px}
    .ftag:hover{border-color:var(--accent);color:var(--accent)}
    .ftag.active{background:rgba(0,255,204,.08);border-color:var(--accent);color:var(--accent)}
    .main{max-width:1400px;margin:0 auto;padding:0 24px 48px}
    .cat-section{margin-bottom:36px}
    .cat-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .cat-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
    .cat-count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--bg4);padding:2px 10px;border-radius:12px}
    .cat-green .cat-title{color:var(--green)}
    .cat-blue .cat-title{color:var(--blue)}
    .cat-pink .cat-title{color:var(--accent2)}
    .cat-yellow .cat-title{color:var(--yellow)}
    .cat-purple .cat-title{color:var(--accent3)}
    .cat-teal .cat-title{color:#5eead4}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .card-grid.compact{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
    .card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 16px;cursor:pointer;transition:all .18s ease;position:relative;overflow:hidden;text-decoration:none;display:block}
    .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .18s}
    .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,255,204,.06)}
    .card:hover::before{opacity:1}
    .card .c-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card .c-desc{font-size:10px;color:var(--dim);line-height:1.5;font-family:var(--mono);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card .c-meta{display:flex;gap:8px;margin-top:8px;font-size:9px;font-family:var(--mono)}
    .c-badge{padding:1px 6px;border-radius:3px;font-size:9px;letter-spacing:.5px}
    .bg-green{background:rgba(0,255,135,.08);color:var(--green);border:1px solid rgba(0,255,135,.2)}
    .bg-blue{background:rgba(0,191,255,.08);color:var(--blue);border:1px solid rgba(0,191,255,.2)}
    .bg-pink{background:rgba(255,0,127,.08);color:var(--accent2);border:1px solid rgba(255,0,127,.2)}
    .bg-yellow{background:rgba(245,158,11,.08);color:var(--yellow);border:1px solid rgba(245,158,11,.2)}
    .bg-purple{background:rgba(124,58,237,.08);color:var(--accent3);border:1px solid rgba(124,58,237,.2)}
    .bg-teal{background:rgba(94,234,212,.08);color:#5eead4;border:1px solid rgba(94,234,212,.2)}
    .hidden{display:none !important}
    .footer{text-align:center;padding:24px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--dim)}
    .footer span{color:var(--accent)}
    @media(max-width:600px){
      .hero{padding:32px 16px 20px}
      .hero-stats{gap:16px}
      .main{padding:0 12px 32px}
      .card-grid{grid-template-columns:1fr}

    @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

</head>

let totalFiles = 0;
let tradingCount = 0;
let apiCount = 0;

function render(){
  const el = document.getElementById('mainContent');
  el.innerHTML = '';
  const filter = document.querySelector('.ftag.active')?.dataset.filter || 'all';
  const search = document.getElementById('searchInput').value.toLowerCase();

  totalFiles = 0;
  tradingCount = 0;
  apiCount = 0;

  DATA.forEach((cat, ci) => {
    if(filter !== 'all' && cat.cat !== filter) return;
    const filtered = cat.items.filter(i =>
      !search || i.name.toLowerCase().includes(search) || i.desc.toLowerCase().includes(search)
    );
    if(!filtered.length) return;

    totalFiles += filtered.length;
    if(cat.cat === 'trading' || cat.cat === 'terminal') tradingCount += filtered.length;
    if(cat.cat === 'browser-api') apiCount += filtered.length;

    const sec = document.createElement('div');
    sec.className = 'cat-section cat-' + cat.color;
    sec.style.animationDelay = ci * 0.05 + 's';
    sec.innerHTML = `
      <div class="cat-header">
        <span class="cat-title">${cat.title}</span>
        <span class="cat-count">${filtered.length} files</span>
      </div>
      <div class="card-grid${filtered.length > 12 ? ' compact' : ''}"></div>
    `;
    const grid = sec.querySelector('.card-grid');
    filtered.forEach(item => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = item.path;
      card.innerHTML = `
        <div class="c-name">${item.name}</div>
        <div class="c-desc">${item.desc}</div>
        <div class="c-meta">
          <span class="c-badge bg-${cat.color}">${item.badge}</span>
        </div>
      `;
      grid.appendChild(card);
    });
    el.appendChild(sec);
  });

  document.getElementById('stat-files').textContent = totalFiles;
  document.getElementById('stat-cats').textContent = DATA.filter(c =>
    filter === 'all' || c.cat === filter
  ).length;
  document.getElementById('stat-trading').textContent = tradingCount;
  document.getElementById('stat-api').textContent = apiCount;
  document.getElementById('footerCount').textContent = totalFiles;
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterTags').addEventListener('click', e => {
  if(!e.target.classList.contains('ftag')) return;
  document.querySelectorAll('.ftag').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  render();
});

render();
</script>
