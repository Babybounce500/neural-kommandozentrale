<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORPUS PARVUS // COMPRESSION DETECTOR</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030508;
      --panel: #070b14;
      --panel-inner: #0b1120;
      --border: rgba(0, 255, 136, 0.1);
      --border-bright: rgba(0, 212, 255, 0.3);
      --txt-muted: #52667a;
      --white: #e3ebf2;
      --green: #00ff88;
      --red: #ff003c;
      --accent: #00d4ff;
      --gold: #ffdd00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      background: var(--bg);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.5;
    }
    
    body { padding: 24px; padding-bottom: 60px; }

    .header {
      text-align: center;
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 24px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      color: #fff;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
    }

    .subtitle {
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 3px;
      margin-top: 8px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 16px;
      margin: 24px 0;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(7, 11, 20, 0.7);
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      backdrop-filter: blur(10px);
    }

    .control-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 0.75rem;
      color: var(--txt-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    select, input {
      background: var(--panel-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--white);
      padding: 12px 16px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    select:focus, input:focus { outline: none; border-color: var(--accent); }

    .btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 12px 28px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.25s ease;
      height: 48px;
    }

    .btn:hover { 
      background: var(--accent); 
      color: #030508; 
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    .btn-export { border-color: var(--green); color: var(--green); }
    .btn-export:hover { background: var(--green); color: #030508; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }

    #progressSection {
      display: none;
      margin: 24px 0;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border-bright);
      border-radius: 6px;
    }

    #progressSection.active { display: block; }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: #010204;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    #progressFill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      width: 0%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #000;
    }

    .results-container {
      margin-top: 32px;
    }

    .results-section-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px 16px;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid var(--accent); 
      color: var(--accent); 
      background: rgba(0, 212, 255, 0.03);
    }

    .results-grid { 
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
      gap: 20px;
    }

    @media (max-width: 768px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    .result-card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      gap: 18px;
      border-left: 4px solid var(--accent);
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.02);
    }

    .result-candle-matrix {
      flex-shrink: 0;
      width: 110px;
      height: 110px;
      background: #010204;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 4px;
    }

    .result-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .result-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 6px; }
    
    .result-symbol { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.1rem; color: #fff; }
    .result-timestamp { font-size: 0.65rem; color: var(--txt-muted); margin-left: 6px; }
    
    .sig-badge { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 3px; letter-spacing: 1px; }
    .badge-go { background: rgba(0, 212, 255, 0.15); color: var(--accent); border: 1px solid var(--accent); }

    .result-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; font-size: 0.78rem; margin-top: 6px; }
    .result-metric { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.02); padding-bottom: 2px; }
    .result-label { color: var(--txt-muted); }
    .val-white { color: #fff; font-weight: 500; }
    .val-gold { color: var(--gold); font-weight: bold; }
    .text-up { color: var(--green); font-weight: bold; }
    .text-down { color: var(--red); font-weight: bold; }

    .confidence-container { grid-column: span 2; margin-top: 6px; }
    .confidence-mini-bar { background: rgba(255, 255, 255, 0.04); height: 4px; border-radius: 2px; width: 100%; margin-top: 2px;}
    .confidence-mini-fill { background: linear-gradient(90deg, var(--accent), var(--gold)); height: 100%; width: 0%; transition: width 0.4s ease; }
  </style>
</head>

    function init() {
      const select = document.getElementById('categorySelect');
      marketUniverse.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id; opt.textContent = cat.label;
        select.appendChild(opt);
      });
    }
    document.addEventListener('DOMContentLoaded', init);

    async function startBulkScan() {
      if (isScanning) return;
      const category = document.getElementById('categorySelect').value;
      const delay = parseInt(document.getElementById('delayInput').value) || 2000;
      
      isScanning = true;
      validatedSignals = [];
      
      document.getElementById('goGrid').innerHTML = '';
      document.getElementById('progressSection').classList.add('active');

      const targetCategory = marketUniverse.categories.find(c => c.id === category);
      const targetSymbols = targetCategory.symbols;
      
      for (let i = 0; i < targetSymbols.length; i++) {
        const symbol = targetSymbols[i];
        const percent = Math.round((i / targetSymbols.length) * 100);
        
        document.getElementById('progressText').textContent = `EXTRACTING CORPUS RATIOS // ${symbol}...`;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('progressFill').textContent = percent + '%';
        document.getElementById('statusMsg').textContent = `${i} / ${targetSymbols.length}`;
        
        await fetchAndAnalyzeParvus(symbol);
        await new Promise(r => setTimeout(r, delay));
      }

      document.getElementById('progressSection').classList.remove('active');
      isScanning = false;
      renderSignals();
    }

    async function fetchAndAnalyzeParvus(symbol) {
      try {
        const res = await fetch(`${API_URL}?symbol=${symbol}&endpoint=historical&period=d`);
        if (!res.ok) return;
        let data = await res.json();
        
        if (data && data.length >= 5) {
          // Chronologisch absteigend sortieren (Neueste zuerst)
          data.sort((a, b) => new Date(b.date) - new Date(a.date));

          const t0 = data[0]; // Heute (B)
          const t1 = data[1]; // Gestern (A)
          const t2 = data[2]; // Vorgestern (Zur Trendermittlung)

          const openA = parseFloat(t1.open);
          const closeA = parseFloat(t1.close);
          const openB = parseFloat(t0.open);
          const closeB = parseFloat(t0.close);

          // Berechnung der Kerzenkörper (Echte Körper-Fläche)
          const bodyA = Math.abs(closeA - openA);
          const bodyB = Math.abs(closeB - openB);

          // STRENGER FILTER: Nur GO, wenn bodyB (Heute) kleiner als bodyA (Gestern) ist
          if (bodyB < bodyA) {
            // Trend-Identifikation auf Basis der letzten 3 Tage
            let structuralTrend = "Sideways";
            if (closeB > parseFloat(t1.close) && parseFloat(t1.close) > parseFloat(t2.close)) {
              structuralTrend = "Bullish Uptrend";
            } else if (closeB < parseFloat(t1.close) && parseFloat(t1.close) < parseFloat(t2.close)) {
              structuralTrend = "Bearish Downtrend";
            }

            // Kennzahlen für die Breakout-Pyramide
            const longBreakout = closeB * 1.01;
            const longPyramid = closeB * 1.02;
            const shortBreakout = closeB * 0.99;
            const shortPyramid = closeB * 0.98;

            // Kursrisiko-Definition für Positionsgrößenbestimmung (Abstand Breakouts)
            const kursrisiko = longBreakout - shortBreakout;
            const accountBalance = parseFloat(document.getElementById('balanceInput').value) || 10000;
            const riskAmount = accountBalance * 0.01; // 1% Fixed Risk
            const quantity = kursrisiko > 0 ? Math.floor(riskAmount / kursrisiko) : 0;

            const volChange = t1.volume ? ((parseFloat(t0.volume) - parseFloat(t1.volume)) / parseFloat(t1.volume)) * 100 : 0;
            const intradayRange = ((parseFloat(t0.high) - parseFloat(t0.low)) / parseFloat(t0.low)) * 100;

            // ==========================================
            // CONFIDENCE ENGIN LOGIC FOR CORPUS PARVUS
            // ==========================================
            // Eine echte Kompression will fallendes Volumen wärend der Verengung sehen (Einschlafen des Marktes vor dem Knall)
            let confidence = 60; // Baseline für ein gültiges Inside-Pattern

            if (volChange < 0) {
              // Bevorzugtes Szenario: Volumen trocknet in der engen Spanne aus (+ Bestätigung)
              confidence += 15 + Math.min(Math.abs(volChange) * 0.3, 15);
            } else {
              // Anomalie: Enge Range, aber steigendes Volumen (Instabilität/Kampf-Zone)
              confidence -= 15;
            }

            // Trend-Bonus: Liegt ein klarer Trend vor, ist der spätere Breakout zuverlässiger
            if (structuralTrend !== "Sideways") {
              confidence += 10;
            }

            // Absicherung der Grenzen
            confidence = Math.min(Math.max(Math.round(confidence), 15), 95);

            validatedSignals.push({
              symbol,
              date: t0.date,
              bodyA, bodyB,
              longBreakout, longPyramid,
              shortBreakout, shortPyramid,
              trend: structuralTrend,
              volTrend: volChange,
              range: intradayRange,
              risk: kursrisiko,
              quantity,
              confidence,
              decimals: closeB < 2 ? 4 : 2,
              candles: [
                { open: parseFloat(t2.open), high: parseFloat(t2.high), low: parseFloat(t2.low), close: parseFloat(t2.close) },
                { open: openA, high: parseFloat(t1.high), low: parseFloat(t1.low), close: closeA },
                { open: openB, high: parseFloat(t0.high), low: parseFloat(t0.low), close: closeB }
              ]
            });
          }
        }
      } catch (e) { console.error("Corpus Parvus Pipeline Error for: " + symbol, e); }
    }

    function renderSignals() {
      const goGrid = document.getElementById('goGrid');

      if (validatedSignals.length === 0) {
        goGrid.innerHTML = '<div style="color: var(--txt-muted); text-align:center; padding: 40px; grid-column: 1/-1;">Keine komprimierten Corpus-Parvus Formationen (GO) im aktuellen Cluster gefunden.</div>';
        return;
      }

      // Höchste Confidence zuerst
      validatedSignals.sort((a, b) => b.confidence - a.confidence);

      validatedSignals.forEach(sig => {
        const card = document.createElement('div');
        card.className = 'result-card';
        const formattedDate = new Date(sig.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });

        card.innerHTML = `
          <canvas class="result-candle-matrix" width="110" height="110"></canvas>
          <div class="result-info">
            <div class="result-header">
              <div>
                <span class="result-symbol">${sig.symbol}</span>
                <span class="result-timestamp">EOD: ${formattedDate}</span>
              </div>
              <span class="sig-badge badge-go">GO</span>
            </div>
            <div class="result-metrics">
              <div class="result-metric"><span class="result-label">LONG Breakout:</span><span class="text-up">$${sig.longBreakout.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">LONG Pyramid:</span><span class="val-white">$${sig.longPyramid.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">SHORT Breakout:</span><span class="text-down">$${sig.shortBreakout.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">SHORT Pyramid:</span><span class="val-white">$${sig.shortPyramid.toFixed(sig.decimals)}</span></div>
              
              <div class="result-metric"><span class="result-label">Body Gestern (A):</span><span class="val-white">${sig.bodyA.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">Body Heute (B):</span><span class="val-gold" style="font-size:0.8rem;">${sig.bodyB.toFixed(sig.decimals)}</span></div>
              
              <div class="result-metric"><span class="result-label">Market Trend:</span><span class="val-white" style="font-size:0.72rem; font-weight:bold;">${sig.trend}</span></div>
              <div class="result-metric"><span class="result-label">Stückzahl (1%):</span><span class="val-gold">${sig.quantity} Pcs</span></div>
              
              <div class="result-metric"><span class="result-label">Volume Trend:</span><span class="${sig.volTrend >= 0 ? 'text-up' : 'text-down'}">${sig.volTrend >= 0 ? '▲' : '▼'} ${Math.abs(sig.volTrend).toFixed(1)}%</span></div>
              <div class="result-metric"><span class="result-label">Intraday Range:</span><span class="val-white">${sig.range.toFixed(2)}%</span></div>

              <div class="confidence-container">
                <div style="display:flex; justify-content:space-between; font-size:0.7rem;">
                  <span class="result-label">Parvus Confidence:</span><span style="color:var(--gold); font-weight:bold;">${sig.confidence}%</span>
                </div>
                <div class="confidence-mini-bar"><div class="confidence-mini-fill" style="width: ${sig.confidence}%"></div></div>
              </div>
            </div>
          </div>
        `;
        goGrid.appendChild(card);
        drawThreeDayMatrix(card.querySelector('canvas'), sig.candles);
      });
    }

    function drawThreeDayMatrix(canvas, candles) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#010204';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const globalHigh = Math.max(...candles.map(c => c.high));
      const globalLow = Math.min(...candles.map(c => c.low));
      const globalRange = globalHigh - globalLow || 1;

      const padding = 12;
      const usableHeight = canvas.height - (padding * 2);
      const candleWidth = 18;
      const spacing = 12;
      const startX = 14;

      candles.forEach((c, i) => {
        const x = startX + i * (candleWidth + spacing);
        const isBullish = c.close >= c.open;
        
        const highY = padding + (1 - (c.high - globalLow) / globalRange) * usableHeight;
        const lowY = padding + (1 - (c.low - globalLow) / globalRange) * usableHeight;
        const openY = padding + (1 - (c.open - globalLow) / globalRange) * usableHeight;
        const closeY = padding + (1 - (c.close - globalLow) / globalRange) * usableHeight;

        ctx.strokeStyle = '#3a4b5c';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + candleWidth / 2, highY);
        ctx.lineTo(x + candleWidth / 2, lowY);
        ctx.stroke();

        ctx.fillStyle = isBullish ? '#00ff88' : '#ff003c';
        const bodyY = Math.min(openY, closeY);
        const bodyHeight = Math.abs(closeY - openY) || 2;
        ctx.fillRect(x, bodyY, candleWidth, bodyHeight);
      });
    }

    function downloadReport() {
      if(validatedSignals.length === 0) {
        alert("Keine aktiven CORPUS PARVUS Daten für den Export vorhanden.");
        return;
      }
      let reportLines = ["=== CORPUS PARVUS COMPRESSION BULK REPORT ==="];
      validatedSignals.forEach(s => {
        reportLines.push(`Symbol: ${s.symbol} | STATUS: GO | Confidence: ${s.confidence}%`);
        reportLines.push(`Trend: ${s.trend} | VolTrend: ${s.volTrend.toFixed(2)}%`);
        reportLines.push(`Body Gestern: ${s.bodyA.toFixed(4)} | Body Heute: ${s.bodyB.toFixed(4)}`);
        reportLines.push(`LONG Breakout: $${s.longBreakout.toFixed(4)} | LONG Pyramid: $${s.longPyramid.toFixed(4)}`);
        reportLines.push(`SHORT Breakout: $${s.shortBreakout.toFixed(4)} | SHORT Pyramid: $${s.shortPyramid.toFixed(4)}`);
        reportLines.push(`Risk Range: $${s.risk.toFixed(4)} | Allocation Quantity (1%): ${s.quantity} Units`);
        reportLines.push("--------------------------------------------------");
      });
      
      const blob = new Blob([reportLines.join('\n')], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `corpus_parvus_report.txt`;
      a.click();
      window.URL.revokeObjectURL(url);
    }
