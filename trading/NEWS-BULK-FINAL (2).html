<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ARGENTUM // NEURAL NEWS PACKER v13.0</title>
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #030108;
            --panel: #0b0616;
            --panel-inner: #130a24;
            --border: rgba(212, 175, 55, 0.3);
            --accent: #00f0ff;
            --green: #00ff88;
            --white: #e9e9f0;
            --muted: #7c6f94;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--white); font-family: 'Segoe UI', sans-serif; padding: 24px; }
        
        .container {
            max-width: 1400px;
            margin: auto;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.15);
        }

        h1 { color: var(--gold); text-align: center; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; font-weight: 900; font-family: monospace; }
        .subtitle { text-align: center; color: var(--accent); font-size: 11px; letter-spacing: 1px; margin-bottom: 24px; font-weight: bold; }

        .control-panel {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            background: var(--panel-inner);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 24px;
        }
        
        @media (max-width: 768px) {
            .control-panel { grid-template-columns: 1fr; }
        }

        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 11px; color: var(--gold); text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        
        input {
            background: #000; border: 1px solid var(--border); color: #fff; padding: 12px;
            border-radius: 4px; font-size: 14px; width: 100%; font-family: monospace;
        }

        .btn-container { display: flex; gap: 10px; align-items: flex-end; }
        
        .btn {
            flex: 1; background: transparent; color: var(--gold); border: 1px solid var(--gold);
            padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer;
            transition: all 0.2s ease; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;
        }
        .btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .btn-green { color: var(--green); border-color: var(--green); }
        .btn-green:hover { background: var(--green); color: #000; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }

        .matrix-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .output-header h3 { color: var(--gold); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .status-ticker { font-size: 11px; color: var(--muted); font-family: monospace; }

        .llm-dump-zone {
            background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 16px;
            height: 650px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
            line-height: 1.5; color: #ddd; white-space: pre-wrap;
        }
    </style>
</head>

</div>

    // Init function für Dropdown
    function initMarketSelect() {
        const select = document.getElementById('marketSelect');
        marketUniverse.categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.symbols.join(', ');
            opt.textContent = cat.label;
            select.appendChild(opt);
        });
    }
    document.addEventListener('DOMContentLoaded', initMarketSelect);

    // 1:1 Übernahme der originalen getNews-Logik
    async function getNews(symbol) {
        try {
            const res = await fetch(`${API_BASE}/eod/news?s=${symbol}&offset=0&limit=30`);
            if (!res.ok) return [];
            return await res.json();
        } catch {
            return [];
        }
    }

    // 1:1 Übernahme der originalen Filter-Logik (Case-Insensitive Match auf das Basis-Symbol)
    function filterNews(news, symbol) {
        const symbolBase = symbol.split('.')[0].toUpperCase();
        return news.filter(item => {
            const title = item.title.toUpperCase();
            const content = (item.content || '').toUpperCase();
            return title.includes(symbolBase) || content.includes(symbolBase);
        });
    }

    // Die neue Bulk-Schleife mit Fokus auf den unzensierten Volltext der neusten Artikel
    async function executeGoldshieldBulkScan() {
        const statusField = document.getElementById('globalStatus');
        const dumpZone = document.getElementById('llmDump');
        
        const rawInput = document.getElementById('marketSelect').value;
        const tickers = rawInput.split(',').map(t => t.trim()).filter(t => t.length > 0);
        
        if (tickers.length === 0) {
            alert("Bitte gib mindestens ein Symbol ein!");
            return;
        }

        statusField.textContent = `[FETCHING] Kontaktiere Goldshield Core für ${tickers.length} Assets...`;
        statusField.style.color = "var(--gold)";
        dumpZone.textContent = "Verbinde mit Server-Endpunkt...\n\n";

        let finalLLMPromptBlock = `==================================================\n`;
        finalLLMPromptBlock += `GOLDSHIELD V10 UNFILTERED LATEST NEWS FULL-TEXT DUMP\n`;
        finalLLMPromptBlock += `GENERATED ON: ${new Date().toLocaleString()}\n`;
        finalLLMPromptBlock += `TARGET CLUSTER: ${tickers.join(', ')}\n`;
        finalLLMPromptBlock += `==================================================\n\n`;

        for (let i = 0; i < tickers.length; i++) {
            const symbol = tickers[i];
            dumpZone.textContent += `-> Ziehe Rohdaten für: ${symbol} (${i+1}/${tickers.length})...\n`;
            
            // Holen der News über deine native Routine
            const rawNews = await getNews(symbol);
            // Filtern nach deiner originalen Logik
            const filteredNews = filterNews(rawNews, symbol);

            finalLLMPromptBlock += `### START RAW NEWS STREAM: ${symbol} (${filteredNews.length} MATCHES) ###\n`;

            if (filteredNews.length === 0) {
                finalLLMPromptBlock += `No relevant news items found for ${symbol} within the current API window.\n`;
            } else {
                // Sortierung nach Datum (Neueste zuerst), falls Datumsfelder vorhanden sind
                filteredNews.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

                // Hier holen wir NUR die neuesten Artikel, dafür aber als maximalen VOLLTEXT
                // Limitiert auf die Top 5 neuesten Nachrichten im kompletten Wortlaut, um Kontext-Fenster zu optimieren
                const latestTopItems = filteredNews.slice(0, 5);

                latestTopItems.forEach((item, index) => {
                    finalLLMPromptBlock += `\n[LATEST ARTICLE #${index + 1}]\n`;
                    finalLLMPromptBlock += `Symbol-Source: ${symbol}\n`;
                    finalLLMPromptBlock += `Publish-Date: ${item.date || 'N/A'}\n`;
                    finalLLMPromptBlock += `Headline: ${item.title}\n`;
                    finalLLMPromptBlock += `--- FULL-TEXT CONTENT START ---\n`;
                    finalLLMPromptBlock += `${item.content || 'No Content Body Available'}\n`;
                    finalLLMPromptBlock += `--- FULL-TEXT CONTENT END ---\n`;
                    finalLLMPromptBlock += `_`.repeat(50) + `\n`;
                });
            }

            finalLLMPromptBlock += `\n### END RAW NEWS STREAM: ${symbol} ###\n`;
            finalLLMPromptBlock += `==================================================\n\n`;

            // Minimaler 200ms Brems-Schutz für die Schleife
            await new Promise(r => setTimeout(r, 200));
        }

        finalLLMPromptBlock += `=== END OF NEURAL CONTEXT BLOCK FOR DIRECT LLM PROCESSING ===`;
        
        dumpZone.textContent = finalLLMPromptBlock;
        statusField.textContent = `[SUCCESS] Volltext-Paket geschnürt!`;
        statusField.style.color = "var(--green)";
    }

    function copyToClipboard() {
        const dumpZone = document.getElementById('llmDump');
        navigator.clipboard.writeText(dumpZone.textContent);
        
        const statusField = document.getElementById('globalStatus');
        const oldText = statusField.textContent;
        statusField.textContent = "📋 COPIED FULL TEXT DUMP TO CLIPBOARD!";
        statusField.style.color = "var(--green)";
        
        setTimeout(() => {
            statusField.textContent = oldText;
            statusField.style.color = "var(--muted)";
        }, 2500);
    }
