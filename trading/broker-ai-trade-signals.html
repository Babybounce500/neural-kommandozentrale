<script>
window.API_BASE_URL = 'https://glow-up-gemini.replit.app';
/*
 * Einziger Ort, der fetch() gegen den eigenen Proxy aufruft.
 * Nie gegen Provider-URLs, nie mit API-Keys -- die liegen ausschliesslich
 * serverseitig in server/providers/*.js als Replit Secrets.
 *
 * Einbindung: <script src="/shared/js/api-client.js"><\/script>
 * Alles haengt am globalen "API"-Objekt, kein Build-Step noetig.
 */
(function (global) {
  'use strict';

  // Same-origin per Default (Proxy + Prototypen im selben Repl). Fuer statisches
  // Hosting ohne Backend dahinter (z.B. VS Code "Live Server") vor diesem Script
  // per <script>window.API_BASE_URL = 'http://localhost:5000';<\/script> auf den
  // laufenden Node-Proxy zeigen -- CORS ist serverseitig schon offen.
  const BASE = global.API_BASE_URL || '';

  async function postJSON(path, body) {
    const res = await fetch(BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error('API request failed'), { status: res.status, data });
    return data;
  }

  async function getJSON(path, params) {
    const qs = params && Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '';
    const res = await fetch(BASE + path + qs);
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error('API request failed'), { status: res.status, data });
    return data;
  }

  // Verpackt rohe PCM-Bytes (wie sie Gemini TTS liefert) in einen minimalen
  // WAV-Header, damit new Audio(url) sie abspielen kann -- Browser koennen
  // kein "nacktes" PCM ohne Container abspielen.
  function pcmToWav(pcmBuffer, { sampleRate, numChannels, bitsPerSample }) {
    const blockAlign = numChannels * (bitsPerSample / 8);
    const byteRate = sampleRate * blockAlign;
    const dataSize = pcmBuffer.byteLength;
    const header = new ArrayBuffer(44);
    const view = new DataView(header);
    const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };

    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, byteRate, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitsPerSample, true);
    writeStr(36, 'data');
    view.setUint32(40, dataSize, true);

    return new Blob([header, pcmBuffer], { type: 'audio/wav' });
  }

  async function postForm(path, formData) {
    const res = await fetch(BASE + path, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error('API request failed'), { status: res.status, data });
    return data;
  }

  // Generischer SSE-Reader fuer OpenAI-kompatible delta-Streams (OpenAI, Mistral, Groq, Perplexity)
  async function streamOpenAICompatible(path, body, onDelta, onThinkingDelta) {
    const res = await fetch(BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, stream: true })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw Object.assign(new Error('Stream request failed'), { status: res.status, data: err });
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of decoder.decode(value, { stream: true }).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (!payload || payload === '[DONE]') continue;
        try {
          const parsed = JSON.parse(payload);
          const content = parsed.choices?.[0]?.delta?.content;
          if (typeof content === 'string') {
            if (content) { full += content; if (onDelta) onDelta(content, full); }
          } else if (Array.isArray(content)) {
            // Reasoning-Modelle (z.B. Mistral magistral-*) liefern delta.content waehrend
            // der Denkphase als Array von Content-Bloecken statt eines Strings --
            // {"type":"thinking","thinking":[{"type":"text","text":"..."}]} -- live
            // verifiziert. Naives "full += content" stringified das Array zu
            // "[object Object]" und haengt sich dauerhaft an die Antwort (das gemeldete
            // "immer object object"). Denk-Text wird separat behandelt (optionaler
            // Callback), nur echte "text"-Bloecke zaehlen als sichtbare Antwort.
            for (const block of content) {
              if (block?.type === 'thinking' && Array.isArray(block.thinking)) {
                const thinkingText = block.thinking.map((t) => t?.text || '').join('');
                if (thinkingText && onThinkingDelta) onThinkingDelta(thinkingText);
              } else if (block?.type === 'text' && block.text) {
                full += block.text; if (onDelta) onDelta(block.text, full);
              }
            }
          }
        } catch (_) { /* ignore partial/non-JSON keepalive lines */ }
      }
    }
    return full;
  }

  // Anthropic-Stream hat ein eigenes Event-Format (content_block_delta)
  async function streamClaude(body, onDelta) {
    const res = await fetch(BASE + '/claude/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, stream: true })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw Object.assign(new Error('Stream request failed'), { status: res.status, data: err });
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of decoder.decode(value, { stream: true }).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (!payload) continue;
        try {
          const parsed = JSON.parse(payload);
          const token = parsed.delta?.text;
          if (token) {
            full += token;
            if (onDelta) onDelta(token, full);
          }
        } catch (_) { /* ignore */ }
      }
    }
    return full;
  }

  // Reichhaltigere Variante fuer claudeMessage(): erfasst zusaetzlich Extended-
  // Thinking-Deltas (delta.type === 'thinking_delta'). Tool-Use-Bloecke
  // (server_tool_use/*_tool_result fuer Web-Suche/Code-Ausfuehrung) lassen sich
  // aus SSE-Deltas nicht sauber/vollstaendig rekonstruieren -- claudeMessage()
  // schaltet bei aktiven Tools deshalb auf einen normalen (nicht-gestreamten)
  // Request um, der den kompletten content[]-Array direkt liefert.
  async function streamClaudeRich(body, { onTextDelta, onThinkingDelta } = {}) {
    const res = await fetch(BASE + '/claude/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, stream: true })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw Object.assign(new Error('Stream request failed'), { status: res.status, data: err });
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    let thinking = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of decoder.decode(value, { stream: true }).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (!payload) continue;
        try {
          const parsed = JSON.parse(payload);
          if (parsed.type === 'content_block_delta') {
            if (parsed.delta?.type === 'text_delta') {
              text += parsed.delta.text;
              if (onTextDelta) onTextDelta(parsed.delta.text, text);
            } else if (parsed.delta?.type === 'thinking_delta') {
              thinking += parsed.delta.thinking || '';
              if (onThinkingDelta) onThinkingDelta(parsed.delta.thinking, thinking);
            }
          }
        } catch (_) { /* ignore */ }
      }
    }
    return { text, thinking };
  }

  // Extrahiert Text/Thinking/Zitate/Tool-Schritte aus einer NICHT-gestreamten
  // Claude-Antwort (content[]-Array mit type: text|thinking|server_tool_use|
  // web_search_tool_result|code_execution_tool_result).
  function extractClaudeOutput(data) {
    const blocks = data.content || [];
    let text = '';
    let thinking = '';
    const seenUrls = new Set();
    const citations = [];
    const toolSteps = [];
    for (const block of blocks) {
      if (block.type === 'text') {
        text += block.text || '';
        (block.citations || []).forEach((c) => {
          if (c.url && !seenUrls.has(c.url)) { seenUrls.add(c.url); citations.push({ url: c.url, title: c.title }); }
        });
      } else if (block.type === 'thinking') {
        thinking += block.thinking || '';
      } else if (block.type === 'server_tool_use') {
        toolSteps.push({ type: 'tool_use', name: block.name, input: block.input });
      } else if (block.type === 'web_search_tool_result' || block.type === 'code_execution_tool_result') {
        toolSteps.push({ type: 'tool_result', tool: block.type, content: block.content });
      }
    }
    return { text, thinking, citations, toolSteps, raw: data };
  }

  // Gemini Interactions API hat seit dem Breaking Change vom 26.05.2026 ein eigenes
  // Stream-Event-Format: {"event_type":"step.delta","delta":{"type":"text","text":"..."}}
  // -- NICHT das choices[0].delta-Format von OpenAI/Mistral/Groq/Perplexity.
  async function streamGeminiInteraction(body, onDelta) {
    const res = await fetch(BASE + '/gemini/interactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, stream: true })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw Object.assign(new Error('Stream request failed'), { status: res.status, data: err });
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    let interactionId = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      for (const line of decoder.decode(value, { stream: true }).split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (!payload) continue;
        try {
          const parsed = JSON.parse(payload);
          if (parsed.event_type === 'interaction.created') {
            interactionId = parsed.interaction?.id || interactionId;
          }
          if (parsed.event_type === 'step.delta' && parsed.delta?.type === 'text') {
            full += parsed.delta.text;
            if (onDelta) onDelta(parsed.delta.text, full);
          }
        } catch (_) { /* ignore partial/non-JSON keepalive lines */ }
      }
    }
    // Streaming liefert nur Text-Deltas, keine vollstaendigen Steps (Code-Execution,
    // Zitate, ...). Die holen wir per Follow-up-GET nach, damit geminiInteraction()
    // im Stream- und Non-Stream-Fall dieselbe {text, citations, raw}-Form zurueckgibt.
    return { text: full, interactionId };
  }

  // Extrahiert Text + Zitate aus einer NICHT-gestreamten Interactions-API-Antwort.
  // Antwortform: { steps: [{type:'model_output', content:[{type:'text', text, annotations}]}, ...] }
  // Live gegen echtes Google-Search-Grounding getestet: dieselbe URL taucht oft
  // mehrfach auf (einmal pro ueberlappendem Text-Abschnitt) -- hier per URL dedupliziert,
  // sonst listet die UI dieselbe Quelle 3-4x auf.
  function extractGeminiOutput(data) {
    const modelOutputSteps = (data.steps || []).filter((s) => s.type === 'model_output');
    let text = '';
    const seenUrls = new Set();
    const citations = [];
    for (const step of modelOutputSteps) {
      for (const part of step.content || []) {
        if (part.type === 'text') {
          text += part.text;
          for (const a of part.annotations || []) {
            if (a.type === 'url_citation' && !seenUrls.has(a.url)) {
              seenUrls.add(a.url);
              citations.push({ url: a.url, title: a.title });
            }
          }
        }
      }
    }
    return { text, citations, id: data.id || data.name, raw: data };
  }

  const API = {
    // ---------- Chat ----------
    async chatOpenAI({ messages, model, max_tokens, temperature, onDelta } = {}) {
      if (onDelta) return streamOpenAICompatible('/api/chat', { messages, model, max_tokens, temperature }, onDelta);
      const data = await postJSON('/api/chat', { messages, model, max_tokens, temperature });
      return data.choices?.[0]?.message?.content ?? data;
    },

    async chatMistral({ messages, model, max_tokens, temperature, onDelta, onThinkingDelta } = {}) {
      if (onDelta) return streamOpenAICompatible('/mistral/chat', { messages, model, max_tokens, temperature }, onDelta, onThinkingDelta);
      const data = await postJSON('/mistral/chat', { messages, model, max_tokens, temperature });
      const msg = data.choices?.[0]?.message;
      if (msg && typeof msg.content !== 'string' && Array.isArray(msg.content)) {
        // Nicht-gestreamter Fall bei Reasoning-Modellen (magistral-*): content ist auch
        // hier ein Array von Bloecken statt eines Strings -- nur "text"-Bloecke ergeben
        // die sichtbare Antwort, "thinking"-Bloecke werden nicht mit reingemischt.
        return msg.content.filter((b) => b?.type === 'text').map((b) => b.text || '').join('') || data;
      }
      return msg?.content ?? data;
    },

    async chatGroq({ messages, model, max_tokens, temperature, onDelta } = {}) {
      if (onDelta) return streamOpenAICompatible('/groq/chat', { messages, model, max_tokens, temperature }, onDelta);
      const data = await postJSON('/groq/chat', { messages, model, max_tokens, temperature });
      return data.choices?.[0]?.message?.content ?? data;
    },

    async chatPerplexity({ messages, model, onDelta, ...rest } = {}) {
      if (onDelta) return streamOpenAICompatible('/perplexity/chat/completions', { messages, model, ...rest }, onDelta);
      const data = await postJSON('/perplexity/chat/completions', { messages, model, ...rest });
      return data.choices?.[0]?.message?.content ?? data;
    },

    async chatClaude({ messages, model, max_tokens, system, onDelta } = {}) {
      if (onDelta) return streamClaude({ messages, model, max_tokens, system }, onDelta);
      const data = await postJSON('/claude/messages', { messages, model, max_tokens, system });
      return data.content?.[0]?.text ?? data;
    },

    // Reichhaltige Variante: Extended Thinking, Web-Suche, Code-Ausfuehrung,
    // Zitate. Rueckgabeform {text, thinking, citations, toolSteps, raw} --
    // gleich in Stream- und Non-Stream-Fall. Bei aktiven tools wird intern
    // automatisch nicht-gestreamt angefragt (siehe streamClaudeRich-Kommentar).
    async claudeMessage({ messages, model, max_tokens, system, tools, tool_choice, thinking, beta, onDelta, onThinkingDelta } = {}) {
      const body = {
        messages,
        model: model || 'claude-sonnet-5',
        max_tokens: max_tokens || 4096,
        ...(system && { system }),
        ...(tools && { tools }),
        ...(tool_choice && { tool_choice }),
        ...(thinking && { thinking }),
        ...(beta && { beta })
      };
      const canStream = !!onDelta && !tools;
      if (canStream) {
        const { text, thinking: thinkingText } = await streamClaudeRich(body, { onTextDelta: onDelta, onThinkingDelta });
        return { text, thinking: thinkingText, citations: [], toolSteps: [], raw: null };
      }
      const data = await postJSON('/claude/messages', body);
      return extractClaudeOutput(data);
    },

    // ---------- Claude: Modelle, Dateien, Batches ----------
    claude: {
      models: () => getJSON('/claude/models'),
      filesList: () => getJSON('/claude/files'),
      fileUpload: (file) => {
        const formData = new FormData();
        formData.append('file', file);
        return postForm('/claude/files', formData);
      },
      fileGet: (fileId) => getJSON(`/claude/files/${fileId}`),
      countTokens: ({ messages, model, system } = {}) => postJSON('/claude/messages/count_tokens', { messages, model, system }),
      batchCreate: (requests) => postJSON('/claude/messages/batches', { requests }),
      batchGet: (batchId) => getJSON(`/claude/messages/batches/${batchId}`),
      batchResults: (batchId) => getJSON(`/claude/messages/batches/${batchId}/results`)
    },

    async chatGemini({ model = 'gemini-3.5-flash', contents, generationConfig } = {}) {
      // Legacy generateContent-Pfad -- laeuft weiter, aber ohne neue Features
      // (Search-Grounding, Code-Execution, TTS). Dafuer: geminiInteraction() unten.
      const data = await postJSON(`/gemini/models/${model}/generateContent`, { contents, ...(generationConfig && { generationConfig }) });
      return data.candidates?.[0]?.content?.parts?.[0]?.text ?? data;
    },

    // Interactions API (seit Juni 2026 GA, empfohlen fuer alles Neue).
    // tools: [{type:'google_search'}] / [{type:'code_execution'}] / Function-Declarations.
    async geminiInteraction({ model = 'gemini-3.5-flash', input, tools, systemInstruction, generationConfig, responseFormat, previousInteractionId, onDelta } = {}) {
      const body = {
        model,
        input,
        ...(tools && { tools }),
        ...(systemInstruction && { system_instruction: systemInstruction }),
        ...(generationConfig && { generation_config: generationConfig }),
        ...(responseFormat && { response_format: responseFormat }),
        ...(previousInteractionId && { previous_interaction_id: previousInteractionId })
      };
      // Rueckgabeform ist bewusst in beiden Modi gleich ({text, citations, raw}), damit
      // Aufrufer nicht zwischen String (Stream) und Objekt (non-Stream) unterscheiden muessen.
      if (onDelta) {
        const { text, interactionId } = await streamGeminiInteraction(body, onDelta);
        // Streaming liefert nur Text-Deltas -- volle Steps (Code-Execution, Zitate,
        // Function-Calls) per Follow-up-GET nachladen, falls eine Interaction-ID da ist.
        if (interactionId) {
          try {
            const full = await getJSON(`/gemini/interactions/${interactionId}`);
            return extractGeminiOutput(full);
          } catch (_) { /* Follow-up-GET optional -- Text haben wir so oder so schon */ }
        }
        return { text, citations: [], id: interactionId, raw: { steps: [] } };
      }
      const data = await postJSON('/gemini/interactions', body);
      return extractGeminiOutput(data);
    },

    // Kurzform mit Google-Search-Grounding. Gibt { text, citations, raw } zurueck --
    // citations sind echte URLs aus der Google-Suche, nicht vom Modell erfunden.
    async geminiSearch(prompt, model) {
      const data = await postJSON('/gemini/search', { prompt, model });
      return extractGeminiOutput(data);
    },

    // Kurzform mit Python-Code-Execution-Tool
    async geminiCodeExecution(prompt, model) {
      const data = await postJSON('/gemini/code-execution', { prompt, model });
      return extractGeminiOutput(data);
    },

    // Text-to-Speech (Gemini TTS-Modelle). Gibt eine abspielbare Blob-URL zurueck,
    // Server liefert rohe PCM-Bytes (24kHz, mono, 16-bit) -- kein WAV-Header,
    // daher hier in einen minimalen WAV-Container verpackt, damit <audio> es abspielen kann.
    async geminiSpeech(input, { model, voice, speakers } = {}) {
      const res = await fetch(BASE + '/gemini/speech', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input, model, voice, speakers })
      });
      if (!res.ok) throw new Error('Gemini TTS request failed');
      const pcm = await res.arrayBuffer();
      const wavBlob = pcmToWav(pcm, { sampleRate: 24000, numChannels: 1, bitsPerSample: 16 });
      return URL.createObjectURL(wavBlob);
    },

    // Veo Videogenerierung: Long-Running-Operation (Start + Polling), keine Sofort-Antwort.
    async geminiVeoGenerate({ prompt, model, aspectRatio, durationSeconds, resolution, image } = {}) {
      return postJSON('/gemini/veo/generate', { prompt, model, aspectRatio, durationSeconds, resolution, image });
    },
    async geminiVeoOperation(operationName) {
      return getJSON(`/gemini/veo/operations/${operationName}`);
    },

    // Laedt das fertige Veo-Video ueber den Server (der den Key hat) und gibt
    // eine abspielbare Blob-URL zurueck.
    async geminiVeoDownload(videoUri) {
      const res = await fetch(BASE + '/gemini/veo/download?uri=' + encodeURIComponent(videoUri));
      if (!res.ok) throw new Error('Video-Download fehlgeschlagen');
      const blob = await res.blob();
      return URL.createObjectURL(blob);
    },

    // Pollt eine Veo-Operation bis fertig und liefert die abspielbare Video-URL.
    // onProgress(attempt) optional fuer eine Fortschrittsanzeige im UI.
    async geminiVeoWaitForVideo(operationName, { onProgress, maxAttempts = 30, intervalMs = 10000 } = {}) {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const op = await this.geminiVeoOperation(operationName);
        if (onProgress) onProgress(attempt, op);
        if (op.done) {
          const videoUri = op.response?.generateVideoResponse?.generatedSamples?.[0]?.video?.uri;
          if (!videoUri) throw new Error('Kein Video in der fertigen Operation gefunden');
          return this.geminiVeoDownload(videoUri);
        }
        await new Promise((r) => setTimeout(r, intervalMs));
      }
      throw new Error('Timeout beim Warten auf das Video (Veo braucht manchmal >5 Minuten)');
    },

    // Batch API: viele Prompts in einem async Job verarbeiten (50% guenstiger als
    // einzelne Interactive-Calls, dauert je nach Groesse Sekunden bis zu 24h).
    // prompts: Array von Strings. Jeder Eintrag bekommt eine "key"-Metadata, damit
    // die Ergebnisse spaeter wieder ihrem Prompt zugeordnet werden koennen.
    async geminiBatchCreate(prompts, { model = 'gemini-3.5-flash', displayName = 'batch-job' } = {}) {
      const requests = prompts.map((text, i) => ({
        request: { contents: [{ parts: [{ text }] }] },
        metadata: { key: `request-${i}` }
      }));
      return postJSON(`/gemini/models/${model}/batchGenerateContent`, {
        batch: { display_name: displayName, input_config: { requests: { requests } } }
      });
    },
    async geminiBatchStatus(batchName) {
      return getJSON(`/gemini/batches/${batchName}`);
    },
    // Pollt einen Batch-Job bis fertig. onProgress(attempt, job) optional fuer
    // eine Fortschrittsanzeige. Gibt die Liste der inlinedResponses zurueck.
    async geminiBatchWait(batchName, { onProgress, maxAttempts = 30, intervalMs = 5000 } = {}) {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const job = await this.geminiBatchStatus(batchName);
        if (onProgress) onProgress(attempt, job);
        if (job.done) {
          if (job.error) throw new Error(job.error.message || 'Batch-Job fehlgeschlagen');
          return job.response?.inlinedResponses?.inlinedResponses || [];
        }
        await new Promise((r) => setTimeout(r, intervalMs));
      }
      throw new Error('Timeout beim Warten auf den Batch-Job');
    },

    // ---------- Images ----------
    async generateImageOpenAI({ prompt, model, size, quality, n } = {}) {
      return postJSON('/api/images/generate', { prompt, model, size, quality, n });
    },

    // Nano-Banana-Bildgenerierung ueber die Interactions API (ersetzt das alte,
    // nie verifizierte imagen-4-Endpoint). Extrahiert defensiv sowohl aus dem
    // dokumentierten output_image-Kurzfeld als auch aus den rohen steps, falls
    // Google das Kurzfeld in der REST-Antwort (anders als im SDK) nicht mitschickt.
    // previousInteractionId: Antwort einer vorherigen generateImageGemini()-Antwort
    // (data.id) mitgeben, um DASSELBE Bild konversationell weiterzubearbeiten.
    async generateImageGemini({ prompt, model, aspectRatio, imageSize, referenceImages, previousInteractionId } = {}) {
      const data = await postJSON('/gemini/images/generate', { prompt, model, aspectRatio, imageSize, referenceImages, previousInteractionId });
      if (!data.output_image?.data) {
        const imageStep = (data.steps || []).find((s) => s.content?.some((c) => c.type === 'image'));
        if (imageStep) {
          const imagePart = imageStep.content.find((c) => c.type === 'image');
          data.output_image = { data: imagePart.data, mime_type: imagePart.mime_type };
        }
      }
      data.id = data.id || data.name;
      return data;
    },

    async generateImageLeonardo(body) {
      return postJSON('/leonardo/generations', body);
    },

    async getLeonardoGeneration(generationId) {
      return getJSON(`/leonardo/generations/${generationId}`);
    },

    async improveLeonardoPrompt(prompt, promptInstructions) {
      return postJSON('/leonardo/prompt/improve', { prompt, promptInstructions });
    },

    async randomLeonardoPrompt() {
      return postJSON('/leonardo/prompt/random', {});
    },

    // ---------- Audio ----------
    async transcribeAudio(file, opts = {}) {
      const formData = new FormData();
      formData.append('file', file);
      if (opts.model) formData.append('model', opts.model);
      if (opts.language) formData.append('language', opts.language);
      return postForm('/api/audio/transcriptions', formData);
    },

    async ttsSpeech(input, { voice, model, response_format } = {}) {
      const res = await fetch(BASE + '/api/audio/speech', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input, voice, model, response_format })
      });
      if (!res.ok) throw new Error('TTS request failed');
      const blob = await res.blob();
      return URL.createObjectURL(blob);
    },

    // ---------- Mistral (Codestral/Pixtral/Voxtral/Devstral/Agents/Libraries) ----------
    // chatMistral() oben deckt normalen + multimodalen (Pixtral) Chat schon ab --
    // hier nur die Faehigkeiten, die eigene Endpunkte brauchen.
    mistral: {
      models: () => getJSON('/mistral/models'),
      // Codestral Fill-in-the-Middle: prompt = Code VOR der Cursorposition,
      // suffix = Code NACH der Cursorposition (optional).
      fim: ({ prompt, suffix, model, max_tokens, temperature } = {}) =>
        postJSON('/mistral/fim/completions', { prompt, suffix, model, max_tokens, temperature }),
      // OCR (Pixtral-basiert): entweder ein Bild als data:-URI oder eine echte Dokument-URL.
      ocr: ({ imageDataUrl, documentUrl, model, pages } = {}) =>
        postJSON('/mistral/ocr', {
          model: model || 'mistral-ocr-latest',
          document: documentUrl
            ? { type: 'document_url', document_url: documentUrl }
            : { type: 'image_url', image_url: imageDataUrl },
          ...(pages && { pages })
        }),
      // Voxtral-Transkription -- multipart/form-data, kein JSON-Body.
      transcribe: (file, { model, language, prompt } = {}) => {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('model', model || 'voxtral-mini-2507');
        if (language) formData.append('language', language);
        if (prompt) formData.append('prompt', prompt);
        return postForm('/mistral/audio/transcriptions', formData);
      },
      moderate: (input, model) => postJSON('/mistral/moderations', { input, model }),
      agentsList: () => getJSON('/mistral/agents'),
      agentCreate: (body) => postJSON('/mistral/agents', body),
      librariesList: () => getJSON('/mistral/libraries'),
      libraryCreate: (body) => postJSON('/mistral/libraries', body)
    },

    // ---------- EOD Historical Data ----------
    eod: {
      historical: (symbol, params) => getJSON(`/eod/historical/${symbol}`, params),
      realtime: (symbol) => getJSON(`/eod/realtime/${symbol}`),
      intraday: (symbol, interval) => getJSON(`/eod/intraday/${symbol}`, interval ? { interval } : undefined),
      fundamentals: (symbol) => getJSON(`/eod/fundamentals/${symbol}`),
      search: (query) => getJSON(`/eod/search/${encodeURIComponent(query)}`),
      news: (params) => getJSON('/eod/news', params),
      dividends: (symbol) => getJSON(`/eod/dividends/${symbol}`)
    },

    // ---------- YouTube Data API v3 ----------
    youtube: {
      search: (q, params) => getJSON('/youtube/search', { q, ...params }),
      trending: (params) => getJSON('/youtube/trending', params),
      videos: (ids) => getJSON('/youtube/videos', { ids: Array.isArray(ids) ? ids.join(',') : ids }),
      // Oeffentliche Kanal-Statistiken ueber die normale Data API v3 (kein OAuth).
      // Fuer PRIVATE Analytics des eigenen Kanals (Watch-Time, Traffic-Quellen,
      // Umsatz) braeuchte es stattdessen die YouTube Analytics/Reporting API mit
      // Google-OAuth-Login -- bewusst nicht gebaut, das ist ein deutlich groesserer
      // Schritt (Consent-Screen, Refresh-Tokens) und war fuer "meistgesehene Videos
      // anzeigen" nicht noetig.
      channelResolve: (handle) => getJSON('/youtube/channel/resolve', { handle }),
      channelVideos: (channelId, params) => getJSON('/youtube/channel/videos', { channelId, ...params })
    },

    // ---------- Wikipedia (kein Key noetig, komplett oeffentliche REST-API) ----------
    wikipedia: {
      search: (q, params) => getJSON('/wikipedia/search', { q, ...params }),
      summary: (title, params) => getJSON(`/wikipedia/summary/${encodeURIComponent(title)}`, params),
      random: (params) => getJSON('/wikipedia/random', params)
    },

    // ---------- Google Maps Platform (Geocoding + Places API New) ----------
    // Nur Geocoding/Places laufen ueber diesen Proxy -- die Maps JavaScript API
    // (fuer die interaktive Karte selbst) hat keinen Server-Weg, die laedt das
    // eigene Script-Tag direkt mit einem clientseitig HTTP-Referrer-eingeschraenkten
    // Key (siehe loadGoogleMapsScript() im jeweiligen Prototyp).
    googlemaps: {
      // Liefert den Maps-JS-Key automatisch, falls der Server ihn als Secret gesetzt
      // hat -- Prototypen sollten das zuerst versuchen und nur bei null auf die
      // manuelle localStorage-Key-Eingabe zurueckfallen.
      config: () => getJSON('/googlemaps/config'),
      geocode: (address) => getJSON('/googlemaps/geocode', { address }),
      reverseGeocode: (lat, lng) => getJSON('/googlemaps/geocode/reverse', { lat, lng }),
      placesSearch: (query, fields) => postJSON('/googlemaps/places/search', { query, fields }),
      placesDetails: (placeId, fields) => getJSON(`/googlemaps/places/details/${encodeURIComponent(placeId)}`, fields ? { fields } : undefined),
      placesAutocomplete: (input, sessionToken) => postJSON('/googlemaps/places/autocomplete', { input, sessionToken }),
      // Routes API v2: origin/destination als {lat,lng}, travelMode 'DRIVE'|'BICYCLE'|'WALK'.
      computeRoute: (origin, destination, travelMode) => postJSON('/googlemaps/routes', { origin, destination, travelMode }),
      // Liefert einen Blob statt JSON (echtes PNG) -- fuer "Karte exportieren"-Buttons,
      // die das Bild direkt als Datei speichern wollen (URL.createObjectURL(blob)).
      async staticMapBlob({ center, zoom, size, maptype, markers } = {}) {
        const qs = new URLSearchParams({
          center, zoom: zoom || '12', size: size || '640x400', maptype: maptype || 'roadmap',
          ...(markers && { markers: JSON.stringify(markers) })
        });
        const res = await fetch(BASE + '/googlemaps/staticmap?' + qs.toString());
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw Object.assign(new Error('Static Map request failed'), { status: res.status, data: err });
        }
        return res.blob();
      }
    },

    // ---------- RapidAPI ----------
    rapidapi: {
      jobsSearch: (body) => postJSON('/rapidapi/jobs/search', body),
      yahooPrice: (symbol) => getJSON(`/rapidapi/yahoo/price/${symbol}`),
      yahooNews: (symbol) => getJSON(`/rapidapi/yahoo/news/${symbol}`),
      // Generischer Durchreicher fuer beliebige *.rapidapi.com-Microservices
      // (Mail-Sender, Translator, Dad-Jokes, ...) -- Host wird serverseitig validiert.
      raw: (host, endpoint, params, method) => postJSON('/rapidapi/raw', { host, endpoint, params, method })
    }
  };

  global.API = API;
})(window);

    // ==================== BACKTEST-VALIDIERTE EXIT-REGELN ====================
    // Vorher: jede der 4 Signalfunktionen hatte einen frei erfundenen Target/Stop
    // (±1%/±4%/±8%/±20%, je Funktion unterschiedlich, nie validiert). Jetzt: alle 4
    // Signale wurden 1:1 über 52 Standardwerte / 3 Jahre lookahead-frei rückgetestet
    // (Entry = Open(T+1), Exit-Regel-Sweep, Zweiperioden-Robustheitssplit -- siehe
    // genitus-midpoint-terminal/scripts/broker-ai-signals-backtest.js +
    // broker-ai-signals-backtest.html für die volle Methodik). Für alle 4 Signale war
    // "stop4pct_10d" (bis 10 Handelstage halten, -4%-Stop) die beste Regel nach
    // Sharpe-like -- Target/Stop unten kommen jetzt aus diesen echten Zahlen statt
    // Raten. WICHTIG: 3 von 4 Signalen zeigen im Zweiperioden-Split eine deutlich
    // schwächere zweite Hälfte (fading edge) -- siehe "robustness" unten, wird auch
    // in der Karte angezeigt.
    const BACKTEST_STATS = {
      monthly:   { n: 38220, avgRet: 0.1764, medianRet: -1.4631, winRate: 42.31, sharpeLike: 0.522, olderSharpe: 0.125, newerSharpe: 0.869, robustness: 'improving' },
      spread:    { n: 38847, avgRet: 0.1939, medianRet: -1.3538, winRate: 42.64, sharpeLike: 0.582, olderSharpe: 0.838, newerSharpe: 0.346, robustness: 'fading' },
      midpoint:  { n: 38956, avgRet: 0.1925, medianRet: -1.3634, winRate: 42.93, sharpeLike: 0.582, olderSharpe: 0.852, newerSharpe: 0.328, robustness: 'fading' },
      weeklySma: { n: 38779, avgRet: 0.1779, medianRet: -1.4129, winRate: 42.56, sharpeLike: 0.533, olderSharpe: 0.753, newerSharpe: 0.33,  robustness: 'fading' }
    };
    const VALIDATED_STOP_PCT = 4; // stop4pct_10d -- the actual VALIDATED mechanism, kept as-is.
    // (A sigma-normalized stop was considered instead, but rejected: the whole Smart-Target
    // finding below is that a FLAT stop's GBM touch-probability VARIES with each stock's own
    // vol -- and that variation is exactly what correlates with the edge. Normalizing the stop
    // to a constant sigma-distance would erase that variation, i.e. test a different, unvalidated
    // mechanism. So: stop stays flat 4%, target becomes BUCKET-aware (see below) -- that's the
    // part that's actually backed by data broken out this way.)
    function validatedTargetStop(price, direction, statsKey) {
      const stats = BACKTEST_STATS[statsKey];
      const sign = direction === 'LONG' ? 1 : -1;
      const target = price * (1 + sign * (stats.avgRet / 100));
      const stop = price * (1 - sign * (VALIDATED_STOP_PCT / 100));
      return { target: target.toFixed(2), stop: stop.toFixed(2), stats };
    }

    // Per-Vola-Bucket avgRet (aus genitus-midpoint-terminal/data/broker-ai-signals-backtest-result.json,
    // d.logics.<signal>.volFilter.<bucket>.avgRet) -- der blended Wert in BACKTEST_STATS oben mischt
    // alle 3 Buckets zusammen und verwässert damit genau den Effekt, den wir gefunden haben.
    const BACKTEST_STATS_BY_BUCKET = {
      monthly:   { far_lowP: -0.2037, mid_P: 0.1676, near_highP: 0.6901 },
      spread:    { far_lowP: -0.1332, mid_P: 0.2087, near_highP: 0.4653 },
      midpoint:  { far_lowP: -0.0443, mid_P: 0.1821, near_highP: 0.4395 },
      weeklySma: { far_lowP: -0.2102, mid_P: 0.2251, near_highP: 0.3741 }
    };
    // Smart Stop/Target: Stop bleibt die validierte flache -4%-Regel; Target nutzt jetzt den
    // tatsächlich für DIESES Vola-Regime gemessenen avgRet statt des verwässerten Signal-Durchschnitts.
    // Im far_lowP-Regime ist dieser Wert NEGATIV (kein Edge) -- wird explizit als "kein Trade
    // empfohlen" markiert, statt einen irreführenden positiven Zielkurs vorzutäuschen.
    function smartStopTarget(price, direction, statsKey, bucket) {
      const stats = BACKTEST_STATS[statsKey];
      const bucketAvgRet = (BACKTEST_STATS_BY_BUCKET[statsKey] && bucket) ? BACKTEST_STATS_BY_BUCKET[statsKey][bucket] : stats.avgRet;
      const sign = direction === 'LONG' ? 1 : -1;
      const noEdge = bucket === 'far_lowP';
      const target = price * (1 + sign * (bucketAvgRet / 100));
      const stop = price * (1 - sign * (VALIDATED_STOP_PCT / 100));
      return { target: target.toFixed(2), stop: stop.toFixed(2), stats, bucketAvgRet, noEdge };
    }

    // ==================== SMART-TARGET VOLA-FILTER ====================
    // Backtest-Fund (genitus-midpoint-terminal/scripts/broker-ai-smart-target-diagnosis.js):
    // die Performance aller 4 Signale hängt stark davon ab, wie "nah" der eigene -4%-Stop
    // GBM-rechnerisch am aktuellen Kurs liegt (First-Passage/Reflection-Principle, exakt wie
    // im Target-Scanner). "Ruhige" Setups (P(Touch)<40%) verlieren im Schnitt, "volatile"
    // Setups (P(Touch)>=70%) liefern trotz 60% Stop-Rate die beste risikoadjustierte
    // Performance -- klarer, konsistenter Gradient, kein Robustheits-Artefakt. Hier live
    // nachgerechnet und als Badge angezeigt, nicht nur im Backtest-Report.
    function normCDF(x) {
      const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
      const sign = x < 0 ? -1 : 1;
      const z = Math.abs(x) / Math.sqrt(2);
      const t = 1 / (1 + p * z);
      const erf = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-z * z);
      return 0.5 * (1 + sign * erf);
    }
    function estimateSigmaMu(prices) {
      const logReturns = [];
      for (let i = 1; i < prices.length; i++) {
        if (prices[i] > 0 && prices[i - 1] > 0) logReturns.push(Math.log(prices[i] / prices[i - 1]));
      }
      const n = logReturns.length;
      if (n < 20) return null;
      const mean = logReturns.reduce((a, b) => a + b, 0) / n;
      const variance = logReturns.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
      const sigma = Math.sqrt(variance * 252);
      const mu = mean * 252 + 0.5 * sigma * sigma;
      return { sigma, mu };
    }
    function probHitTarget(S, K, mu, sigma, T) {
      if (S === K) return 1.0;
      if (sigma <= 0 || T <= 0) return 0.0;
      const v = mu - 0.5 * sigma * sigma;
      const b = Math.abs(Math.log(K / S));
      const sigmaSqrtT = sigma * Math.sqrt(T);
      const d1 = (-b + v * T) / sigmaSqrtT;
      const d2 = (-b - v * T) / sigmaSqrtT;
      const pTouch = normCDF(d1) + Math.exp((2 * v * b) / (sigma * sigma)) * normCDF(d2);
      return Math.min(Math.max(pTouch, 0), 1);
    }
    function volBucketOf(p) { return p < 0.40 ? 'far_lowP' : p < 0.70 ? 'mid_P' : 'near_highP'; }
    const VOL_BUCKET_LABEL = {
      far_lowP:   '🔴 Ruhiges Regime -- laut Backtest KEIN Edge',
      mid_P:      '🟡 Mittleres Regime -- moderater Edge',
      near_highP: '🟢 Volatiles Regime -- beste risikoadjustierte Performance im Backtest'
    };
    async function getVolRegime(stockSymbol, price, direction) {
      try {
        const hist = await API.eod.historical(stockSymbol, { from: isoDaysAgo(400) });
        const closes = (Array.isArray(hist) ? hist : []).map(h => h.close).filter(c => c > 0);
        if (closes.length < 20) return null;
        const params = estimateSigmaMu(closes);
        if (!params) return null;
        const stopLevel = direction === 'LONG' ? price * (1 - VALIDATED_STOP_PCT / 100) : price * (1 + VALIDATED_STOP_PCT / 100);
        const pTouchStop = probHitTarget(price, stopLevel, params.mu, params.sigma, 10 / 252);
        return { pTouchStop, sigma: params.sigma, bucket: volBucketOf(pTouchStop) };
      } catch (e) {
        console.error('getVolRegime failed:', e);
        return null;
      }
    }

    async function getMonthlyAnalysis(stockSymbol) {
      const today = new Date();
      let lastMonth = today.getMonth();
      const year = (lastMonth === 0) ? today.getFullYear() - 1 : today.getFullYear();
      lastMonth = (lastMonth === 0) ? 11 : lastMonth - 1;

      const lastDayLastMonth = new Date(year, lastMonth + 1, 0);
      while (lastDayLastMonth.getDay() !== 5) {
        lastDayLastMonth.setDate(lastDayLastMonth.getDate() - 1);
      }

      const month = String(lastDayLastMonth.getMonth() + 1).padStart(2, '0');
      const day = String(lastDayLastMonth.getDate()).padStart(2, '0');
      const formattedDate = `${year}-${month}-${day}`;

      try {
        const monthlyData = await API.eod.historical(stockSymbol, { from: formattedDate, to: formattedDate });
        monthlyData.sort((a, b) => new Date(b.date) - new Date(a.date));
        const lastMonthClose = monthlyData.length ? monthlyData[0].close : null;

        if (!lastMonthClose) throw new Error("No monthly data available");

        const currentData = await API.eod.historical(stockSymbol, { from: isoDaysAgo(10) });
        currentData.sort((a, b) => new Date(b.date) - new Date(a.date));
        const latestClose = currentData.length ? currentData[0].close : null;

        if (!latestClose) throw new Error("No current data available");

        const position = latestClose > lastMonthClose ? "LONG" : "SHORT";
        const volRegime = await getVolRegime(stockSymbol, latestClose, position);
        const vts = smartStopTarget(latestClose, position, 'monthly', volRegime?.bucket);

        return {
          symbol: stockSymbol,
          recommendation: position,
          price: latestClose.toFixed(2),
          target: vts.target,
          stop: vts.stop,
          backtest: vts.stats,
          noEdge: vts.noEdge,
          volRegime,
          timestamp: new Date().getTime() / 1000,
          size: "10%"
        };
      } catch (error) {
        console.error('Error fetching monthly analysis:', error);
        throw error;
      }
    }

          recommendation,

    // ==================== NEU: KI-Analyse pro Signal-Karte ====================
    // Erste Version fragte das LLM nur mit Entry/Ziel/Stop -- das ergab bloss eine
    // Prosa-Wiederholung der ohnehin sichtbaren Prozentdifferenz ("Ziel bedeutet X%
    // Gewinn, Stop bedeutet Y% Verlust"), keine echte Analyse. Fix: zusaetzlich
    // objektive technische Kennzahlen aus den letzten ~20 Handelstagen berechnen
    // (Trend, Volatilitaet, Position im Hoch/Tief-Band -- der "algorithmische" Teil)
    // und dem LLM als Kontext geben, mit expliziter Anweisung, NICHT die Ziel/Stop-
    // Arithmetik nochmal zu wiederholen, sondern das Signal anhand dieser Kennzahlen
    // einzuordnen (der "intelligente" Teil).
    function computeTechnicalContext(history) {
      if (!history || history.length < 3) return null;
      const sorted = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));
      const closes = sorted.map(d => d.close);
      const highs = sorted.map(d => d.high ?? d.close);
      const lows = sorted.map(d => d.low ?? d.close);
      const first = closes[0];
      const last = closes[closes.length - 1];
      const trendPct = ((last - first) / first) * 100;
      const periodHigh = Math.max(...highs);
      const periodLow = Math.min(...lows);
      const distFromHighPct = ((last - periodHigh) / periodHigh) * 100;
      const distFromLowPct = ((last - periodLow) / periodLow) * 100;
      const dailyRanges = sorted.map(d => (((d.high ?? d.close) - (d.low ?? d.close)) / d.close) * 100);
      const avgDailyRangePct = dailyRanges.reduce((a, b) => a + b, 0) / dailyRanges.length;
      const trendLabel = trendPct > 2 ? 'Aufwärtstrend' : trendPct < -2 ? 'Abwärtstrend' : 'Seitwärtsbewegung';
      return {
        days: sorted.length,
        trendPct: trendPct.toFixed(1),
        trendLabel,
        periodHigh: periodHigh.toFixed(2),
        periodLow: periodLow.toFixed(2),
        distFromHighPct: distFromHighPct.toFixed(1),
        distFromLowPct: distFromLowPct.toFixed(1),
        avgDailyRangePct: avgDailyRangePct.toFixed(1)
      };
    }

                    <div class="space-y-2 md:space-y-3 font-mono text-sm md:text-base">
                      ${data.noEdge ? `
                      <div class="bg-red-100 dark:bg-red-900/40 border border-red-400 dark:border-red-700 text-red-800 dark:text-red-300 text-xs md:text-sm font-bold p-2 rounded text-center">
                        ⛔ KEIN TRADE EMPFOHLEN -- ruhiges Vola-Regime, laut Backtest kein Edge
                      </div>` : ''}
                      <div class="flex justify-between items-center bg-gray-100 dark:bg-gray-800 p-2 rounded">
                        <span class="text-gray-900 dark:text-white">ENTRY</span>
                        <div class="flex items-center gap-2">
                          <span class="font-bold ${data.recommendation === 'LONG' ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                            ${data.recommendation} ${data.price}
                          </span>
                        </div>
                      </div>

                      <div class="flex justify-between items-center ${data.noEdge ? 'bg-gray-100 dark:bg-gray-800 opacity-60' : 'bg-blue-50 dark:bg-blue-950'} p-2 rounded">
                        <span class="text-gray-900 dark:text-white">TARGET${data.noEdge ? ' (unplausibel)' : ''}</span>
                        <div class="flex items-center gap-2">
                          <span class="font-bold ${data.noEdge ? 'text-gray-500' : 'text-blue-600 dark:text-blue-400'}">${data.target}</span>
                        </div>
                      </div>

                      <div class="flex justify-between items-center bg-orange-50 dark:bg-orange-950 p-2 rounded">
                        <span class="text-gray-900 dark:text-white">STOP</span>
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-orange-600 dark:text-orange-400">${data.stop}</span>
                        </div>
                      </div>

                      <div class="flex justify-between items-center border-t border-gray-200 dark:border-gray-700 pt-2 mt-2">
                        <span class="text-gray-900 dark:text-white">SIZE</span>
                        <span class="font-bold text-gray-900 dark:text-white">${data.size}</span>
                      </div>
                      ${data.backtest ? `
                      <div class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 border-t border-gray-200 dark:border-gray-700 pt-2 mt-1">
                        <div>📊 Backtest (n=${data.backtest.n.toLocaleString('de-DE')}, 10d/-4%-Stop): WinRate ${data.backtest.winRate}% · Ø${data.backtest.avgRet}% · Sharpe ${data.backtest.sharpeLike}</div>
                        <div class="mt-0.5">${
                          data.backtest.robustness === 'fading'
                            ? '⚠️ Edge schwächt sich in neuerer Hälfte ab (nicht robust)'
                            : data.backtest.robustness === 'improving'
                              ? '📈 Edge verstärkt sich in neuerer Hälfte'
                              : '✅ Robust über beide Zeithälften'
                        }</div>
                      </div>` : ''}
                      ${data.volRegime ? `
                      <div class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 border-t border-gray-200 dark:border-gray-700 pt-2 mt-1">
                        <div>🎯 Smart-Target-Filter: P(Touch -4%-Stop in 10d) = ${(data.volRegime.pTouchStop*100).toFixed(0)}% (σ=${(data.volRegime.sigma*100).toFixed(1)}%)</div>
                        <div class="mt-0.5">${VOL_BUCKET_LABEL[data.volRegime.bucket]}</div>
                      </div>` : ''}
                    </div>

                    <button class="ai-analyse-btn w-full mt-3 px-3 py-2 text-white rounded-md text-sm font-semibold flex items-center justify-center gap-2">
                      🤖 KI-Analyse
                    </button>
                    <div class="ai-analyse-result mt-2 text-xs md:text-sm text-gray-700 dark:text-gray-300" style="display:none;"></div>
                  </div>
                </div>
              </div>
            `;

            container.insertAdjacentHTML('beforeend', comicHTML);
            const insertedPanel = container.lastElementChild;
            const analyseBtn = insertedPanel.querySelector('.ai-analyse-btn');
            analyseBtn.addEventListener('click', () => runAIAnalysis(analyseBtn, data));
          } catch (error) {
            console.error(`Error processing ${symbol}:`, error);
          }
        }
      } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="w-full text-center py-8 text-red-600">Error loading data. Please try again.</div>';
      }
    }

    function downloadCSV() {
      const container = document.getElementById("stockInfoContainer");
      if (!container) return;

      const trades = Array.from(container.querySelectorAll('.comic-panel')).map(panel => {
        const symbol = panel.querySelector('h3')?.textContent?.trim() || '';
        const entryText = panel.querySelector('.bg-gray-100 .font-bold, .bg-gray-800 .font-bold')?.textContent?.trim() || '';
        const target = panel.querySelector('.bg-blue-50 .font-bold, .bg-blue-950 .font-bold')?.textContent?.trim() || '';
        const stop = panel.querySelector('.bg-orange-50 .font-bold, .bg-orange-950 .font-bold')?.textContent?.trim() || '';
        const sizeElements = panel.querySelectorAll('.border-t .font-bold');
        const size = sizeElements[sizeElements.length - 1]?.textContent?.trim() || '';

        return { symbol, entry: entryText, target, stop, size };
      });

      const csvContent = [
        ['Symbol', 'Entry', 'Target', 'Stop', 'Size'],
        ...trades.map(trade => [trade.symbol, trade.entry, trade.target, trade.stop, trade.size])
      ].map(row => row.join(',')).join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'broker_trades.csv';
      link.click();
    }

    function downloadTXT() {
      const container = document.getElementById("stockInfoContainer");
      if (!container) return;

      const trades = Array.from(container.querySelectorAll('.comic-panel')).map(panel => {
        const symbol = panel.querySelector('h3')?.textContent?.trim() || '';
        const entryText = panel.querySelector('.bg-gray-100 .font-bold, .bg-gray-800 .font-bold')?.textContent?.trim() || '';
        const target = panel.querySelector('.bg-blue-50 .font-bold, .bg-blue-950 .font-bold')?.textContent?.trim() || '';
        const stop = panel.querySelector('.bg-orange-50 .font-bold, .bg-orange-950 .font-bold')?.textContent?.trim() || '';
        const sizeElements = panel.querySelectorAll('.border-t .font-bold');
        const size = sizeElements[sizeElements.length - 1]?.textContent?.trim() || '';

        return `
Trade Signal for ${symbol}
------------------------
Entry: ${entryText}
Target: ${target}
Stop: ${stop}
Size: ${size}`;
      }).join('\n\n');

      const blob = new Blob([trades], { type: 'text/plain;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'broker_trades.txt';
      link.click();
    }

    // Enter key support for manual symbol input
    document.getElementById('manualSymbol').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        fetchStockData();
      }
    });
  </script>
</body>
</html>
