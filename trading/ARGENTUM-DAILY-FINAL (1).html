<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ARGENTUM // VECTOR MATRIX v8.5</title>
    <style>
        :root {
            --bg: #030108;
            --panel: #0b0616;
            --panel-inner: #130a24;
            --border: #4a157d;
            --accent: #00f0ff;
            --green: #00ffaa;
            --red: #ff0055;
            --gold: #ffb700;
            --white: #e9e9f0;
            --muted: #7c6f94;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--white); font-family: 'Segoe UI', sans-serif; padding: 24px; }
        
        .container {
            max-width: 1300px;
            margin: auto;
            background-color: var(--panel);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 0 35px rgba(162, 0, 255, 0.25);
        }

        h1 { color: var(--accent); text-align: center; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; font-weight: 900; }
        .subtitle { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 1px; margin-bottom: 24px; }

        .control-panel {
            display: flex; gap: 16px; background: var(--panel-inner); border: 1px solid var(--border);
            padding: 16px; border-radius: 6px; margin-bottom: 24px; align-items: flex-end; flex-wrap: wrap;
        }
        .control-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
        .control-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: bold; }
        
        select, input {
            background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 10px 14px;
            border-radius: 4px; font-size: 14px; width: 100%;
        }
        .input-highlight { border-color: var(--accent); }

        .btn {
            background: transparent; color: var(--accent); border: 2px solid var(--accent);
            padding: 10px 24px; font-weight: bold; border-radius: 4px; cursor: pointer;
            transition: all 0.2s ease; height: 42px; text-transform: uppercase; font-size: 13px;
        }
        .btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

        #progress { font-size: 13px; color: var(--gold); margin-bottom: 12px; font-weight: bold; display: none; }

        .table-container { background: var(--panel-inner); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { font-size: 11px; color: var(--accent); text-transform: uppercase; border-bottom: 2px solid var(--border); padding: 12px; letter-spacing: 1px; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 14px; }
        
        .row-strong { background: rgba(0, 255, 170, 0.04) !important; border-left: 4px solid var(--green); }
        .row-weak { background: rgba(255, 0, 85, 0.04) !important; border-left: 4px solid var(--red); }

        .badge { font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 3px; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px; }
        .bg-strong { background: rgba(0, 255, 170, 0.15); color: var(--green); border: 1px solid var(--green); }
        .bg-weak { background: rgba(255, 0, 85, 0.15); color: var(--red); border: 1px solid var(--red); }
        .bg-neutral { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid #555; }

        .text-green { color: var(--green); font-weight: bold; }
        .text-red { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>ARGENTUM // VECTOR MATRIX v8.5</h1>
    <div class="subtitle">NORMED PERFORMANCE RELATIVE STRENGTH & CUSTOM BENCHMARK MATRIX</div>

    <div class="control-panel">
        <div class="control-group">
            <label>Benchmark Modus</label>
            <select id="benchMode" onchange="toggleBenchInput()">

                <option value="custom">✍️ Manueller Custom Ticker</option>
            </select>
        </div>
        <div class="control-group" id="presetGroup">
            <label>Benchmark Index Preset</label>

                <option value="QQQ">🚀 NASDAQ 100 ETF (QQQ)</option>
            </select>
        </div>
        <div class="control-group" id="customGroup" style="display: none;">
            <label>Custom Benchmark Ticker</label>
            <input type="text" id="customBenchInput" class="input-highlight" placeholder="z.B. C, IWM, GLD, BTC-USD">
        </div>
        <div class="control-group">
            <label>Asset Cluster</label>
            <select id="clusterSelect">

                <option value="cac40">🇫🇷 CAC 40</option>
                <option value="smi">🇨🇭 SMI SWITZERLAND</option>
                <option value="atx">🇦🇹 ATX VIENNA</option>
                <option value="aex">🇳🇱 AEX AMSTERDAM</option>
                <option value="ibex">🇪🇸 IBEX 35 SPAIN</option>
                <option value="omx_stockholm">🇸🇪 OMXS30 STOCKHOLM</option>
                <option value="omx_copenhagen">🇩🇰 OMXC25 COPENHAGEN</option>
                <option value="bel20">🇧🇪 BEL 20 BRUSSELS</option>
                <option value="psi">🇵🇹 PSI LISBON</option>
                <option value="tsx">🇨🇦 TSX CANADA</option>
                <option value="asx">🇦🇺 ASX AUSTRALIA</option>
                <option value="bovespa">🇧🇷 BOVESPA BRAZIL</option>
                <option value="nse_direct">🇮🇳 NSE INDIA (NIFTY)</option>
                <option value="zse">🇭🇷 ZSE ZAGREB</option>
                <option value="krx">🇰🇷 KRX SOUTH KOREA</option>
                <option value="crypto">₿ CRYPTO TOP 10</option>
            </select>
        </div>
        <div class="control-group" style="max-width: 100px;">
            <label>Z-Score Cut</label>
            <input type="number" id="zLimitInput" value="0.75" step="0.05">
        </div>
        <button class="btn" onclick="executeMatrixScanV85()">VECTOR ANALYSIS STARTEN</button>
    </div>

    <div id="progress">Initialisiere Analyse-Vektoren...</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Close (A)</th>
                    <th>Bench Close</th>
                    <th>Z-Score (Normed 20D)</th>
                    <th>Alpha Matrix Status</th>
                    <th>Confidence</th>
                    <th>Empfohlenes Pair-Hedge Setup</th>
                </tr>
            </thead>
            <tbody id="bulkTableBody">

                        Konfiguriere Benchmark und starte das Rendite-Matrix-Grid.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

        "crypto": ["BTC-USD.CC", "ETH-USD.CC", "BNB-USD.CC", "SOL-USD.CC", "XRP-USD.CC", "DOGE-USD.CC", "ADA-USD.CC", "DOT-USD.CC", "LINK-USD.CC", "LTC-USD.CC"]
    };

    function toggleBenchInput() {
        const mode = document.getElementById('benchMode').value;
        document.getElementById('presetGroup').style.display = mode === 'preset' ? 'block' : 'none';
        document.getElementById('customGroup').style.display = mode === 'custom' ? 'block' : 'none';
    }

    async function fetchEodData(symbol) {
        try {
            let cleanSym = symbol.toUpperCase().trim();
            const response = await fetch(`${BASE_API}?symbol=${cleanSym}&endpoint=historical&period=d`);
            if (!response.ok) return null;
            return await response.json();
        } catch (e) {
            console.error(`Error fetching ${symbol}:`, e);
            return null;
        }
    }

    async function executeMatrixScanV85() {
        const mode = document.getElementById('benchMode').value;
        let benchmark = mode === 'preset' ? document.getElementById('benchmarkSelect').value : document.getElementById('customBenchInput').value;
        const clusterKey = document.getElementById('clusterSelect').value;
        const zLimit = parseFloat(document.getElementById('zLimitInput').value) || 0.75;
        
        const tbody = document.getElementById('bulkTableBody');
        const progress = document.getElementById('progress');

        if (!benchmark) {
            alert("Bitte einen gültigen Benchmark-Ticker eingeben!");
            return;
        }

        tbody.innerHTML = '';
        progress.style.display = 'block';

        progress.textContent = `Lade Benchmark-Struktur-Matrix: ${benchmark}...`;
        const rawBenchData = await fetchEodData(benchmark);
        if (!rawBenchData || rawBenchData.length < 22) {
            progress.textContent = `❌ Fehler: Benchmark ${benchmark} lieferte keine Daten.`;
            return;
        }
        rawBenchData.sort((a, b) => new Date(b.date) - new Date(a.date));

        const symbols = clusterUniverse[clusterKey];
        
        for(let i = 0; i < symbols.length; i++) {
            const sym = symbols[i];
            progress.textContent = `Berechne relative Performance-Matrix ${i+1}/${symbols.length}: ${sym}...`;
            
            const rawAssetData = await fetchEodData(sym);
            if (!rawAssetData || rawAssetData.length < 22) continue;
            rawAssetData.sort((a, b) => new Date(b.date) - new Date(a.date));

            // --- V8.5 CORE: NORMIERTER PERFORMANCE-SPREAD ---
            let normSpreads = [];
            let iterations = Math.min(20, rawAssetData.length, rawBenchData.length);
            
            let assetBase = parseFloat(rawAssetData[iterations - 1].close);
            let benchBase = parseFloat(rawBenchData[iterations - 1].close);

            for(let k = 0; k < iterations; k++) {
                let assetPerf = (parseFloat(rawAssetData[k].close) - assetBase) / assetBase;
                let benchPerf = (parseFloat(rawBenchData[k].close) - benchBase) / benchBase;
                normSpreads.push(assetPerf - benchPerf);
            }

            const currentSpread = normSpreads[0];
            const meanSpread = normSpreads.reduce((s, v) => s + v, 0) / normSpreads.length;
            const variance = normSpreads.reduce((s, v) => s + Math.pow(v - meanSpread, 2), 0) / normSpreads.length;
            const stdDev = Math.sqrt(variance);

            const zScore = (currentSpread - meanSpread) / (stdDev || 0.01);

            // --- V8.5 SMARTER EXECUTION ENGINE (TREND VS MEAN REVERSION) ---
            let statusText = "SYNCHRON";
            let badgeClass = "bg-neutral";
            let rowClass = "";
            let actionText = "Neutral. Synchroner Gleichlauf zum Core.";
            let confidence = Math.round(100 - (Math.abs(zScore) * 45));

            let displaySym = sym.replace('.US', '').replace('.CC', '');
            let displayBench = benchmark.replace('.US', '').replace('.CC', '');

            // Extremwert-Filter für Mean Reversion (Gummiband-Kollaps)
            if (zScore <= -2.00) {
                statusText = "💥 EXTREME UNWUCHT (REVERSAL)";
                badgeClass = "bg-strong"; 
                rowClass = "row-strong";
                confidence = Math.min(95, Math.round(40 + (Math.abs(zScore) * 15)));
                actionText = `🔥 **ANTIZYKLISCH:** <span class="text-green">BUY ${displaySym}</span> // <span class="text-red">SHORT ${displayBench}</span> (Spread-Rebound)`;
            } 
            else if (zScore >= 2.00) {
                statusText = "💥 EXT. ÜBERHITZUNG (REVERSAL)";
                badgeClass = "bg-weak"; 
                rowClass = "row-weak";
                confidence = Math.min(95, Math.round(40 + (zScore * 15)));
                actionText = `🔥 **ANTIZYKLISCH:** <span class="text-red">SHORT ${displaySym}</span> // <span class="text-green">BUY ${displayBench}</span> (Spread-Kollaps)`;
            }
            // Reguläre Trendfolge innerhalb des Z-Score-Limits
            else if (zScore >= zLimit) {
                statusText = "RELATIVE STÄRKE (TREND)";
                badgeClass = "bg-strong";
                rowClass = "row-strong";
                confidence = Math.min(99, Math.round(50 + (zScore * 20)));
                actionText = `<span class="text-green">BUY ${displaySym}</span> // <span class="text-red">SHORT ${displayBench}</span>`;
            } else if (zScore <= -zLimit) {
                statusText = "RELATIVE SCHWÄCHE (TREND)";
                badgeClass = "bg-weak";
                rowClass = "row-weak";
                confidence = Math.min(99, Math.round(50 + (Math.abs(zScore) * 20)));
                actionText = `<span class="text-red">SHORT ${displaySym}</span> // <span class="text-green">BUY ${displayBench}</span>`;
            }

            if (confidence < 5) confidence = 8;

            const assetClose = parseFloat(rawAssetData[0].close);
            const benchClose = parseFloat(rawBenchData[0].close);
            const assetDec = assetClose < 5 ? 4 : 2;

            const row = `
                <tr class="${rowClass}">
                    <td><strong>${displaySym}</strong></td>
                    <td>$${assetClose.toFixed(assetDec)}</td>
                    <td>$${benchClose.toFixed(2)}</td>
                    <td style="font-weight:bold;" class="${zScore >= 0 ? 'text-green' : 'text-red'}">${zScore.toFixed(2)}</td>
                    <td><span class="badge ${badgeClass}">${statusText}</span></td>
                    <td style="color:var(--gold); font-weight:bold;">${confidence}%</td>
                    <td><strong>${actionText}</strong></td>
                </tr>
            `;
            tbody.insertAdjacentHTML('beforeend', row);
            
            // Optimaler API Rate-Limit-Schutz
            await new Promise(r => setTimeout(r, 350));
        }

        progress.style.display = 'none';
    }
</script>

</body>
</html>
