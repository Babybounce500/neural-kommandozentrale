      { cmd: "news",        args: "[ticker]",         cat: "📈 Fintech Pro" },
      { cmd: "alert",       args: "",                 cat: "📈 Fintech Pro" },
      { cmd: "macro",       args: "",                 cat: "📈 Fintech Pro" },

      { cmd: "split",       args: "[ticker]",         cat: "📈 Fintech Pro",  hidden: true },
      { cmd: "pivot",       args: "[ticker]",         cat: "📈 Fintech Pro",  hidden: true },
      { cmd: "range",       args: "[ticker]",         cat: "📈 Fintech Pro",  hidden: true },
      { cmd: "rsi",         args: "[ticker]",         cat: "📈 Fintech Pro",  hidden: true },
      // ── DEV TOOLS ──────────────────────────────────────────────────────
      // ── DESIGN & COLOR ─────────────────────────────────────────────────
      // ── UTILITIES ──────────────────────────────────────────────────────
      { cmd: "calc",        args: "[expr]",           cat: "⚙️ Utilities" },      // ── MEDIA ──────────────────────────────────────────────────────────
      // ── OFFICE ─────────────────────────────────────────────────────────
      // ── AGENTIC ────────────────────────────────────────────────────────      // ── SYSTEM ─────────────────────────────────────────────────────────
      { cmd: "clear",       args: "",                 cat: "🔧 System" },
    ];

    window.onload = function() {
        logToTerminal("system", `# ⚡ DANIEL.AI ENGINE v8.5 ULTRA-LEAN EDITION\n\n## 📊 CORE CAPABILITIES\n✓ **20 Commands** - Finance + LLM + Math focused\n✓ **LLM Models:** OpenAI · Claude · Mistral\n✓ **Finance/Trading:** heikin · broker · ticker · funds · fx\n✓ **Fintech Pro:** news · alert · macro · regime · hedge · split · pivot · range · rsi\n✓ **Math/Calc:** calc\n\n## 🎯 QUICK START\n\`\`\`\ncalc 2+2              → Math expressions\nheikin SAP.XETRA      → Candlestick analysis\nfx 100 EUR USD        → Currency conversion\nchat [message]        → OpenAI GPT\nclaude [message]      → Claude AI\ncode [prompt]         → Code generation\nmacro                 → Market macro analysis\nalert                 → Market alerts\n\`\`\`\n\n**☰ COMMANDS** (Burger Menu) to browse all 20 commands!`);
        renderSidebarBadges();
    };

    // ════════════════════════════════════════════════════════════════════════════════
    // ──── AUTOCOMPLETE + COMMAND HISTORY (LocalStorage) ────────────────────────────
    // ════════════════════════════════════════════════════════════════════════════════

    const CommandHistory = {
        MAX_ITEMS: 25,
        STORAGE_KEY: 'daniel_command_history',

        get() {
            const stored = localStorage.getItem(this.STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        },

        add(command) {
            if (!command.trim()) return;
            const history = this.get();
            // Remove duplicates (keep most recent)
            const filtered = history.filter(h => h.cmd !== command);
            // Add new with timestamp
            const updated = [
                { cmd: command, ts: Date.now() },
                ...filtered
            ].slice(0, this.MAX_ITEMS);
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(updated));
        },

        clear() {
            localStorage.removeItem(this.STORAGE_KEY);
        }
    };

    // AutoComplete Dropdown Manager
    const AutoComplete = {
        dropdown: document.getElementById('autocompleteDropdown'),
        input: userPromptElement,
        selectedIndex: -1,
        filteredItems: [],

        init() {
            this.input.addEventListener('input', () => this.onInput());
            this.input.addEventListener('focus', () => this.onFocus());
            this.input.addEventListener('blur', () => setTimeout(() => this.hide(), 200));
            this.input.addEventListener('keydown', (e) => this.onKeydown(e));
            document.addEventListener('click', (e) => {
                if (e.target !== this.input && e.target !== this.dropdown) {
                    this.hide();
                }
            });
        },

        onInput() {
            const query = this.input.value.trim();
            if (!query) {
                this.showHistory();
                return;
            }
            this.filterAndShow(query);
        },

        onFocus() {
            const query = this.input.value.trim();
            if (!query) {
                this.showHistory();
            } else {
                this.filterAndShow(query);
            }
        },

        showHistory() {
            const history = CommandHistory.get();
            if (history.length === 0) {
                this.hide();
                return;
            }
            this.filteredItems = history.map(h => h.cmd);
            this.render(true);
        },

        filterAndShow(query) {
            // Fuzzy match: "ch h" → matches "chat hallo"
            const words = query.split(/\s+/);
            const allCmds = allCommands.map(c => c.cmd);
            const history = CommandHistory.get().map(h => h.cmd);

            // Combine: recent history first, then all commands
            const combined = [...new Set([...history, ...allCmds])];

            this.filteredItems = combined.filter(cmd => {
                return words.every(word => cmd.toLowerCase().includes(word.toLowerCase()));
            });

            this.render(false);
        },

        render(isHistory) {
            this.dropdown.innerHTML = '';
            this.selectedIndex = -1;

            if (this.filteredItems.length === 0) {
                this.hide();
                return;
            }

            const section = document.createElement('div');
            section.style.cssText = 'padding:8px;color:#999;font-size:9px;letter-spacing:1px;border-bottom:1px solid #333;';
            section.textContent = isHistory ? '⏱ RECENT' : '🔍 MATCHING';
            this.dropdown.appendChild(section);

            this.filteredItems.slice(0, 12).forEach((cmd, idx) => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.style.cssText = `
                  padding:10px 12px;
                  cursor:pointer;
                  border-bottom:1px solid #222;
                  color:#d4d4d4;
                  font-family:monospace;
                  font-size:12px;
                  transition:all 0.15s;
                  user-select:none;
                `;

                item.textContent = '$ ' + cmd;
                item.onmouseover = () => {
                    this.selectedIndex = idx;
                    this.highlightSelected();
                };
                item.onclick = () => {
                    this.select(cmd);
                };

                this.dropdown.appendChild(item);
            });

            this.show();
        },

        onKeydown(e) {
            if (this.dropdown.style.display === 'none') return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                this.selectedIndex = (this.selectedIndex + 1) % this.filteredItems.length;
                this.highlightSelected();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                this.selectedIndex = (this.selectedIndex - 1 + this.filteredItems.length) % this.filteredItems.length;
                this.highlightSelected();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (this.selectedIndex >= 0) {
                    this.select(this.filteredItems[this.selectedIndex]);
                }
            } else if (e.key === 'Escape') {
                this.hide();
            }
        },

        highlightSelected() {
            const items = this.dropdown.querySelectorAll('.autocomplete-item');
            items.forEach((item, idx) => {
                if (idx === this.selectedIndex) {

    const MobileAutofill = {
      isMobile: /iPhone|iPad|iPod|Android/.test(navigator.userAgent),
      suggestionBox: null,

      init() {
        if (!this.isMobile) return;
        const input = document.getElementById('userPrompt');
        this.suggestionBox = document.createElement('div');
        this.suggestionBox.id = 'mobileSuggestions';
        this.suggestionBox.style.cssText = 'position:fixed;bottom:100%;left:8px;right:8px;background:#1a1a1a;border:1px solid #39ff14;border-radius:6px 6px 0 0;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:4px;z-index:999;display:none;';
        document.body.appendChild(this.suggestionBox);
        input.addEventListener('input', (e) => this.suggest(e.target.value));
        input.addEventListener('focus', () => !input.value && this.showRecent());
        input.addEventListener('blur', () => setTimeout(() => this.hide(), 150));
      },

      suggest(query) {
        if (!query || query.length < 2) { this.showRecent(); return; }
        const matches = allCommands.filter(c => c.cmd.toLowerCase().includes(query.toLowerCase())).slice(0, 6);
        this.render(matches, query);
      },

      showRecent() {
        const recent = CommandHistory.get().slice(0, 6).map(h => h.cmd);
        if (recent.length === 0) { this.hide(); return; }
        this.render(recent.map(cmd => ({ cmd })), '');
      },

      render(items, query) {
        this.suggestionBox.innerHTML = '';
        if (items.length === 0) { this.hide(); return; }
        items.forEach(item => {
          const div = document.createElement('div');
          const cmd = item.cmd || item;
          const hl = query ? cmd.replace(new RegExp(`(${query})`, 'gi'), '<span style="color:#39ff14">$1</span>') : cmd;
          div.innerHTML = `<span style="color:#999">$</span> ${hl}`;
          div.style.cssText = 'padding:10px 12px;border-bottom:1px solid #222;cursor:pointer;font-size:12px;font-family:monospace;color:#d4d4d4;';
          div.onclick = () => this.select(cmd);
          div.onmouseover = () => { div.style.background = 'rgba(57,255,20,0.1)'; div.style.borderLeft = '3px solid #39ff14'; div.style.paddingLeft = '9px'; };
          div.onmouseout = () => { div.style.background = 'transparent'; div.style.borderLeft = 'none'; div.style.paddingLeft = '12px'; };
          this.suggestionBox.appendChild(div);
        });
        this.show();
      },

      select(cmd) {
        document.getElementById('userPrompt').value = cmd;
        this.hide();
        document.getElementById('userPrompt').focus();
      },

      show() { this.suggestionBox.style.display = 'block'; },
      hide() { this.suggestionBox.style.display = 'none'; }
    };

    // ── MONACO-STYLE CODE BLOCK RENDERER ────────────────────────────────
    const LANG_COLORS = {
        html:'#e44d26', htm:'#e44d26', css:'#264de4', javascript:'#f0db4f',
        js:'#f0db4f', typescript:'#3178c6', ts:'#3178c6', python:'#3572A5',
        py:'#3572A5', bash:'#89e051', sh:'#89e051', shell:'#89e051',
        json:'#cbcb41', sql:'#336791', xml:'#f16529', yaml:'#cc1018',
        markdown:'#083fa1', md:'#083fa1', plaintext:'#888', text:'#888'
    };

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderCodeBlock(lang, code) {
        const l = (lang || 'code').toLowerCase();
        const color = LANG_COLORS[l] || '#39ff14';
        const isHtml = ['html','htm'].includes(l);
        const id = 'cb' + Math.random().toString(36).substr(2,8);

        let highlighted = escHtml(code);
        try {
            if (window.hljs) {
                const res = window.hljs.getLanguage(l)
                    ? window.hljs.highlight(code, { language: l, ignoreIllegals: true })
                    : window.hljs.highlightAuto(code);
                highlighted = res.value;
            }
        } catch(e) {}

        const runBtn = isHtml
            ? `<button class="monaco-btn monaco-run" onclick="runHtmlBlock('${id}')">▶ Run HTML</button>`
            : '';

        return `<div class="monaco-block" id="${id}">

    </div>
  </div>
  <pre class="monaco-pre"><code class="monaco-code hljs">${highlighted}</code></pre>
</div>`;
    }

    // Full markdown support: headings, lists, bold, italic, code
    function markdownInline(text) {
        let html = escHtml(text);

        // Headings: # H1, ## H2, ### H3
        html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');

        // Bold: **text**
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        // Italic: *text*
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

        // Inline code: `code`
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Line breaks for lists
        html = html.replace(/^- (.*?)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*?<\/li>)/s, '<ul>$1</ul>');
        html = html.replace(/<\/ul>\s*<ul>/g, '');

        // Ordered lists: 1. item
        html = html.replace(/^\d+\. (.*?)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*?<\/li>)/s, match => {
            if (!match.includes('<ul>')) return `<ol>${match}</ol>`;
            return match;
        });
        html = html.replace(/<\/ol>\s*<ol>/g, '');

        // Line breaks (convert \n\n to <br><br>)
        html = html.replace(/\n\n/g, '<br><br>');

        return html;
    }

    // ──── LECODE-STYLE CHAT DISPLAY: Proper prose + code block separation ────
    function updateChatDisplay() {
        chatHistoryElement.innerHTML = "";
        chatHistory.forEach((message, idx) => {
            if (!message.content) return;

            const messageDiv = document.createElement("div");
            messageDiv.classList.add(message.role === "user" ? "msg-user" : "msg-assistant");

            // Model Badge für Assistant Messages
            if (message.role === 'assistant') {
                const badge = document.createElement("small");
                badge.style.cssText = 'color: #0099ff; display: block; margin-bottom: 8px; font-size: 10px; letter-spacing: 1px; font-weight: bold;';
                badge.textContent = '🤖 CLAUDE RESPONSE';
                messageDiv.appendChild(badge);
            }

            // Extended Code Block Regex - ROBUST VERSION
            // Supports: ```language\ncode\n``` with flexible spacing and edge cases
            const codeBlockRegex = /```\s*([a-z0-9+\-]*)\s*[\r\n]+([\s\S]*?)[\r\n]+```/gi;
            let lastIndex = 0;
            let match;

            while ((match = codeBlockRegex.exec(message.content)) !== null) {
                // Prose before code block
                if (match.index > lastIndex) {
                    const proseText = message.content.substring(lastIndex, match.index).trim();
                    if (proseText) {
                        const proseDiv = document.createElement("div");
                        proseDiv.className = "ai-prose";
                        // Process markdown: escape HTML first, then apply formatting
                        let html = escHtml(proseText);
                        // Markdown headings (must be before other processing)
                        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>')
                                  .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                                  .replace(/^# (.+)$/gm, '<h1>$1</h1>');
                        // Code formatting
                        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                        // Bold formatting
                        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                        // Double newlines to breaks
                        html = html.replace(/\n\n/g, '<br><br>');
                        proseDiv.innerHTML = html;
                        messageDiv.appendChild(proseDiv);
                    }
                }

                // Code Block with COPY + RUN buttons
                const codeId = 'code-' + Math.random().toString(36).substr(2, 8);
                // Extract code and language from regex groups
                const codeContent = match[2].trim();  // Group 2 = code content (NEW)
                let language = match[1] ? match[1].toLowerCase().trim() : 'plaintext';  // Group 1 = language hint

                // If language not specified in fence, auto-detect from content
                if (!match[1] || match[1].trim() === '') {
                    language = 'plaintext';
                    if (codeContent.includes('<!DOCTYPE') || codeContent.includes('<html') || codeContent.includes('<div') || codeContent.includes('</')) language = 'html';
                    else if (codeContent.includes('function ') || codeContent.includes('const ') || codeContent.includes('let ') || codeContent.includes('=>') || codeContent.includes('document.')) language = 'javascript';
                    else if (codeContent.includes('def ') || codeContent.includes('import ') && codeContent.includes('python')) language = 'python';
                    else if (codeContent.includes('import java') || codeContent.includes('public class')) language = 'java';
                    else if (codeContent.includes('<?php')) language = 'php';
                    else if (codeContent.match(/^{\s*"/) || codeContent.includes('"') && codeContent.includes(':')) language = 'json';
                    else if (codeContent.includes('<?xml')) language = 'xml';
                }

                // Create wrapper div for code block
                const codeWrapper = document.createElement("div");
                codeWrapper.id = codeId;
                codeWrapper.style.cssText = 'position:relative;margin:10px 0;border:1px solid #39ff14;border-radius:6px;background:#1a1a1a;';

                // Header with language badge ONLY
                const header = document.createElement("div");
                header.style.cssText = 'background:#0a0a0a;padding:8px 12px;border-bottom:1px solid #39ff14;';

                const langBadge = document.createElement("span");
                langBadge.style.cssText = 'color:#39ff14;font-size:10px;font-weight:bold;letter-spacing:1px;';
                langBadge.textContent = `⬛ ${language}`;
                header.appendChild(langBadge);
                codeWrapper.appendChild(header);

                const pre = document.createElement("pre");
                pre.style.cssText = 'margin:0;padding:12px;overflow-x:auto;';
                const codeElement = document.createElement("code");
                codeElement.className = `language-${language}`;
                codeElement.textContent = codeContent;
                pre.appendChild(codeElement);
                codeWrapper.appendChild(pre);

                // FOOTER with all buttons
                const footer = document.createElement("div");
                footer.style.cssText = 'background:#0a0a0a;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid #39ff14;';

                // COPY button - WHITE styling
                const copyBtn = document.createElement("button");
                copyBtn.className = "btn-utility";
                copyBtn.textContent = "⧉ COPY";
                copyBtn.style.cssText = 'padding:6px 10px;font-size:10px;cursor:pointer;border:1px solid #ffffff;background:transparent;color:#ffffff;border-radius:3px;transition:all 0.2s;flex:1;';
                copyBtn.onclick = () => {
                    const codeEl = document.querySelector('#' + codeId + ' code');
                    if (codeEl) {
                        navigator.clipboard.writeText(codeEl.textContent).then(() => {
                            copyBtn.textContent = '✓ COPIED';
                            copyBtn.style.background = '#ffffff';
                            copyBtn.style.color = '#000';
                            setTimeout(() => {
                                copyBtn.textContent = '⧉ COPY';
                                copyBtn.style.background = 'transparent';
                                copyBtn.style.color = '#ffffff';
                            }, 2000);
                        });
                    }
                };
                footer.appendChild(copyBtn);

                // DOWNLOAD HTML button
                const downloadHtmlBtn = document.createElement("button");
                downloadHtmlBtn.className = "btn-utility";
                downloadHtmlBtn.textContent = "⬇ HTML";
                downloadHtmlBtn.style.cssText = 'padding:6px 10px;font-size:10px;cursor:pointer;border:1px solid #39ff14;background:transparent;color:#39ff14;border-radius:3px;transition:all 0.2s;flex:1;';
                downloadHtmlBtn.onclick = () => {
                    const codeEl = document.querySelector('#' + codeId + ' code');
                    if (codeEl) {
                        const blob = new Blob([codeEl.textContent], { type: 'text/html;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'code.html';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                    }
                };
                footer.appendChild(downloadHtmlBtn);

                // DOWNLOAD TEXT button
                const downloadTextBtn = document.createElement("button");
                downloadTextBtn.className = "btn-utility";
                downloadTextBtn.textContent = "⬇ TEXT";
                downloadTextBtn.style.cssText = 'padding:6px 10px;font-size:10px;cursor:pointer;border:1px solid #00e5ff;background:transparent;color:#00e5ff;border-radius:3px;transition:all 0.2s;flex:1;';
                downloadTextBtn.onclick = () => {
                    const codeEl = document.querySelector('#' + codeId + ' code');
                    if (codeEl) {
                        const blob = new Blob([codeEl.textContent], { type: 'text/plain;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'code.txt';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                    }
                };
                footer.appendChild(downloadTextBtn);

                // RUN button (für HTML)
                if (['html', 'htm'].includes(language)) {
                    const runBtn = document.createElement("button");
                    runBtn.className = "btn-utility";
                    runBtn.textContent = "▶ RUN";
                    runBtn.style.cssText = 'padding:6px 10px;font-size:10px;cursor:pointer;border:1px solid #ffff00;background:transparent;color:#ffff00;border-radius:3px;transition:all 0.2s;flex:1;';
                    runBtn.onclick = () => {
                        const codeEl = document.querySelector('#' + codeId + ' code');
                        if (codeEl) {
                            openIframeModal('data:text/html;charset=utf-8,' + encodeURIComponent(codeEl.textContent), '▶ Run HTML');
                        }
                    };
                    footer.appendChild(runBtn);
                }

                codeWrapper.appendChild(footer);

                messageDiv.appendChild(codeWrapper);

                lastIndex = codeBlockRegex.lastIndex;
            }

            // Remaining prose
            if (lastIndex < message.content.length) {
                const remainingText = message.content.substring(lastIndex).trim();
                if (remainingText) {
                    const proseDiv = document.createElement("div");
                    proseDiv.className = "ai-prose";
                    // Process markdown: escape HTML first, then apply formatting
                    let html = escHtml(remainingText);
                    // Markdown headings (must be before other processing)
                    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>')
                              .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                              .replace(/^# (.+)$/gm, '<h1>$1</h1>');
                    // Code formatting
                    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                    // Bold formatting
                    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                    // Double newlines to breaks
                    html = html.replace(/\n\n/g, '<br><br>');
                    proseDiv.innerHTML = html;
                    messageDiv.appendChild(proseDiv);

            const apiMessages = [
                { role: 'system', content: DANIEL_SYSTEM_PROMPT },
                ...convMsgs,
                { role: 'user', content: ragMsg }
            ];

            const response = await fetch(`${PROXY_URL}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: apiMessages,
                    max_tokens: 2048,
                    temperature: 0.7,
                    stream: true
                })

                return logToTerminal("error", `✗ OpenAI Error: ${err.message || err.error || response.status}`);

    window.renderHeikinChart = async function(args) {
        const API_BASE = 'https://theserver-open-ai.replit.app';

        if (!args || args.trim() === '') {
            logToTerminal("error", "Usage: heikin [symbol]\\nExample: heikin SAP.XETRA");
            return;
        }

        const symbol = args.trim().toUpperCase();
        const loadingId = 'hk_loading_' + symbol.replace(/\\./g, '_');
        logToTerminal("system", `<span class="loading-spinner"></span>📊 Loading ${symbol}...`, false, loadingId);

        try {
            // Fetch data
            const from = new Date();
            from.setFullYear(from.getFullYear() - 1);
            const fromStr = from.toISOString().split('T')[0];
            const toStr = new Date().toISOString().split('T')[0];

            const res = await fetch(`${API_BASE}/eod/historical/${encodeURIComponent(symbol)}?from=${fromStr}&to=${toStr}&period=d`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const json = await res.json();
            const rawData = Array.isArray(json) ? json : (json.data || []);
            if (rawData.length < 20) throw new Error('Not enough data');

            // Convert to bars
            const bars = rawData.map(d => ({
                date: d.date,
                open: parseFloat(d.open),
                high: parseFloat(d.high),
                low: parseFloat(d.low),
                close: parseFloat(d.adjusted_close || d.close),
                volume: parseInt(d.volume) || 0
            })).sort((a, b) => new Date(a.date) - new Date(b.date));

            // Calculate Heikin-Ashi
            const ha = [];
            bars.forEach((b, i) => {
                const hc = (b.open + b.high + b.low + b.close) / 4;
                const ho = i === 0 ? b.open : (ha[i - 1].open + ha[i - 1].close) / 2;
                const hh = Math.max(b.high, ho, hc);
                const hl = Math.min(b.low, ho, hc);
                const color = hc >= ho ? '#00ff88' : '#ff4499';
                ha.push({
                    date: b.date,
                    open: Math.round(ho * 100) / 100,
                    high: Math.round(hh * 100) / 100,
                    low: Math.round(hl * 100) / 100,
                    close: Math.round(hc * 100) / 100,
                    color: color
                });
            });

            // Analyze
            const last = ha[ha.length - 1];
            const prev = ha[ha.length - 2] || last;
            const bull = last.close >= last.open;
            const pbull = prev.close >= prev.open;
            const isFlip = bull !== pbull;

            let streak = 1;
            for (let i = ha.length - 1; i > 0; i--) {
                const isCurrentBull = ha[i].close >= ha[i].open;
                const isPrevBull = ha[i - 1].close >= ha[i - 1].open;
                if (isCurrentBull === isPrevBull) streak++;
                else break;
            }

            const closes = ha.map(b => b.close);
            const chg = ((last.close - bars[bars.length - 1].close) / bars[bars.length - 1].close * 100).toFixed(2);
            const h52 = Math.max(...ha.map(b => b.high));
            const l52 = Math.min(...ha.map(b => b.low));
            const sma20 = closes.length >= 20 ? closes.slice(-20).reduce((a, b) => a + b) / 20 : last.close;

            document.getElementById(loadingId)?.remove();

            // Render output
            const color = bull ? '#00ff88' : '#ff4499';
            const flipStr = isFlip ? '🔄 FLIP' : 'HOLD';
            const statusStr = bull ? '🟢 BULLISH' : '🔴 BEARISH';

            // BUILD HTML - Simple string concatenation
            let html = `<div style="border: 2px solid ${color}; border-radius: 8px; padding: 16px; background: #0f1535; margin: 15px 0;">`;
            html += `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">`;
            html += `<div><strong style="color: ${color};">HEIKIN ${symbol}</strong><br><span style="color: #ffffff; font-size: 0.85em;">Momentum</span></div>`;
            html += `<div style="text-align: right;">`;
            html += `<div style="color: ${color}; font-weight: bold; font-size: 1.1em;">${last.close.toFixed(2)}</div>`;
            html += `<div style="color: ${chg >= 0 ? '#00ff88' : '#ff4499'}; font-weight: bold;">${chg >= 0 ? '+' : ''}${chg}%</div>`;
            html += `<div style="color: ${color}; font-size: 0.9em; margin-top: 4px;">${statusStr}</div>`;
            html += `</div></div>`;

    function renderHeikinChartStable(canvasId, symbol, ha) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || typeof Chart === 'undefined') {
            console.error('Canvas not found or Chart.js not loaded');
            return;
        }

        try {
            // Prepare data
            const displayData = ha.slice(-100);

    function tickerFullSymbol(s) {
        if (!tickerCurrentEx) return s;

        if (s.toUpperCase().endsWith('.' + sfx.toUpperCase())) return s;

    }

        // Check if it's an exchange code (2-4 chars, uppercase)
        if (/^[A-Z]{2,4}$/.test(arg)) {
            // It's an exchange
            window.tickerSearchQuery = '';
            await loadTickerExchange(arg.toUpperCase());

                logToTerminal("error", "Select an exchange first: ticker [US|XETRA|TSE...]");

    window.tickerCopy = function(symbol) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(symbol).then(() => {
                logToTerminal("success", `⎘ Copied: ${symbol}`);
            });
        } else {
            const ta = document.createElement('textarea');
            ta.value = symbol;
            ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                logToTerminal("success", `⎘ Copied: ${symbol}`);
            } catch (e) {
                logToTerminal("error", "Copy failed");
            }
            document.body.removeChild(ta);
        }
    };

    window.tickerChart = async function(symbol) {
        const lid = 'chart_' + symbol.replace(/\./g, '_');
        logToTerminal("system", `<span class="loading-spinner"></span>📈 ${symbol}...`, false, lid);
        try {
            const from = new Date(Date.now() - 365 * 86400000).toISOString().split('T')[0];
            const res = await fetch(`${PROXY}/eod/historical/${encodeURIComponent(symbol)}?from=${from}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!Array.isArray(data) || data.length < 2) throw new Error('No data');
            document.getElementById(lid)?.remove();
            const last = data[data.length - 1];
            const first = data[0];
            const chg = ((last.close - first.close) / first.close * 100).toFixed(2);
            const high = Math.max(...data.map(d => parseFloat(d.high)));
            const low = Math.min(...data.map(d => parseFloat(d.low)));
            let html = `<div style="border: 2px solid #00d4ff; border-radius: 8px; padding: 16px; background: #0f1535; margin: 15px 0;">`;

    async function fetchBrokerSignal(symbol, method, apiBase) {
        const dateStr = (daysAgo = 0) => {
            const d = new Date();
            d.setDate(d.getDate() - daysAgo);
            return d.toISOString().split('T')[0];
        };

        try {
            if (method === 'realtime') {
                const res = await fetch(`${apiBase}/api/eod?symbol=${encodeURIComponent(symbol)}&endpoint=real-time`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const d = await res.json();
                const price = parseFloat(d.close || d.last || d.price || 0);
                const high = parseFloat(d.high || price);
                const low = parseFloat(d.low || price);
                const avg = (high + low) / 2;
                const pos = price > avg ? 'LONG' : 'SHORT';
                return {
                    symbol: symbol,
                    recommendation: pos,
                    price: Number(price).toFixed(4),
                    target: pos === 'LONG' ? (price * 1.01).toFixed(4) : (price * 0.99).toFixed(4),
                    stop: pos === 'LONG' ? (price * 0.99).toFixed(4) : (price * 1.01).toFixed(4),
                    timestamp: d.timestamp || Date.now() / 1000,
                    size: '100%'
                };
            }

            const from = method === 'monthly' ? dateStr(45) : method === 'weekly' ? dateStr(14) : dateStr(5);
            const to = dateStr(0);

            const res = await fetch(`${apiBase}/api/eod?symbol=${encodeURIComponent(symbol)}&endpoint=historical&from=${from}&to=${to}&period=d`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            let data = await res.json();

            if (!Array.isArray(data) || data.length < 2) throw new Error('Insufficient data');
            data.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (method === 'daily') {
                const lat = parseFloat(data[0].close);
                const prev = parseFloat(data[2]?.close || data[1].close);
                const pos = lat / prev > 1 ? 'LONG' : 'SHORT';
                return { symbol, recommendation: pos, price: lat.toFixed(4), target: pos === 'LONG' ? (lat * 1.04).toFixed(4) : (lat * 0.96).toFixed(4), stop: pos === 'LONG' ? (lat * 0.98).toFixed(4) : (lat * 1.02).toFixed(4), timestamp: new Date(data[0].date).getTime() / 1000, size: '50%' };
            }

            if (method === 'weekly') {
                if (data.length < 5) throw new Error('Not enough data');
                const sma1 = (parseFloat(data[0].close) + parseFloat(data[1].close) + parseFloat(data[2].close)) / 3;
                const sma3 = (parseFloat(data[2].close) + parseFloat(data[3].close) + parseFloat(data[4].close)) / 3;
                const lat = parseFloat(data[0].close);
                const pos = sma1 / sma3 > 1 ? 'LONG' : 'SHORT';
                return { symbol, recommendation: pos, price: lat.toFixed(4), target: pos === 'LONG' ? (lat * 1.08).toFixed(4) : (lat * 0.92).toFixed(4), stop: pos === 'LONG' ? (lat * 0.96).toFixed(4) : (lat * 1.04).toFixed(4), timestamp: new Date(data[0].date).getTime() / 1000, size: '25%' };
            }

            if (method === 'monthly') {
                const lat = parseFloat(data[0].close);
                const older = parseFloat(data[data.length - 1].close);
                const pos = lat > older ? 'LONG' : 'SHORT';
                return { symbol, recommendation: pos, price: lat.toFixed(4), target: pos === 'LONG' ? (lat * 1.20).toFixed(4) : (lat * 0.80).toFixed(4), stop: pos === 'LONG' ? (lat * 0.90).toFixed(4) : (lat * 1.10).toFixed(4), timestamp: new Date(data[0].date).getTime() / 1000, size: '10%' };
            }
        } catch (err) {
            throw new Error(`API Error: ${err.message}`);
        }
    }

            const key = `${symbol}|${from}|${to}`;
            if (cache[key]) return cache[key];
            try {
                const res = await fetch(`${API_BASE}/eod/historical/${encodeURIComponent(symbol)}?from=${from}&to=${to}&period=d`);
                if (!res.ok) return [];
                const json = await res.json();

                return cache[key] = arr;
            } catch(e) { return []; }
        }

        async function computeFundHistory(symbols, from, to) {
            const results = await Promise.all(symbols.map(s => fetchHistory(s, from, to)));
            const dateMap = {};
            results.forEach(data => {
                data.forEach(e => {
                    if (!dateMap[e.date]) dateMap[e.date] = [];

            const base = avgs[0];

    async function _getTechnicalCrossover(symbol, totalScore) {
        try {
            const res = await fetch(`${PROXY_URL}/eod/historical/${symbol}?fmt=json`);
            const data = await res.json();
            if (!Array.isArray(data) || data.length < 200) return null;
            const sorted = data.sort((a,b) => new Date(a.date) - new Date(b.date));
            const lastClose = parseFloat(sorted[sorted.length - 1].close);
            const prices = sorted.slice(-30).map(d => parseFloat(d.close));
            let gains = 0, losses = 0;
            for (let i = 1; i <= 14; i++) {
                let diff = prices[i] - prices[i-1];
                if (diff > 0) gains += diff; else losses -= diff;
            }
            let avgGain = gains / 14, avgLoss = losses / 14;
            for (let i = 15; i < prices.length; i++) {
                let diff = prices[i] - prices[i-1];
                avgGain = (avgGain * 13 + (diff > 0 ? diff : 0)) / 14;
                avgLoss = (avgLoss * 13 + (diff < 0 ? -diff : 0)) / 14;
            }
            const rsiVal = avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
            const sma200 = sorted.slice(-200).reduce((sum, d) => sum + parseFloat(d.close), 0) / 200;
            let signal = "⚖️ BALANCED TREND (Nachrichtenfluss deckt sich präzise mit dem Chartbild)";
            let action = "SQUEEZE THE TREND / TRAILING STOP-LOSS ENG NACHZIEHEN";
            if (totalScore >= 1 && rsiVal > 60) {
                signal = "⚠️ HARD CEILING / DISTRIBUTION (News extrem bullisch, aber RSI signalisiert Überlastung. Institutionelle verkaufen in die Retail-Gier!)";
                action = "GEWINNMITNAHME (Sell on Fact) / AUF KEINEN FALL OBEN NACHKAUFEN!";
            } else if (totalScore <= -1 && rsiVal < 52) {
                signal = "🚀 PANIC EXHAUSTION / BEAR TRAP (Horror-News schlagen ein, aber der RSI steht stabil. Die Verkäufer rennen in eine massive Kaufwand!)";
                action = "ANTIZYKLISCHE LIMIT-ORDERS SETZEN (Buy on Bad News) / POSITION AUFBAUEN";
            } else if (totalScore >= 1 && rsiVal <= 60) {
                signal = "🔥 UNLEASHED MOMENTUM / VALUE ACCUMULATION (Hervorragende News treffen auf flachen Chart. Explosionsgefahr!)";
                action = "AGGRESSIVER LONG-EINSTIEG / AUFSTOCKEN (Ausbruch antizipieren)";
            } else if (totalScore >= 1 && lastClose < sma200 && rsiVal > 55) {
                signal = "🛑 BEAR MARKET TRAP (Gute News verpuffen als reiner Dead-Cat-Bounce unter dem SMA 200)";
                action = "KEIN RE-ENTRY / SHORT-GELEGENHEITEN BEI REJECTION DES SMA SUCHEN";
            }
            return { rsi: rsiVal.toFixed(2), sma200: sma200.toFixed(2), currentPrice: lastClose.toFixed(2), signal, action };
        } catch(e) { return null; }
    }

    // ── IndexedDB helpers (VectorDB + MemoryDB) ──────────────────────────
    const DANIEL_AGENTIC = (() => {
        function openDB(name, storeName) {
            return new Promise((res, rej) => {
                const req = indexedDB.open(name, 1);
                req.onupgradeneeded = () => {
                    if (!req.result.objectStoreNames.contains(storeName)) {
                        req.result.createObjectStore(storeName, { keyPath: storeName === 'chunks' ? 'chunk_id' : 'key' });
                    }
                };
                req.onsuccess = () => res(req.result);
                req.onerror   = () => rej(req.error);
            });
        }
        function tx(db, store, mode, fn) {
            return new Promise((res, rej) => {
                const t = db.transaction(store, mode);
                const s = t.objectStore(store);
                const req = fn(s);
                if (req && req.onsuccess !== undefined) {
                    req.onsuccess = () => res(req.result);
                    req.onerror   = () => rej(req.error);
                } else {
                    t.oncomplete = () => res();
                    t.onerror    = () => rej(t.error);
                }
            });
        }
        return { openDB, tx };
    })();

    async function _vecDB() { return DANIEL_AGENTIC.openDB(DANIEL_VEC_DB, 'chunks'); }

    async function _vecEnsureModel() {
        if (_vecPipeline) return _vecPipeline;
        if (_vecModelLoading) {
            while (_vecModelLoading) await new Promise(r => setTimeout(r, 300));
            return _vecPipeline;
        }
        _vecModelLoading = true;
        try {
            if (!window._xenovaLoaded) {
                const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0');
                window.pipeline = mod.pipeline;
                if (mod.env) mod.env.allowLocalModels = false;
                window._xenovaLoaded = true;
            }
            _vecPipeline = await window.pipeline('feature-extraction', DANIEL_VEC_MODEL, { quantized: true });
            return _vecPipeline;
        } finally { _vecModelLoading = false; }
    }

    async function _vecEmbed(text) {
        const pipe = await _vecEnsureModel();
        const out  = await pipe(text, { pooling: 'mean', normalize: true });
        return Array.from(out.data);
    }

    function _vecCosineSim(a, b) {
        let dot = 0, an = 0, bn = 0;
        for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; an += a[i]*a[i]; bn += b[i]*b[i]; }
        return (Math.sqrt(an) * Math.sqrt(bn)) === 0 ? 0 : dot / (Math.sqrt(an) * Math.sqrt(bn));
    }

    function _vecChunk(text, size = 500) {
        const chunks = []; const lines = text.split('\n'); let cur = '';
        for (const line of lines) {
            if ((cur + '\n' + line).length > size && cur) { chunks.push(cur.trim()); cur = line; }
            else { cur = cur ? cur + '\n' + line : line; }
        }
        if (cur.trim().length > 10) chunks.push(cur.trim());
        return chunks;
    }

    window.fxConvert = async function(amount, from, to) {
        if (!amount || !from || !to) return logToTerminal("error", "Usage: fx [amount] [from_iso] [to_iso]");
        const loadingId = 'loading-fx-' + Math.random().toString(36).substr(2, 9);
        logToTerminal("system", `<span class="loading-spinner"></span>Berechne Wechselkurs...`, false, loadingId);
        try {
            const res = await fetch(`https://open.er-api.com/v6/latest/${from.toUpperCase()}`);
            if (!res.ok) throw new Error("Währung nicht gefunden.");
            const data = await res.json();
            const rate = data.rates[to.toUpperCase()];
            if (!rate) throw new Error(`Zielwährung ${to} existiert nicht.`);
            const result = (parseFloat(amount) * rate).toFixed(2);
            document.getElementById(loadingId)?.remove();
            logToTerminal("success", `💱 CURRENCY EXCHANGE:\n${amount} ${from.toUpperCase()} = ${result} ${to.toUpperCase()}\n(Kurs: ${rate.toFixed(4)})`);
        } catch(e) {
            document.getElementById(loadingId)?.remove();
            logToTerminal("error", `✗ FX Error: ${e.message}`);
        }
    };











    sendButton.addEventListener("click", () => {

        if (e.key === "Enter" && !breakActive && document.activeElement === userPromptElement) {
            e.preventDefault();
            sendButton.click();
        }
    });

    userPromptElement.addEventListener("keyup", (e) => {
        if (e.key === "ArrowUp") {
            if (historyIndex < commandHistory.length - 1) {
                historyIndex++;
                userPromptElement.value = commandHistory[commandHistory.length - 1 - historyIndex];
            }
        } else if (e.key === "ArrowDown") {
            if (historyIndex > 0) {
                historyIndex--;
                userPromptElement.value = commandHistory[commandHistory.length - 1 - historyIndex];
            } else {
                historyIndex = -1;
                userPromptElement.value = "";
            }
        }
    });
