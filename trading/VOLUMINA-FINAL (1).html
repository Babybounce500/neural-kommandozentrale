<script>
(function(){
  window.ST_BASE = 'https://glow-up-gemini.replit.app';
  async function st_getJSON(p, params) {
    const qs = params ? '?' + new URLSearchParams(params).toString() : '';
    const res = await fetch(ST_BASE + p + qs);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  window.ST_API = { eod: { historical: (s,p) => st_getJSON('/eod/historical/'+s, p) } };
  window.st_isoDaysAgo = function(n) { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };

  window.st_normCDF = function(x) {
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const sign=x<0?-1:1; const z=Math.abs(x)/Math.sqrt(2); const t=1/(1+p*z);
    const erf=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-z*z);
    return 0.5*(1+sign*erf);
  };
  window.st_estimateSigmaMu = function(prices) {
    const lr=[]; for(let i=1;i<prices.length;i++) if(prices[i]>0&&prices[i-1]>0) lr.push(Math.log(prices[i]/prices[i-1]));
    if (lr.length<20) return null;
    const mean=lr.reduce((a,b)=>a+b,0)/lr.length;
    const variance=lr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(lr.length-1);
    const sigma=Math.sqrt(variance*252); const mu=mean*252+0.5*sigma*sigma;
    return { sigma, mu };
  };
  window.st_probHitTarget = function(S,K,mu,sigma,T) {
    if (S===K) return 1.0; if (sigma<=0||T<=0) return 0.0;
    const v=mu-0.5*sigma*sigma, b=Math.abs(Math.log(K/S)), sst=sigma*Math.sqrt(T);
    const d1=(-b+v*T)/sst, d2=(-b-v*T)/sst;
    return Math.min(Math.max(st_normCDF(d1)+Math.exp((2*v*b)/(sigma*sigma))*st_normCDF(d2),0),1);
  };
  window.st_volBucketOf = function(p){ return p<0.40?'far_lowP':p<0.70?'mid_P':'near_highP'; };
  window.ST_VOL_LABEL = { far_lowP:'🔴 Ruhiges Regime', mid_P:'🟡 Mittleres Regime', near_highP:'🟢 Volatiles Regime' };
  window.ST_STOP_PCT = 4; window.ST_HOLD_DAYS = 10; window.ST_T_YEARS = 10/252;

  window.st_getVolRegime = async function(symbol, price, direction) {
    try {
      const hist = await ST_API.eod.historical(symbol, { from: st_isoDaysAgo(400) });
      const closes = (Array.isArray(hist)?hist:[]).map(h=>h.close).filter(c=>c>0);
      if (closes.length < 20) return null;
      const params = st_estimateSigmaMu(closes);
      if (!params) return null;
      const stopLevel = direction==='LONG' ? price*(1-ST_STOP_PCT/100) : price*(1+ST_STOP_PCT/100);
      const pTouchStop = st_probHitTarget(price, stopLevel, params.mu, params.sigma, ST_T_YEARS);
      return { pTouchStop, sigma: params.sigma, bucket: st_volBucketOf(pTouchStop) };
    } catch(e) { console.error('st_getVolRegime failed', e); return null; }
  };
})();
</script>

<script>
const ST_BACKTEST = { n: 2621, avgRet: 0.2511, winRate: 31.36, sharpeLike: 0.539, bestBucket: 'near_highP', status: 'validated', buckets: { far_lowP: null, mid_P: 0.214, near_highP: 0.2511 } };
document.getElementById('st_intro').innerHTML = "Backtest-validiert: Der stärkste Bucket von Volumina ist \"near_highP\", Sharpe 0.539, robust.";

function st_smartStopTarget(price, direction, bucket) {
  const sign = direction==='LONG'?1:-1;
  const bucketAvgRet = ST_BACKTEST.buckets[bucket] != null ? ST_BACKTEST.buckets[bucket] : ST_BACKTEST.avgRet;
  const target = price*(1+sign*(bucketAvgRet/100));
  const stop = price*(1-sign*(ST_STOP_PCT/100));
  return { target: target.toFixed(2), stop: stop.toFixed(2), bucketAvgRet };
}

function st_renderCard(sym, price, direction, vts, volRegime) {
  const container = document.getElementById('st_results');
  const card = document.createElement('div');
  card.style.cssText = 'background:#eaf1f6;border:1px solid #d6e2ea;border-radius:6px;padding:10px;margin-bottom:8px;';
  const statusBadge = ST_BACKTEST.status === 'validated'
    ? '<span style="color:#15803d;font-weight:700;">✅ validiert, robust</span>'
    : ST_BACKTEST.status === 'warning'
      ? '<span style="color:#b91c1c;font-weight:700;">⚠️ geprüft, NICHT robust (reale Zahlen, aber Edge schwächt stark ab)</span>'
      : '<span style="color:#b45309;font-weight:700;">ℹ️ informativ, kein eigener Backtest für dieses Signal</span>';
  card.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><b>' + sym + '</b><span style="font-weight:700;color:' + (direction==='LONG'?'#15803d':'#b91c1c') + ';">' + direction + '</span></div>' +
    '<div>Entry: <b>' + price.toFixed(2) + '</b> &nbsp; Smart Target: <b style="color:#0e7490;">' + vts.target + '</b> &nbsp; Smart Stop (-4%): <b style="color:#b45309;">' + vts.stop + '</b></div>' +
    (volRegime ? '<div style="margin-top:4px;font-size:10.5px;color:#5f7277;">P(Touch Stop in 10d) = ' + (volRegime.pTouchStop*100).toFixed(0) + '% (σ=' + (volRegime.sigma*100).toFixed(1) + '%) · ' + ST_VOL_LABEL[volRegime.bucket] + '</div>' : '') +
    '<div style="margin-top:4px;font-size:10px;color:#9aa5a9;">' + statusBadge + ' -- n=' + ST_BACKTEST.n.toLocaleString('de-DE') + ', Ø' + ST_BACKTEST.avgRet + '%, Sharpe ' + ST_BACKTEST.sharpeLike + ' (Bucket: ' + ST_BACKTEST.bestBucket + ')</div>';
  container.appendChild(card);
}

async function st_detectSignal(symbol) {

  const data = await ST_API.eod.historical(symbol, { from: st_isoDaysAgo(25) });
  data.sort((a,b)=>new Date(a.date)-new Date(b.date));
  if (data.length < 15) throw new Error('Zu wenige Daten');
  const n = data.length;
  let pending = null;
  for (let d = 5; d < n; d++) {
    if (data[d].volume < data[d-1].volume && data[d].volume > 0) pending = { day: d, longLevel: data[d].close*1.01, shortLevel: data[d].close*0.99 };
    if (pending && d > pending.day) {
      if (data[d].close > pending.longLevel) { pending = null; if (d === n-1) return { price: data[d].close, direction: 'LONG' }; }
      else if (data[d].close < pending.shortLevel) { pending = null; if (d === n-1) return { price: data[d].close, direction: 'SHORT' }; }
    }
  }
  if (pending) throw new Error('Volumen-Kompression aktiv seit ' + data[pending.day].date + ', wartet auf Ausbruch über ' + pending.longLevel.toFixed(2) + ' / unter ' + pending.shortLevel.toFixed(2));
  throw new Error('Kein aktives Setup');
  
}

async function st_runScan() {
  const symbols = document.getElementById('st_symbolInput').value.split(',').map(s=>s.trim()).filter(Boolean);
  document.getElementById('st_scanBtn').disabled = true;
  document.getElementById('st_results').innerHTML = '';
  const status = document.getElementById('st_status');
  for (const sym of symbols) {
    status.textContent = 'Scanne ' + sym + '...';
    try {
      const { price, direction } = await st_detectSignal(sym);
      const volRegime = await st_getVolRegime(sym, price, direction);
      const vts = st_smartStopTarget(price, direction, volRegime ? volRegime.bucket : ST_BACKTEST.bestBucket);
      st_renderCard(sym, price, direction, vts, volRegime);
    } catch (e) {
      const container = document.getElementById('st_results');
      const card = document.createElement('div');
      card.style.cssText = 'background:#f4f7fb;border-radius:4px;padding:6px 10px;margin-bottom:4px;font-size:10.5px;color:#9aa5a9;';
      card.textContent = sym + ': ' + e.message;
      container.appendChild(card);
    }
  }
  status.textContent = 'Fertig: ' + symbols.length + ' Symbole geprüft.';
  document.getElementById('st_scanBtn').disabled = false;
}
document.getElementById('st_symbolInput').value = 'NVDA.US, AMD.US, TSLA.US, VOW3.XETRA, RHM.XETRA';
</script>

    function init() {
      const select = document.getElementById('categorySelect');
      marketUniverse.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id; opt.textContent = cat.label;
        select.appendChild(opt);
      });
    }
    document.addEventListener('DOMContentLoaded', init);

    async function startBulkScan() {
      if (isScanning) return;
      const category = document.getElementById('categorySelect').value;
      const delay = parseInt(document.getElementById('delayInput').value) || 2000;
      
      isScanning = true;
      validatedSignals = [];
      
      document.getElementById('goGrid').innerHTML = '';
      document.getElementById('progressSection').classList.add('active');

      const targetCategory = marketUniverse.categories.find(c => c.id === category);
      const targetSymbols = targetCategory.symbols;
      
      for (let i = 0; i < targetSymbols.length; i++) {
        const symbol = targetSymbols[i];
        const percent = Math.round((i / targetSymbols.length) * 100);
        
        document.getElementById('progressText').textContent = `CALCULATING VOLUMETRIC RATIOS // ${symbol}...`;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('progressFill').textContent = percent + '%';
        document.getElementById('statusMsg').textContent = `${i} / ${targetSymbols.length}`;
        
        await fetchAndAnalyzeVolume(symbol);
        await new Promise(r => setTimeout(r, delay));
      }

      document.getElementById('progressSection').classList.remove('active');
      isScanning = false;
      renderSignals();
    }

    async function fetchAndAnalyzeVolume(symbol) {
      try {
        const res = await fetch(`${API_URL}?symbol=${symbol}&endpoint=historical&period=d`);
        if (!res.ok) return;
        let data = await res.json();
        
        if (data && data.length >= 7) {
          // Chronologisch absteigend sortieren (Neueste zuerst)
          data.sort((a, b) => new Date(b.date) - new Date(a.date));

          const t0 = data[0]; // Heute (B)
          const t1 = data[1]; // Gestern (A)

          const volB = parseFloat(t0.volume);
          const volA = parseFloat(t1.volume);
          const closeB = parseFloat(t0.close);

          // 1. BEWÄHRTE MATHE-BASIS: Volumen-Schrumpfung (Ruhe vor dem Sturm)
          if (volB < volA && volB > 0) {
            
            // 2. SOPHISTICATED EXTENSION: Relative Volume (RVOL) gegen den 5-Tage-Schnitt
            const avgVol5 = data.slice(1, 6).reduce((acc, d) => acc + parseFloat(d.volume || 0), 0) / 5;
            const rVol = avgVol5 > 0 ? (volB / avgVol5) : 1.0;

            // 3. BREAKOUT-LEVELS NACH DEINEM BEWÄHRTEN GEOMETRISCHEN SCHEMA
            const longBreakout = closeB * 1.01;
            const longPyramid = closeB * 1.02;
            const shortBreakout = closeB * 0.99;
            const shortPyramid = closeB * 0.98;

            // Kursrisiko & Positionsgrößenbestimmung (1% Rule)
            const kursrisiko = longBreakout - shortBreakout;
            const accountBalance = parseFloat(document.getElementById('balanceInput').value) || 10000;
            const riskAmount = accountBalance * 0.01;
            const quantity = kursrisiko > 0 ? Math.floor(riskAmount / kursrisiko) : 0;

            const volDropPct = ((volA - volB) / volA) * 100;
            const priceRangePct = ((parseFloat(t0.high) - parseFloat(t0.low)) / parseFloat(t0.low)) * 100;

            // 4. ADVANCED CONFIDENCE SCORE
            // Basis-Score für erfülltes Kriterium
            let confidence = 65; 

            // Je stärker der Volumeneinbruch bei gleichzeitig enger Handelsspanne, desto höher die Qualität
            if (volDropPct > 20) confidence += 10;
            if (priceRangePct < 2) confidence += 10;
            if (rVol < 0.8) confidence += 10; // Deutlich unterdurchschnittliches Volumen bestätigt die Akkumulation

            confidence = Math.min(Math.max(Math.round(confidence), 20), 95);

            validatedSignals.push({
              symbol,
              date: t0.date,
              volA, volB,
              rVol,
              longBreakout, longPyramid,
              shortBreakout, shortPyramid,
              volDropPct,
              range: priceRangePct,
              risk: kursrisiko,
              quantity,
              confidence,
              decimals: closeB < 2 ? 4 : 2,
              volumes: [
                parseFloat(data[4].volume || 0),
                parseFloat(data[3].volume || 0),
                parseFloat(data[2].volume || 0),
                volA,
                volB
              ]
            });
          }
        }
      } catch (e) { console.error("Volume Filter Engine Error for: " + symbol, e); }
    }

    function renderSignals() {
      const goGrid = document.getElementById('goGrid');

      if (validatedSignals.length === 0) {
        goGrid.innerHTML = '<div style="color: var(--txt-muted); text-align:center; padding: 40px; grid-column: 1/-1;">Keine Volumen-Kompressionen im gewählten Cluster identifiziert.</div>';
        return;
      }

      // Sortierung nach höchster Confidence
      validatedSignals.sort((a, b) => b.confidence - a.confidence);

      validatedSignals.forEach(sig => {
        const card = document.createElement('div');
        card.className = 'result-card';
        const formattedDate = new Date(sig.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });

        card.innerHTML = `
          <canvas class="result-volume-matrix" width="110" height="110"></canvas>
          <div class="result-info">
            <div class="result-header">
              <div>
                <span class="result-symbol">${sig.symbol}</span>
                <span class="result-timestamp">EOD: ${formattedDate}</span>
              </div>
              <span class="sig-badge badge-go">GO</span>
            </div>
            <div class="results-metrics">
              <div class="result-metric"><span class="result-label">LONG Breakout:</span><span class="text-up">$${sig.longBreakout.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">LONG Pyramid:</span><span class="val-white">$${sig.longPyramid.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">SHORT Breakout:</span><span class="text-down">$${sig.shortBreakout.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">SHORT Pyramid:</span><span class="val-white">$${sig.shortPyramid.toFixed(sig.decimals)}</span></div>
              
              <div class="result-metric"><span class="result-label">Vol Gestern (A):</span><span class="val-white">${formatVolNumber(sig.volA)}</span></div>
              <div class="result-metric"><span class="result-label">Vol Heute (B):</span><span class="val-gold">${formatVolNumber(sig.volB)}</span></div>
              
              <div class="result-metric"><span class="result-label">Vol Einbruch:</span><span class="text-down">▼ ${sig.volDropPct.toFixed(1)}%</span></div>
              <div class="result-metric"><span class="result-label">Relative Vol (RVOL):</span><span class="val-white">${sig.rVol.toFixed(2)}x</span></div>
              
              <div class="result-metric"><span class="result-label">Intraday Range:</span><span class="val-white">${sig.range.toFixed(2)}%</span></div>
              <div class="result-metric"><span class="result-label">Stückzahl (1%):</span><span class="val-gold">${sig.quantity} Pcs</span></div>

              <div class="confidence-container">
                <div style="display:flex; justify-content:space-between; font-size:0.7rem;">
                  <span class="result-label">Volumetric Confidence:</span><span style="color:var(--purple); font-weight:bold;">${sig.confidence}%</span>
                </div>
                <div class="confidence-mini-bar"><div class="confidence-mini-fill" style="width: ${sig.confidence}%"></div></div>
              </div>
            </div>
          </div>
        `;
        goGrid.appendChild(card);
        drawVolumeHistogram(card.querySelector('canvas'), sig.volumes);
      });
    }

    function drawVolumeHistogram(canvas, volumes) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#010204';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const maxVol = Math.max(...volumes) || 1;
      const padding = 10;
      const usableHeight = canvas.height - (padding * 2);
      const barWidth = 14;
      const spacing = 6;
      const startX = 8;

      volumes.forEach((vol, i) => {
        const x = startX + i * (barWidth + spacing);
        const barHeight = (vol / maxVol) * usableHeight;
        const y = canvas.height - padding - barHeight;

        // Der letzte Balken (Heute) kriegt das Highlight-Design, die vorherigen sind gedeckt
        if (i === volumes.length - 1) {
          ctx.fillStyle = '#9d4edd';
        } else {
          ctx.fillStyle = '#223242';
        }
        
        ctx.fillRect(x, y, barWidth, barHeight);
      });
    }

    function formatVolNumber(num) {
      if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
      return num.toFixed(0);
    }

    function downloadReport() {
      if(validatedSignals.length === 0) {
        alert("Keine aktiven Volumen-Kompressionstracks für den Export vorhanden.");
        return;
      }
      let reportLines = ["=== VOLUMINA LIQUIDITY COMPRESSION REPORT ==="];
      validatedSignals.forEach(s => {
        reportLines.push(`Symbol: ${s.symbol} | STATUS: GO | Volumetric Confidence: ${s.confidence}%`);
        reportLines.push(`Vol Drop: -${s.volDropPct.toFixed(1)}% | RVOL vs 5-Day: ${s.rVol.toFixed(2)}x`);
        reportLines.push(`Vol Gestern: ${s.volA.toFixed(0)} | Vol Heute: ${s.volB.toFixed(0)}`);
        reportLines.push(`LONG Breakout: $${s.longBreakout.toFixed(4)} | SHORT Breakout: $${s.shortBreakout.toFixed(4)}`);
        reportLines.push(`Allocation Quantity (1%): ${s.quantity} Units`);
        reportLines.push("--------------------------------------------------");
      });
      
      const blob = new Blob([reportLines.join('\n')], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `volumina_compression_report.txt`;
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
