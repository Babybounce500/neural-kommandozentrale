    }

    /* ── HEADER ────────────────────────────────────────────── */
    .header-bar {
      flex-shrink: 0;
      background: #0b0f17;
      border: 1px solid #1a2233;
      border-radius: 5px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header-title {
      color: #00e6ff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0,230,255,0.35);
      white-space: nowrap;
    }
    .pill {
      background: #121824; color: #8f9cae; border: 1px solid #202b3d;
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 3px;
      cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px;
    }
    .pill:hover { border-color: #00e6ff; color: #00e6ff; }

    .input-group-cz {
      display: flex; align-items: center; gap: 5px;
      background: #0e1620; border: 1px solid #202b3d;
      border-radius: 4px; padding: 4px 10px; flex-wrap: wrap;
    }
    .input-label { font-size: 10px; color: #4a5568; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    .cz-input {
      background: #04060a; border: 1px solid #2d3748; color: #00e6ff;
      font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700;
      padding: 3px 7px; border-radius: 3px; outline: none; text-transform: uppercase;

    .cz-input:focus { border-color: #00e6ff; }

    select.cz-input  { color: #ecc94b; cursor: pointer; }

      padding: 4px 11px; border-radius: 3px; cursor: pointer; white-space: nowrap;

    .status-badge { font-family: 'Courier New', monospace; font-size: 10px; color: #4e5d78; letter-spacing: 0.5px; white-space: nowrap; }
    .status-badge.live { color: #00e6ff; }
    .status-badge.err  { color: #ff3366; }

    /* ── SIGNAL STRIP ────────────────────────────────────────── */
    .signal-strip {
      flex-shrink: 0;
      background: #0b0f17; border: 1px solid #1a2233; border-radius: 5px;
      padding: 5px 12px; display: flex; align-items: center; gap: 14px;
      flex-wrap: wrap; font-family: 'Courier New', monospace; font-size: 11px;
    }
    .sig-badge { font-size: 11px; font-weight: 800; padding: 2px 10px; border-radius: 3px; letter-spacing: 0.5px; white-space: nowrap; }

<script>
/* ================================================================
   TREND RIDER // QUANT CHART ENGINE
   Lightweight Charts (Apache 2.0) — full JS math, no subscription
   Tools: crosshair, horizontal lines (draggable), undo/clear
   Indicators: RSI (Wilder), Bollinger Bands — all computed in JS
================================================================ */

const EOD_PROXY    = 'https://gemini-os.replit.app/api/eod';
const RIBBON_PERIODS = [8, 13, 21, 34, 55];

/* ── STATE ───────────────────────────────────────────────── */
let lwCharts    = { daily: null, rsi: null };
let candleRef   = null;   // current candle series (for drawing + coordinateToPrice)
let currentData = null;   // cached daily candles
let drawLines   = [];     // [{ series, priceLine }] for undo
let activeTool  = 'cursor';
let bbSeries    = null;   // { upper, middle, lower }
let syncBlock   = false;

/* ── DATA ────────────────────────────────────────────────── */
function normalize(raw) {
  return raw.map(d => ({
    time:   (d.date   || d.Date   || '').slice(0, 10),
    open:   +(d.open   || d.Open   || d.close || d.Close || 0),
    high:   +(d.high   || d.High   || d.close || d.Close || 0),
    low:    +(d.low    || d.Low    || d.close || d.Close || 0),
    close:  +(d.close  || d.Close  || 0),
    volume: +(d.volume || d.Volume || 0),
  })).filter(d => d.time.length === 10 && d.close > 0)
     .sort((a, b) => a.time < b.time ? -1 : 1);
}

/* ── EMA CALCULATION (SMA-seeded) ─────────────────────────── */
function calcEMAHistory(data, period) {
  if (data.length < period) return [];
  const k = 2 / (period + 1);
  let ema = 0;
  for (let i = 0; i < period; i++) ema += data[i].close;
  ema /= period;
  const out = [{ time: data[period - 1].time, value: ema }];
  for (let i = period; i < data.length; i++) {
    ema = data[i].close * k + ema * (1 - k);
    out.push({ time: data[i].time, value: ema });
  }
  return out;
}

function calcEMALast(data, period) {
  const arr = calcEMAHistory(data, period);
  return arr.length ? arr[arr.length - 1].value : null;
}

/* Consolidated ribbon: (EMA8+13+21+34+55)/5 at every bar */
function calcRibbonAvg(data) {
  const histories = RIBBON_PERIODS.map(p => calcEMAHistory(data, p));
  const ref = histories[histories.length - 1]; // EMA55 — shortest
  if (!ref.length) return [];
  return ref.map((pt, i) => ({
    time:  pt.time,
    value: histories.reduce((s, h) => s + h[i + (h.length - ref.length)].value, 0) / RIBBON_PERIODS.length,
  }));
}

/* ── RSI (Wilder's smoothing) ─────────────────────────────── */
function calcRSI(data, period = 14) {
  if (data.length < period + 1) return [];
  let g = 0, l = 0;
  for (let i = 1; i <= period; i++) {
    const d = data[i].close - data[i-1].close;
    if (d > 0) g += d; else l -= d;
  }
  g /= period; l /= period;
  const out = [];
  const push = (i, g, l) => out.push({ time: data[i].time, value: l === 0 ? 100 : 100 - 100 / (1 + g/l) });
  push(period, g, l);
  for (let i = period + 1; i < data.length; i++) {
    const d = data[i].close - data[i-1].close;
    g = (g * (period-1) + (d > 0 ? d : 0)) / period;
    l = (l * (period-1) + (d < 0 ? -d : 0)) / period;
    push(i, g, l);
  }
  return out;
}

/* ── BOLLINGER BANDS ──────────────────────────────────────── */
function calcBB(data, period = 20, mult = 2) {
  const upper = [], mid = [], lower = [];
  for (let i = period - 1; i < data.length; i++) {
    const sl   = data.slice(i - period + 1, i + 1);
    const mean = sl.reduce((a, d) => a + d.close, 0) / period;
    const std  = Math.sqrt(sl.reduce((a, d) => a + Math.pow(d.close - mean, 2), 0) / period);
    upper.push({ time: data[i].time, value: mean + mult * std });
    mid.push(  { time: data[i].time, value: mean });
    lower.push({ time: data[i].time, value: mean - mult * std });
  }
  return { upper, mid, lower };
}

/* ── CHART CREATION ──────────────────────────────────────── */
const LW_OPTS = {
  layout: { background: { color: '#0b0f17' }, textColor: '#8a94a8', fontSize: 11 },
  grid:   { vertLines: { color: '#101825' }, horzLines: { color: '#101825' } },
  crosshair: { mode: 1 },
  rightPriceScale: { borderColor: '#1a2233', scaleMargins: { top: 0.07, bottom: 0.15 } },
  timeScale: { borderColor: '#1a2233', timeVisible: true, secondsVisible: false },
  handleScroll: true, handleScale: true,
};

function makeChart(elId, showTime) {
  const el  = document.getElementById(elId);
  const cfg = JSON.parse(JSON.stringify(LW_OPTS));
  cfg.width  = el.clientWidth;
  cfg.height = el.clientHeight;
  cfg.timeScale.visible = showTime;
  const chart = LightweightCharts.createChart(el, cfg);
  const ro = new ResizeObserver(() => {
    if (chart) chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  });
  ro.observe(el);
  chart._ro = ro;
  return chart;
}

function destroyChart(key) {
  const c = lwCharts[key];
  if (!c) return;
  if (c._ro) c._ro.disconnect();
  c.remove();
  lwCharts[key] = null;
}

/* ── RENDER MAIN CHART ────────────────────────────────────── */
function renderChart(candles) {
  destroyChart('daily');
  candleRef  = null;
  drawLines  = [];
  bbSeries   = null;

  const rsiOn = document.getElementById('chk-rsi')?.checked;
  const chart = makeChart('chart-daily', !rsiOn);
  lwCharts.daily = chart;
  if (!candles.length) return;

  /* 1. Bollinger Bands behind candles (if enabled) */
  const bbOn = document.getElementById('chk-bb')?.checked;
  if (bbOn) _addBBSeries(chart, candles);

  /* 2. Consolidated EMA average — behind candles */
  const avg = calcRibbonAvg(candles);
  if (avg.length) chart.addLineSeries({
    color: '#00e6ff', lineWidth: 2,
    priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false,
  }).setData(avg);

  /* 3. Candles on top */
  candleRef = chart.addCandlestickSeries({
    upColor: '#00ff87', downColor: '#ff3366', borderVisible: false,
    wickUpColor: '#00ff87', wickDownColor: '#ff3366',
  });
  candleRef.setData(candles);

  /* 4. EMA 8 dashed entry line */
  const e8 = calcEMALast(candles, 8);
  if (e8) candleRef.createPriceLine({ price: e8, color: '#00ff87', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: ' EMA 8' });

  /* 5. EMA 55 solid stop line */
  const e55 = calcEMALast(candles, 55);
  if (e55) candleRef.createPriceLine({ price: e55, color: '#ff3366', lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: ' EMA 55' });

  /* 6. Volume histogram — bottom 15% */
  if (candles.some(d => d.volume > 0)) {
    chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
    chart.addHistogramSeries({ priceScaleId: 'volume', lastValueVisible: false, priceLineVisible: false })
      .setData(candles.map(d => ({ time: d.time, value: d.volume, color: d.close >= d.open ? 'rgba(0,255,135,0.22)' : 'rgba(255,51,102,0.22)' })));
  }

  /* 7. Crosshair → show price hint for hline tool */
  chart.subscribeCrosshairMove(param => {
    if (!param.point || !candleRef) return;
    const price = candleRef.coordinateToPrice(param.point.y);
    const hint  = document.getElementById('cursor-hint');
    if (price != null && activeTool === 'hline')
      hint.textContent = '[ CLICK → H-LINE @ ' + price.toFixed(2) + ' ]';
    else if (activeTool !== 'hline')
      hint.textContent = '';
  });

  /* 8. Click → place horizontal line */
  document.getElementById('chart-daily').onclick = e => {
    if (activeTool !== 'hline' || !candleRef) return;
    const price = candleRef.coordinateToPrice(e.offsetY);
    if (price == null) return;
    const pl = candleRef.createPriceLine({ price, color: '#ecc94b', lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: '', draggable: true });
    drawLines.push({ series: candleRef, pl });
  };

  chart.timeScale().fitContent();
}

function _addBBSeries(chart, candles) {
  const bb = calcBB(candles, 20, 2);
  const lineOpts = { priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };
  bbSeries = {
    upper:  chart.addLineSeries({ ...lineOpts, color: 'rgba(100,180,255,0.55)', lineWidth: 1 }),
    mid:    chart.addLineSeries({ ...lineOpts, color: 'rgba(100,180,255,0.3)',  lineWidth: 1, lineStyle: 2 }),
    lower:  chart.addLineSeries({ ...lineOpts, color: 'rgba(100,180,255,0.55)', lineWidth: 1 }),
  };
  bbSeries.upper.setData(bb.upper);
  bbSeries.mid.setData(bb.mid);
  bbSeries.lower.setData(bb.lower);
}

/* ── DRAWING TOOLS ───────────────────────────────────────── */
function setTool(tool) {
  activeTool = tool;
  document.querySelectorAll('.tool-btn[id^="tool-"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + tool);
  if (btn) btn.classList.add('active');
  document.getElementById('chart-daily').style.cursor = tool === 'hline' ? 'crosshair' : 'default';
  if (tool !== 'hline') document.getElementById('cursor-hint').textContent = '';
}

function undoDrawing() {
  if (!drawLines.length) return;
  const { series, pl } = drawLines.pop();
  try { series.removePriceLine(pl); } catch(e) {}
}

function clearDrawings() {
  drawLines.forEach(({ series, pl }) => { try { series.removePriceLine(pl); } catch(e) {} });
  drawLines = [];
}

/* ── ZOOM & TIMEFRAME ────────────────────────────────────── */
function setTimeRange(months, el) {
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  if (!months) { lwCharts.daily?.timeScale().fitContent(); return; }
  const to   = new Date().toISOString().slice(0, 10);
  const from = new Date();
  from.setMonth(from.getMonth() - months);
  lwCharts.daily?.timeScale().setVisibleRange({ from: from.toISOString().slice(0, 10), to });
}

function doZoom(factor) {
  const range = lwCharts.daily?.timeScale().getVisibleLogicalRange();
  if (!range) return;
  const mid  = (range.from + range.to) / 2;
  const half = (range.to - range.from) / 2 * factor;
  lwCharts.daily.timeScale().setVisibleLogicalRange({ from: mid - half, to: mid + half });
}

function fitAll() {
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tf-all').classList.add('active');
  lwCharts.daily?.timeScale().fitContent();
}

/* ── INDICATOR PANEL ─────────────────────────────────────── */
function toggleIndPanel(e) {
  const p = document.getElementById('ind-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  e.stopPropagation();
}
document.addEventListener('click', () => {
  const p = document.getElementById('ind-panel');
  if (p) p.style.display = 'none';
});

/* ── RSI TOGGLE ──────────────────────────────────────────── */
function toggleRSI(el) {
  if (el.checked) {
    document.getElementById('rsi-wrap').style.display = 'block';
    lwCharts.daily?.timeScale().applyOptions({ visible: false });
    renderRSI();
    setupTimeSync();
  } else {
    document.getElementById('rsi-wrap').style.display = 'none';
    lwCharts.daily?.timeScale().applyOptions({ visible: true });
    destroyChart('rsi');
  }
}

function renderRSI() {
  destroyChart('rsi');
  if (!currentData) return;
  const el    = document.getElementById('chart-rsi');
  const chart = makeChart('chart-rsi', true);
  lwCharts.rsi = chart;

  chart.applyOptions({
    rightPriceScale: { scaleMargins: { top: 0.1, bottom: 0.1 }, borderColor: '#1a2233' },
    layout: { background: { color: '#080b11' }, textColor: '#8a94a8', fontSize: 10 },
  });

  const rsiLine = chart.addLineSeries({
    color: '#9c6fbe', lineWidth: 1.5,
    priceLineVisible: false, lastValueVisible: true,
  });
  rsiLine.setData(calcRSI(currentData, 14));
  rsiLine.createPriceLine({ price: 70, color: 'rgba(255,51,102,0.5)', lineWidth: 1, lineStyle: 2, axisLabelVisible: true,  title: 'OB' });
  rsiLine.createPriceLine({ price: 50, color: 'rgba(113,128,150,0.25)', lineWidth: 1, lineStyle: 1, axisLabelVisible: false, title: '' });
  rsiLine.createPriceLine({ price: 30, color: 'rgba(0,255,135,0.5)',   lineWidth: 1, lineStyle: 2, axisLabelVisible: true,  title: 'OS' });

  chart.timeScale().fitContent();
  if (lwCharts.daily) {
    const range = lwCharts.daily.timeScale().getVisibleLogicalRange();
    if (range) chart.timeScale().setVisibleLogicalRange(range);
  }
}

function setupTimeSync() {
  if (!lwCharts.daily || !lwCharts.rsi) return;
  lwCharts.daily.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (syncBlock || !range || !lwCharts.rsi) return;
    syncBlock = true;
    lwCharts.rsi.timeScale().setVisibleLogicalRange(range);
    syncBlock = false;
  });
  lwCharts.rsi.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (syncBlock || !range || !lwCharts.daily) return;
    syncBlock = true;
    lwCharts.daily.timeScale().setVisibleLogicalRange(range);
    syncBlock = false;
  });
}

/* ── BB TOGGLE ───────────────────────────────────────────── */
function toggleBB(el) {
  if (!lwCharts.daily || !currentData) return;
  if (el.checked) {
    if (bbSeries) return; // already shown
    _addBBSeries(lwCharts.daily, currentData);
  } else {
    if (bbSeries) {
      ['upper','mid','lower'].forEach(k => { try { lwCharts.daily.removeSeries(bbSeries[k]); } catch(e) {} });
      bbSeries = null;
    }
  }
}

/* ── SIGNAL STRIP ────────────────────────────────────────── */
function updateSignalStrip(ticker, daily) {
  const e8 = calcEMALast(daily,8), e13 = calcEMALast(daily,13),
        e21 = calcEMALast(daily,21), e34 = calcEMALast(daily,34), e55 = calcEMALast(daily,55);
  const close = daily[daily.length - 1].close;
  const fmt = v => v != null ? v.toFixed(2) : '—';
  document.getElementById('v-e8').textContent    = fmt(e8);
  document.getElementById('v-e13').textContent   = fmt(e13);
  document.getElementById('v-e21').textContent   = fmt(e21);
  document.getElementById('v-e34').textContent   = fmt(e34);
  document.getElementById('v-e55').textContent   = fmt(e55);
  document.getElementById('v-close').textContent = close.toFixed(2);
  if (e8 && e55) {
    const varAbs = Math.abs(e8 - e55), tStr = (e8 - e55) / e55 * 100;
    document.getElementById('v-var').textContent  = varAbs.toFixed(2) + ' (' + (varAbs/e8*100).toFixed(1) + '%)';
    const tEl = document.getElementById('v-tstr');
    tEl.textContent   = (tStr > 0 ? '+' : '') + tStr.toFixed(2) + '%';
    tEl.style.color   = tStr > 0 ? '#00ff87' : '#ff3366';
  }
  const isLong  = e8>e13 && e13>e21 && e21>e34 && e34>e55 && close>=e8;
  const isShort = e8<e13 && e13<e21 && e21<e34 && e34<e55 && close<=e8;
  const badge = document.getElementById('sig-badge');
  badge.className = 'sig-badge ' + (isLong ? 'sig-long' : isShort ? 'sig-short' : 'sig-neutral');
  badge.textContent = isLong ? '▲ QUANT ALPHA LONG // '+ticker : isShort ? '▼ QUANT ALPHA SHORT // '+ticker : '◆ RIBBON NEUTRAL // '+ticker;
}

/* ── STATUS ──────────────────────────────────────────────── */
function setStatus(text, cls) {
  const el = document.getElementById('status-txt');
  el.textContent = text;
  el.className   = 'status-badge ' + (cls || '');
}

/* ── MAIN LOADER ─────────────────────────────────────────── */
async function loadTicker(ticker, exchange) {
  ticker = ticker.toUpperCase(); exchange = exchange.toUpperCase();
  setStatus('FETCHING ' + ticker + '.' + exchange + '...');
  document.getElementById('load-daily').className  = 'chart-loading';
  document.getElementById('legend-daily').style.display = 'none';
  document.getElementById('sig-badge').className   = 'sig-badge sig-loading';
  document.getElementById('sig-badge').textContent = '— LOADING ' + ticker + ' —';
  document.getElementById('badge-daily').textContent = '1D — QUANT MAIN VECTOR // ' + ticker;
  try {
    const params = new URLSearchParams({ symbol: ticker+'.'+exchange, endpoint:'historical', period:'d' });
    const res    = await fetch(EOD_PROXY + '?' + params);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const daily = normalize(await res.json());
    if (daily.length < 55) throw new Error('Nur ' + daily.length + ' Bars — mind. 55 nötig');
    currentData = daily;

    renderChart(daily);
    updateSignalStrip(ticker, daily);

    /* Re-render indicators if they were on */
    if (document.getElementById('chk-rsi').checked) { renderRSI(); setupTimeSync(); }

    document.getElementById('load-daily').className    = 'chart-loading hidden';
    document.getElementById('legend-daily').style.display = 'block';
    setStatus('LIVE // ' + ticker + '.' + exchange + ' // ' + daily.length + ' BARS', 'live');
  } catch(err) {
    console.error('[TR]', err);
    document.getElementById('load-daily').className = 'chart-loading hidden';
    setStatus('ERROR: ' + err.message, 'err');
    document.getElementById('sig-badge').textContent = '⚠ ' + err.message;
    document.getElementById('sig-badge').className   = 'sig-badge sig-neutral';
  }
}

/* ── PRESETS & MANUAL ────────────────────────────────────── */
function loadPreset(btn) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  loadTicker(btn.dataset.ticker, btn.dataset.exchange);
}

function runManual() {
  const t = document.getElementById('inp-ticker').value.trim();
  const e = document.getElementById('inp-exchange').value;
  if (!t) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  loadTicker(t, e);
}

document.getElementById('inp-ticker').addEventListener('keydown', e => { if (e.key === 'Enter') runManual(); });

/* ── BOOT ────────────────────────────────────────────────── */
window.addEventListener('load', () => loadTicker('SAP', 'XETRA'));
</script>
