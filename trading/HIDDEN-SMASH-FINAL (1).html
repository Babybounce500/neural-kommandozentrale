<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BODY_SLAM // HIDDEN REAPER v6.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030206;
      --panel: #07040f;
      --panel-inner: #110822;
      --border: rgba(240, 0, 255, 0.2);
      --txt-muted: #645788;
      --white: #e9e9f0;
      --green: #00ffaa;
      --red: #ff0055;
      --magenta: #ff00ff;
      --cyan: #00f0ff;
      --gold: #ffb700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--white); font-family: 'JetBrains Mono', monospace; padding: 24px; }

    .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(240, 0, 255, 0.1); padding-bottom: 20px; }
    .title { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 15px var(--magenta); color: #fff; }
    .subtitle { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--cyan); letter-spacing: 2px; margin-top: 5px; }

    .controls {
      display: flex; gap: 16px; margin-bottom: 24px; background: var(--panel); padding: 20px; 
      border: 1px solid var(--border); border-radius: 6px; align-items: flex-end; flex-wrap: wrap;
    }
    .control-grid { display: flex; flex-direction: column; gap: 6px; }
    .control-label { font-size: 0.75rem; color: var(--txt-muted); text-transform: uppercase; font-weight: bold; }

    select, input { background: var(--panel-inner); border: 1px solid rgba(240,0,255,0.15); color: var(--white); padding: 10px 14px; border-radius: 4px; font-family: 'JetBrains Mono'; width: 100%; }
    
    .btn {
      background: transparent; color: var(--cyan); border: 1px solid var(--cyan); padding: 10px 20px;
      border-radius: 4px; font-family: 'Orbitron'; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    }
    .btn:hover { background: var(--cyan); color: #030206; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
    .btn-export { color: var(--gold); border-color: var(--gold); margin-left: auto; }
    .btn-export:hover { background: var(--gold); color: #030206; box-shadow: 0 0 15px rgba(255, 183, 0, 0.4); }

    .table-container { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { font-family: 'Orbitron'; font-size: 0.85rem; color: var(--cyan); border-bottom: 2px solid var(--border); padding: 12px; }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; }
    
    /* Liquidity Trap Glow Rows */
    .row-trap-short { background: rgba(255, 0, 255, 0.08) !important; border-left: 5px solid var(--magenta); }
    .row-trap-long { background: rgba(0, 240, 255, 0.08) !important; border-left: 5px solid var(--cyan); }
    tr:hover { background: rgba(255,255,255,0.02); }

    .badge { font-family: 'Orbitron'; font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 3px; display: inline-block; text-transform: uppercase; }
    .bg-trap-short { background: var(--magenta); color: #fff; box-shadow: 0 0 12px var(--magenta); font-weight: 900; }
    .bg-trap-long { background: var(--cyan); color: #030206; box-shadow: 0 0 12px var(--cyan); font-weight: 900; }
    .bg-exhaustion { background: rgba(255, 183, 0, 0.15); color: var(--gold); border: 1px solid var(--gold); }
    .bg-stable { background: rgba(255,255,255,0.05); color: var(--white); border: 1px solid var(--txt-muted); }
    
    .text-red { color: var(--red); font-weight: bold; }
    .text-green { color: var(--green); font-weight: bold; }
    .text-magenta { color: var(--magenta); font-weight: bold; }

    #progress { font-size: 0.85rem; color: var(--gold); margin-bottom: 10px; display: none; }
  </style>
</head>

    function init() {
      const select = document.getElementById('categorySelect');
      marketUniverse.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id; opt.textContent = cat.label;
        select.appendChild(opt);
      });
    }
    document.addEventListener('DOMContentLoaded', init);

    async function executeHiddenScan() {
      const category = document.getElementById('categorySelect').value;
      const threshold = parseFloat(document.getElementById('stretchInput').value) || 5.0;
      const tbody = document.getElementById('matrixTableBody');
      const progress = document.getElementById('progress');
      
      tbody.innerHTML = '';
      progress.style.display = 'block';

      const symbols = marketUniverse.categories.find(c => c.id === category).symbols;
      
      for(let i=0; i < symbols.length; i++) {
        const sym = symbols[i];
        progress.textContent = `Analysiere Stop-Loss Jagd bei ${i+1}/${symbols.length}: ${sym}...`;
        await scanHiddenSmash(sym, threshold, tbody);
        await new Promise(r => setTimeout(r, 1000));
      }
      progress.style.display = 'none';
    }

    async function scanHiddenSmash(sym, threshold, tbody) {
      try {
        let apiSymbol = sym.endsWith(".US") ? sym.replace(".US", "") : sym;

        const res = await fetch(`${API_URL}?symbol=${apiSymbol}&endpoint=historical&period=d`);
        if (!res.ok) return;
        let data = await res.json();

        if (data && data.length >= 22) {
          data.sort((a, b) => new Date(b.date) - new Date(a.date));

          const closeA = parseFloat(data[0].close);
          const highA  = parseFloat(data[0].high);
          const lowA   = parseFloat(data[0].low);
          
          const highB  = parseFloat(data[1].high);
          const lowB   = parseFloat(data[1].low);

          let sma20Sum = 0;
          for(let k=0; k<20; k++) { sma20Sum += parseFloat(data[k].close); }
          const sma20 = sma20Sum / 20;

          const stretchPct = ((closeA - sma20) / sma20) * 100;

          // DEINE DEFIERTE HIDDEN SMASH STRUKTUR
          let hiddenSmash = "NO TRAP";
          if (highA > highB && closeA < highB) {
            hiddenSmash = "BULL TRAP (SHORT)";
          } else if (lowA < lowB && closeA > lowB) {
            hiddenSmash = "BEAR TRAP (LONG)";
          }

          // STRATEGIE EXECUTION LOGIK
          let statusText = "STABLE";
          let actionText = "Keine Liquiditäts-Abfischung sichtbar.";
          let badgeClass = "bg-stable";
          let rowClass = "";

          // Pfad A: Bull Trap detektiert (Kurs schoss oben drüber und kollabiert)
          if (hiddenSmash === "BULL TRAP (SHORT)") {
            if (stretchPct >= threshold) {
              statusText = "HIDDEN SMASH SHORT";
              actionText = "🚨 COUNTER SHORT ENTRY // Gier-Spike komplett abverkauft. Leerverkauf triggern!";
              badgeClass = "bg-trap-short";
              rowClass = "row-trigger-short";
            } else {
              statusText = "TRAP WATCH";
              actionText = "⚠️ Bull Trap außerhalb der Trend-Überhitzung. Beobachten.";
              badgeClass = "bg-exhaustion";
            }
          }
          // Pfad B: Bear Trap detektiert (Kurs brach nach unten aus und schiesst hoch)
          else if (hiddenSmash === "BEAR TRAP (LONG)") {
            if (stretchPct <= -threshold) {
              statusText = "HIDDEN SMASH LONG";
              actionText = "🔥 COUNTER LONG ENTRY // Panik-Tief massiv aufgekauft. Direkt Long reingehen!";
              badgeClass = "bg-trap-long";
              rowClass = "row-trigger-long";
            } else {
              statusText = "TRAP WATCH";
              actionText = "⚠️ Bear Trap im neutralen Band. Keine aggressive Execution.";
              badgeClass = "bg-exhaustion";
            }
          }

          const decimals = closeA < 2 ? 4 : 2;
          const row = `
            <tr class="${rowClass}">
              <td><strong>${sym}</strong></td>
              <td>$${closeA.toFixed(decimals)}</td>
              <td>$${sma20.toFixed(decimals)}</td>
              <td class="${stretchPct >= 0 ? 'text-red' : 'text-green'}">${stretchPct.toFixed(2)}%</td>
              <td class="${hiddenSmash.includes('BULL') ? 'text-red' : hiddenSmash.includes('BEAR') ? 'text-green' : ''}"><strong>${hiddenSmash}</strong></td>
              <td><span class="badge ${badgeClass}">${statusText}</span></td>
              <td>${actionText}</td>
            </tr>
          `;
          tbody.insertAdjacentHTML('beforeend', row);
        }
      } catch(e) { console.error("Error hunting traps:", e); }
    }

    function exportTrapCSV() {
      let csv = [];
      let rows = document.querySelectorAll("table tr");
      for (let i = 0; i < rows.length; i++) {
        let row = [], cols = rows[i].querySelectorAll("td, th");
        for (let j = 0; j < cols.length; j++) row.push(cols[j].innerText.replace(",", "."));
        csv.push(row.join(";"));
      }
      let csvFile = new Blob([csv.join("\n")], {type: "text/csv;"});
      let downloadLink = document.createElement("a");
      downloadLink.download = `HIDDEN_SMASH_TRAPS_${new Date().toISOString().slice(0,10)}.csv`;
      downloadLink.href = window.URL.createObjectURL(csvFile);
      downloadLink.style.display = "none";
      document.body.appendChild(downloadLink);
      downloadLink.click();
    }
  </script>
