
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europeana Search App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .pastel-bg {
            background-color: #f8f5f1;
        }
        .pastel-border {
            border-color: #e3dcd0;
        }
        .pastel-hover:hover {
            background-color: #e3dcd0;
        }
        .result-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 0.375rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .result-image:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        @media (min-width: 768px) {
            .result-image {
                height: 250px;
            }
        }
    </style>
</head>
<body class="pastel-bg min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-2">Europeana Search</h1>
            <p class="text-center text-gray-600 px-4 md:px-0">Entdecken Sie Kunst, Musik, Fotografie und Manuskripte aus der ganzen Welt</p>
        </header>

        <main>
            <div class="bg-white p-4 md:p-6 rounded-lg shadow-md pastel-border border mb-6 md:mb-8">
                <form id="searchForm" class="space-y-4">
                    <div class="flex flex-col md:flex-row md:space-x-4 space-y-4 md:space-y-0">
                        <div class="flex-1">
                            <label for="searchQuery" class="block text-sm font-medium text-gray-700 mb-1">Suchbegriff</label>
                            <input type="text" id="searchQuery" name="searchQuery" placeholder="Titel, Künstler, Epoche" class="w-full px-3 py-2 border pastel-border rounded-md focus:outline-none focus:ring-2 focus:ring-gray-400">
                        </div>
                        <div class="w-full md:w-48">
                            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Kategorie</label>
                            <select id="category" name="category" class="w-full px-3 py-2 border pastel-border rounded-md focus:outline-none focus:ring-2 focus:ring-gray-400">
                                <option value="art">Kunst</option>
                                <option value="music">Musik</option>
                                <option value="photography">Fotografie</option>
                                <option value="manuscripts">Manuskripte</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full md:w-auto px-4 py-2 bg-gray-800 text-white rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-400">Suchen</button>
                </form>
            </div>

            <div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                <!-- Ergebnisse werden hier angezeigt -->
            </div>

            <div id="pagination" class="flex justify-center items-center space-x-4 mt-6 md:mt-8">
                <button id="prevPage" class="px-3 py-1 md:px-4 md:py-2 bg-white pastel-border border rounded-md pastel-hover focus:outline-none focus:ring-2 focus:ring-gray-400" disabled>Zurück</button>
                <span id="pageInfo" class="text-gray-700 text-sm md:text-base">Seite 1 von 1</span>
                <button id="nextPage" class="px-3 py-1 md:px-4 md:py-2 bg-white pastel-border border rounded-md pastel-hover focus:outline-none focus:ring-2 focus:ring-gray-400" disabled>Vor</button>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('searchForm');
            const resultsContainer = document.getElementById('resultsContainer');
            const prevPageBtn = document.getElementById('prevPage');
            const nextPageBtn = document.getElementById('nextPage');
            const pageInfo = document.getElementById('pageInfo');

            let currentPage = 1;
            let totalPages = 1;
            let currentQuery = 'art';
            let currentCategory = 'art';

            // Formular-Submit-Handler
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                currentQuery = document.getElementById('searchQuery').value || document.getElementById('category').value;
                currentCategory = document.getElementById('category').value;
                currentPage = 1;
                fetchResults();
            });

            // Pagination-Handler
            prevPageBtn.addEventListener('click', function() {
                if (currentPage > 1) {
                    currentPage--;
                    fetchResults();
                }
            });

            nextPageBtn.addEventListener('click', function() {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchResults();
                }
            });

            // Ergebnisse abrufen
            function fetchResults() {
                const apiUrl = `https://www.europeana.eu/api/v2/search.json?query=${encodeURIComponent(currentQuery)}&wskey=apidemo&profile=standard&rows=12&page=${currentPage}`;

                fetch(apiUrl)
                    .then(response => response.json())
                    .then(data => {
                        displayResults(data);
                        updatePagination(data);
                    })
                    .catch(error => {
                        console.error('Fehler beim Abrufen der Daten:', error);
                        resultsContainer.innerHTML = '<p class="text-red-500 col-span-full text-center">Fehler beim Abrufen der Daten. Bitte versuchen Sie es später erneut.</p>';
                    });
            }

            // Ergebnisse anzeigen
            function displayResults(data) {
                resultsContainer.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-gray-600 col-span-full text-center">Keine Ergebnisse gefunden.</p>';
                    return;
                }

                const items = data.items;

                items.forEach(item => {
                    const title = item.title && item.title[0] ? item.title[0] : 'Ohne Titel';
                    const imageUrl = item.edmPreview && item.edmPreview[0] ? item.edmPreview[0] : null;
                    const provider = item.dataProvider && item.dataProvider[0] ? item.dataProvider[0] : 'Unbekannter Anbieter';
                    const sourceLink = item.guid ? item.guid : '#';

                    const resultElement = document.createElement('div');
                    resultElement.className = 'bg-white p-3 md:p-4 rounded-lg shadow-md pastel-border border flex flex-col h-full';

                    const imageHtml = imageUrl
                        ? `<img src="${imageUrl}" alt="${title}" class="result-image mb-3">`
                        : '<div class="result-image bg-gray-200 flex items-center justify-center mb-3"><span class="text-gray-500 text-sm text-center px-2">Kein Vorschaubild verfügbar</span></div>';

                    resultElement.innerHTML = `
                        ${imageHtml}
                        <h3 class="text-base md:text-lg font-semibold text-gray-800 mb-2 line-clamp-2">${title}</h3>
                        <p class="text-gray-600 text-sm mb-2 line-clamp-1">Anbieter: ${provider}</p>
                        <div class="mt-auto">
                            <a href="${sourceLink}" target="_blank" class="inline-block px-3 py-1 md:px-4 md:py-2 bg-gray-800 text-white text-sm rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-400">Original anzeigen</a>
                        </div>
                    `;

                    resultsContainer.appendChild(resultElement);
                });
            }

            // Pagination aktualisieren
            function updatePagination(data) {
                totalPages = Math.ceil(data.totalResults / 12);
                pageInfo.textContent = `Seite ${currentPage} von ${totalPages}`;

                prevPageBtn.disabled = currentPage === 1;
                nextPageBtn.disabled = currentPage === totalPages;
            }

            // Initiale Suche
            fetchResults();
        });
    </script>
</body>
</html>
