
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>📚 Domvs Avrea – Open Library Research</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Orbitron', sans-serif; }
    select, input, button { font-family: inherit; }
    /* Mobile */
    @media (max-width: 640px) {
      h1 { font-size: 1.9rem; text-align: center; }
      button, select, input { width: 100%; }
    }
    /* Print */
    @media print {
      body { background: #fff; color: #000; }
      .no-print { display: none !important; }
      a { color: #000; text-decoration: underline; }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100">
  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-4xl font-bold mb-6 text-cyan-400">📚 Domvs Avrea – Open Library Research</h1>

    <!-- API Key -->
    <div class="no-print">
      <label class="block mb-2 text-cyan-200 font-medium">🔑 OpenAI API Key:</label>
      <div class="flex gap-2 mb-6 flex-col md:flex-row">
        <input id="apiKey" type="password" placeholder="sk-..." class="flex-1 p-2 border border-cyan-500 bg-gray-900 rounded" />
        <button id="saveApiKey" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">💾 Speichern</button>
      </div>
    </div>

    <!-- Search Controls -->
    <div class="no-print">
      <label class="block mb-2 text-cyan-200 font-medium">🔍 Suchbegriff:</label>
      <div class="flex flex-wrap gap-2 mb-4">
        <input id="query" type="text" placeholder="z. B. Artificial Intelligence" 
               class="flex-1 p-2 border border-cyan-500 bg-gray-900 rounded text-white min-w-[250px]" />

        <!-- Massive Quick Topics -->
        <select id="quickTopics" class="p-2 border border-cyan-500 bg-gray-900 text-white rounded">
          <option disabled selected>⏩ Beliebte Buchthemen</option>

          <optgroup label="🤖 Technologie & Zukunft">
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="Machine Learning">Machine Learning</option>
            <option value="Deep Learning">Deep Learning</option>
            <option value="Blockchain">Blockchain</option>
            <option value="Cryptography">Cryptography</option>
            <option value="Quantum Computing">Quantum Computing</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Data Privacy">Data Privacy</option>
            <option value="Virtual Reality">Virtual Reality</option>
            <option value="Augmented Reality">Augmented Reality</option>
            <option value="Smart Cities">Smart Cities</option>
          </optgroup>

          <optgroup label="🧬 Wissenschaft & Medizin">
            <option value="CRISPR gene editing">CRISPR gene editing</option>
            <option value="mRNA vaccines">mRNA vaccines</option>
            <option value="Longevity research">Longevity research</option>
            <option value="Neuroscience">Neuroscience</option>
            <option value="Biohacking">Biohacking</option>
            <option value="Nutrition science">Nutrition science</option>
            <option value="Cognitive science">Cognitive science</option>
          </optgroup>

          <optgroup label="📜 Geschichte & Politik">
            <option value="World War II">World War II</option>
            <option value="Ancient Rome">Ancient Rome</option>
            <option value="Cold War">Cold War</option>
            <option value="History of Science">History of Science</option>
            <option value="Political Philosophy">Political Philosophy</option>
            <option value="Democracy">Democracy</option>
            <option value="Geopolitics">Geopolitics</option>
          </optgroup>

          <optgroup label="💼 Business & Selbstentwicklung">
            <option value="Entrepreneurship">Entrepreneurship</option>
            <option value="Startup culture">Startup culture</option>
            <option value="Marketing psychology">Marketing psychology</option>
            <option value="Personal finance">Personal finance</option>
            <option value="Investing basics">Investing basics</option>
            <option value="Habits">Habits</option>
            <option value="Stoicism">Stoicism</option>
            <option value="Mindfulness">Mindfulness</option>
          </optgroup>

          <optgroup label="🎨 Popkultur & Medien">
            <option value="Science fiction classics">Science fiction classics</option>
            <option value="Cyberpunk">Cyberpunk</option>
            <option value="Dystopian novels">Dystopian novels</option>
            <option value="Comics history">Comics history</option>
            <option value="Manga">Manga</option>
            <option value="Film theory">Film theory</option>
            <option value="Hip hop history">Hip hop history</option>
            <option value="Pop culture studies">Pop culture studies</option>
            <option value="True crime">True crime</option>
            <option value="Video game design">Video game design</option>
          </optgroup>

          <optgroup label="🌍 Gesellschaft & Trends">
            <option value="Climate change">Climate change</option>
            <option value="Sustainability">Sustainability</option>
            <option value="UFO and UAP">UFO and UAP</option>
            <option value="Digital transformation">Digital transformation</option>
            <option value="Future of work">Future of work</option>
            <option value="Globalization">Globalization</option>
            <option value="Minimalism">Minimalism</option>
            <option value="Digital nomad">Digital nomad</option>
          </optgroup>
        </select>

        <select id="numBooks" class="p-2 border border-cyan-500 bg-gray-900 text-white rounded">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="10">10</option>
        </select>

        <!-- Language -->
        <select id="translateTo" class="p-2 border border-cyan-500 bg-gray-900 text-white rounded">
          <option value="ger" selected>🇩🇪 Deutsch</option>
          <option value="eng">🇬🇧 English</option>
          <option value="fre">🇫🇷 Français</option>
          <option value="spa">🇪🇸 Español</option>
          <option value="ita">🇮🇹 Italiano</option>
          <option value="por">🇵🇹 Português</option>
          <option value="rus">🇷🇺 Русский</option>
          <option value="chi">🇨🇳 中文</option>
          <option value="jpn">🇯🇵 日本語</option>
        </select>

        <button onclick="searchOpenLibrary()" class="bg-cyan-600 text-white px-4 py-2 rounded hover:bg-cyan-700">🔍 Suchen</button>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="space-y-6"></div>
  </div>

  <script>
    // Quick Topics -> input
    document.getElementById('quickTopics').addEventListener('change', (e) => {
      document.getElementById('query').value = e.target.value;
    });

    // Save API Key
    document.getElementById('saveApiKey').addEventListener('click', () => {
      const apiKey = document.getElementById("apiKey").value.trim();
      if (apiKey) {
        localStorage.setItem("openAiApiKey", apiKey);
        alert("✅ API Key gespeichert!");
      }
    });

    // Load API Key
    window.onload = () => {
      const savedKey = localStorage.getItem("openAiApiKey");
      if (savedKey) document.getElementById("apiKey").value = savedKey;
    };

    // Translation prompts
    const translationPrompts = {
      eng: "Translate the following text into English:",
      fre: "Traduisez le texte suivant en français:",
      spa: "Traduce el siguiente texto al español:",
      ita: "Traduci il seguente testo in italiano:",
      por: "Traduza o seguinte texto para português:",
      rus: "Переведите следующий текст на русский:",
      chi: "将以下文本翻译成中文:",
      jpn: "次のテキストを日本語に翻訳してください:"
    };

    // Smooth language switch: re-translate existing content if base exists
    document.getElementById('translateTo').addEventListener('change', async (e) => {
      const newLang = e.target.value;
      const apiKey = document.getElementById("apiKey").value.trim();
      const cards = document.querySelectorAll('.result-card');
      for (const card of cards) {
        const summaryDiv = card.querySelector('.summary');
        const base = card.dataset.baseText; // always stored in German base
        if (!base) continue; // nothing generated yet
        if (newLang === 'ger') {
          summaryDiv.innerText = base;
        } else {
          if (!apiKey) {
            alert("⚠️ Für die Übersetzung wird ein OpenAI API Key benötigt.");
            return;
          }
          const code = translationPrompts[newLang] ? newLang : null;
          if (!code) {
            // unknown code -> keep base
            summaryDiv.innerText = base;
            continue;
          }
          summaryDiv.innerText = "🌍 Übersetze...";
          const translated = await callOpenAI(apiKey, `${translationPrompts[newLang]}\n\n${base}`);
          summaryDiv.innerText = translated;
        }
      }
    });

    async function searchOpenLibrary() {
      const query = document.getElementById("query").value.trim();
      const num = document.getElementById("numBooks").value;
      const resultsDiv = document.getElementById("results");

      if (!query) return alert("Bitte Suchbegriff eingeben.");
      resultsDiv.innerHTML = "⏳ Suche Bücher...";

      try {
        const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(query)}&limit=${num}`);
        const data = await res.json();
        const books = data.docs;

        if (!books || books.length === 0) {
          resultsDiv.innerHTML = "❌ Keine Bücher gefunden.";
          return;
        }

        resultsDiv.innerHTML = "";
        for (const b of books) {
          const title = b.title || "Ohne Titel";
          const authors = b.author_name ? b.author_name.join(", ") : "❌ Keine Autoren";
          const year = b.first_publish_year || "Unbekannt";
          const coverId = b.cover_i;
          const coverUrl = coverId 
            ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`
            : "https://via.placeholder.com/150x200.png?text=No+Cover";
          const bookUrl = `https://openlibrary.org${b.key}`;

          const card = document.createElement("div");
          card.className = "result-card bg-gray-800 p-4 rounded shadow border border-cyan-600";
          card.dataset.baseText = ""; // will hold German base summary/outline
          card.dataset.title = title;

          card.innerHTML = `
            <div class="flex flex-col md:flex-row gap-4">
              <img src="${coverUrl}" alt="Book cover" class="w-32 h-48 object-cover rounded border border-gray-700">
              <div class="flex-1">
                <h2 class="text-xl font-bold text-cyan-300 mb-1">${title}</h2>
                <p class="text-sm text-gray-400 mb-2">👥 Autoren: ${authors}</p>
                <p class="text-sm text-gray-400 mb-2">📅 Erstveröffentlichung: ${year}</p>
                <a href="${bookUrl}" target="_blank" class="text-cyan-400 underline">📖 Original auf Open Library</a>
                <div class="flex gap-2 mt-4 flex-wrap no-print">
                  <button class="summarize bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">🧠 Zusammenfassen</button>
                  <button class="ebook bg-purple-600 text-white px-3 py-1 rounded hover:bg-purple-700">📖 AI Ebook</button>
                  <button class="export-txt bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">📤 Export TXT</button>
                </div>
                <div class="summary mt-2 text-base leading-relaxed text-white whitespace-pre-wrap"></div>
              </div>
            </div>
          `;

          const summarizeBtn = card.querySelector(".summarize");
          const ebookBtn = card.querySelector(".ebook");
          const exportBtn = card.querySelector(".export-txt");
          const summaryDiv = card.querySelector(".summary");

          summarizeBtn.onclick = async () => {
            const apiKey = (document.getElementById("apiKey").value || "").trim();
            const translateTo = document.getElementById("translateTo").value;
            if (!apiKey) return alert("⚠️ Bitte API Key eingeben, um GPT zu nutzen.");

            summaryDiv.innerText = "🧠 GPT denkt...";
            // Always generate German base summary
            const basePrompt = `Erstelle eine präzise, wissenschaftlich fundierte Buchzusammenfassung in Deutsch (kurz, klar, relevant):
Titel: ${title}
Autoren: ${authors}
Erscheinungsjahr: ${year}`;
            let baseSummary = await callOpenAI(apiKey, basePrompt);
            card.dataset.baseText = baseSummary;

            if (translateTo !== "ger" && translationPrompts[translateTo]) {
              summaryDiv.innerText = "🌍 Übersetze Zusammenfassung...";
              baseSummary = await callOpenAI(apiKey, `${translationPrompts[translateTo]}\n\n${baseSummary}`);
            }
            summaryDiv.innerText = baseSummary;
          };

          ebookBtn.onclick = async () => {
            const apiKey = (document.getElementById("apiKey").value || "").trim();
            const translateTo = document.getElementById("translateTo").value;
            if (!apiKey) return alert("⚠️ Bitte API Key eingeben, um GPT zu nutzen.");

            summaryDiv.innerText = "📖 KI erstellt Ebook-Outline...";
            // Generate German base outline (10 chapters)
            const ebookPrompt = `Erstelle eine vollständige Ebook-Outline in Deutsch mit 10 Kapiteln.
Für jedes Kapitel:
- Prägnanter Titel
- Kurze 2–3 Sätze Summary (on point, klar, relevant)

Thema/Anker:
Titel: ${title}
Autoren: ${authors}

Format:
Kapitel X: [Titel]
Kurzsummary: [2–3 Sätze]`;
            let baseOutline = await callOpenAI(apiKey, ebookPrompt);
            card.dataset.baseText = baseOutline;

            if (translateTo !== "ger" && translationPrompts[translateTo]) {
              summaryDiv.innerText = "🌍 Übersetze Outline...";
              baseOutline = await callOpenAI(apiKey, `${translationPrompts[translateTo]}\n\n${baseOutline}`);
            }
            summaryDiv.innerText = baseOutline;
          };

          exportBtn.onclick = () => {
            const text = summaryDiv.innerText || "";
            if (!text || text.startsWith("🧠") || text.startsWith("📖") || text.startsWith("🌍")) {
              alert("⚠️ Bitte zuerst eine Zusammenfassung oder Ebook-Outline generieren.");
              return;
            }
            exportAsTxt(b, text);
          };

          resultsDiv.appendChild(card);
        }
      } catch (err) {
        resultsDiv.innerHTML = "❌ Fehler: " + err.message;
      }
    }

    async function callOpenAI(apiKey, prompt) {
      try {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4.1-mini",
            messages: [
              {
                role: "system",
                content: "Du bist ein präziser Literatur-Assistent. Erstelle professionelle Buchzusammenfassungen und klare Ebook-Outlines (10 Kapitel), knapp, strukturiert, wissenschaftlich nützlich."
              },
              { role: "user", content: prompt }
            ]
          })
        });
        const data = await res.json();
        return data.choices?.[0]?.message?.content || "⚠️ Keine Antwort erhalten.";
      } catch (err) {
        return "❌ OpenAI Fehler: " + err.message;
      }
    }

    function exportAsTxt(book, text) {
      const safeTitle = (book.title || "book").replace(/[^a-z0-9]/gi, "_").toLowerCase();
      let exportText = `# Domvs Avrea – Buch Export\n\n`;
      exportText += `Titel: ${book.title}\n`;
      exportText += `Autoren: ${book.author_name ? book.author_name.join(", ") : "Unbekannt"}\n`;
      exportText += `Erscheinungsjahr: ${book.first_publish_year || "Unbekannt"}\n`;
      exportText += `Quelle: https://openlibrary.org${book.key}\n\n`;
      exportText += `## KI-Inhalt:\n${text}\n`;

      const blob = new Blob([exportText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${safeTitle}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
