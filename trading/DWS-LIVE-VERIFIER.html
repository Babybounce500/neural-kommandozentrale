<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DWS FUND LIVE VERIFIER</title>
<style>
:root {
    --bg:#030108;--panel:#0b0616;--border:#2a1a4a;
    --green:#00ffaa;--red:#ff0055;--gold:#ffb700;--cyan:#00e5ff;--white:#e9e9f0;--muted:#7c6f94;
    --font-cyber:'Orbitron',sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Fira+Code&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--white);font-family:'Fira Code','Courier New',monospace;padding:16px;min-height:100vh;}
h1{font-family:var(--font-cyber);color:var(--cyan);font-size:18px;letter-spacing:2px;margin-bottom:4px;}
.sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:16px;}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.btn{background:#0a0a14;border:1px solid #333;color:#888;font-family:var(--font-cyber);font-size:10px;padding:6px 14px;border-radius:3px;cursor:pointer;letter-spacing:1px;transition:all .15s;}
.btn:hover{border-color:var(--cyan);color:var(--cyan);}
.btn.primary{border-color:var(--green);color:var(--green);}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn:disabled{opacity:.4;cursor:default;}
.stat-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:4px;}
.stat{font-size:10px;font-family:var(--font-cyber);}
.stat span{font-size:13px;font-weight:bold;}
.s-total{color:var(--white);}
.s-ok{color:var(--green);}
.s-na{color:var(--red);}
.s-run{color:var(--gold);}
.s-pct{color:var(--cyan);}
.progress-bar{height:4px;background:#1a1a2a;border-radius:2px;margin-bottom:12px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:2px;transition:width .3s;width:0%;}
.filter-row{display:flex;gap:6px;margin-bottom:10px;align-items:center;}
.filter-btn{background:#0a0a14;border:1px solid #2a2a3a;color:#666;font-size:9px;padding:4px 10px;border-radius:3px;cursor:pointer;font-family:var(--font-cyber);}
.filter-btn.active{border-color:var(--cyan);color:var(--cyan);}
#searchInp{background:#0a0a14;border:1px solid #2a2a3a;color:#ccc;font-family:'Fira Code',monospace;font-size:11px;padding:5px 10px;border-radius:3px;width:240px;outline:none;}
#searchInp:focus{border-color:var(--cyan);}
table{width:100%;border-collapse:collapse;font-size:11px;}
thead th{font-family:var(--font-cyber);font-size:9px;letter-spacing:1px;color:var(--muted);padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);}
tbody tr{border-bottom:1px solid #111;}
tbody tr:hover{background:#0a0616;}
td{padding:5px 8px;vertical-align:middle;}
.badge{display:inline-block;font-family:var(--font-cyber);font-size:8px;padding:2px 7px;border-radius:2px;letter-spacing:1px;font-weight:bold;}
.badge-ok{background:#001a0f;border:1px solid var(--green);color:var(--green);}
.badge-na{background:#1a0008;border:1px solid var(--red);color:var(--red);}
.badge-pend{background:#1a1400;border:1px solid #666;color:#666;}
.badge-load{background:#001a2a;border:1px solid var(--gold);color:var(--gold);}
.price{color:var(--green);font-weight:bold;}
.price-na{color:#3a3a5a;}
.sym{color:var(--cyan);font-size:10px;}
.name-cell{color:var(--muted);font-size:10px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tbl-wrap{max-height:620px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;}
.tbl-wrap::-webkit-scrollbar{width:4px;}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:2px;}
.batch-info{font-size:10px;color:var(--muted);margin-left:auto;}
</style>
</head>
<body>

<h1>DWS FUND LIVE VERIFIER</h1>
<p class="sub">844 DWS EUFUND Symbols // NAV Verification via previousClose // AI_BOT Endpoint</p>

<div class="controls">
    <button class="btn primary" id="btnStart" onclick="startVerify()">▶ START LIVE SCAN</button>

    <button class="btn" onclick="resetVerify()">↺ RESET</button>
    <button class="btn" onclick="exportCSV()">📥 EXPORT CSV</button>
    <span class="batch-info">Batch: <input type="number" id="batchSize" value="8" min="1" max="20" style="width:40px;background:#0a0a0a;border:1px solid #333;color:#888;text-align:center;font-size:10px;padding:2px;"> / Delay: <input type="number" id="batchDelay" value="600" min="100" max="3000" style="width:55px;background:#0a0a0a;border:1px solid #333;color:#888;text-align:center;font-size:10px;padding:2px;">ms</span>
</div>

<div class="stat-bar">
    <div class="stat s-total">TOTAL <span id="sTotal">844</span></div>

    <div class="stat s-ok">HAS NAV <span id="sOk">0</span></div>

    <div class="stat s-pct">SUCCESS% <span id="sPct">—</span></div>
    <div class="stat" style="color:var(--gold)">ETA <span id="sEta">—</span></div>
    <div class="stat" style="margin-left:auto;font-size:9px;color:var(--muted)" id="statusMsg">READY</div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="filter-row">
    <button class="filter-btn active" id="f-all"  onclick="setFilter('all')">ALL</button>
    <button class="filter-btn"        id="f-ok"   onclick="setFilter('ok')">HAS NAV</button>
    <button class="filter-btn"        id="f-na"   onclick="setFilter('na')">NO DATA</button>
    <button class="filter-btn"        id="f-pend" onclick="setFilter('pend')">PENDING</button>
    <input type="text" id="searchInp" placeholder="Filter by symbol or name..." oninput="applyFilters()">
</div>

<table>

</tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>

/* State */
let rows = DWS_SYMBOLS.map((sym, i) => ({ idx:i+1, sym, name:'', price:'', cur:'', status:'pend' }));
let running = false;
let activeFilter = 'all';

/* Init table */
function initTable() {
    const tbody = document.getElementById('tableBody');
    const frag  = document.createDocumentFragment();
    rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.id = 'row-' + r.idx;
        tr.innerHTML = `
            <td style="color:#3a3a5a;font-size:10px;">${r.idx}</td>
            <td class="sym">${r.sym}</td>
            <td class="name-cell" id="n-${r.idx}">—</td>
            <td id="p-${r.idx}" class="price-na">—</td>
            <td id="c-${r.idx}" style="color:#3a3a5a;">—</td>
            <td><span class="badge badge-pend" id="s-${r.idx}">PENDING</span></td>
        `;
        frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    updateStats();
}

/* Filter logic */
function setFilter(f) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('f-' + f).classList.add('active');
    applyFilters();
}

function applyFilters() {
    const q = document.getElementById('searchInp').value.toLowerCase();
    rows.forEach(r => {
        const tr = document.getElementById('row-' + r.idx);
        if (!tr) return;
        const matchFilter = activeFilter === 'all' || r.status === activeFilter;
        const matchSearch = !q || r.sym.toLowerCase().includes(q) || r.name.toLowerCase().includes(q);
        tr.style.display = matchFilter && matchSearch ? '' : 'none';
    });
}

/* Stats */
function updateStats() {
    const scanned = rows.filter(r => r.status !== 'pend').length;
    const ok      = rows.filter(r => r.status === 'ok').length;
    const na      = rows.filter(r => r.status === 'na').length;
    const pct     = scanned > 0 ? ((ok / scanned) * 100).toFixed(1) : '—';
    document.getElementById('sScanned').textContent = scanned;
    document.getElementById('sOk').textContent      = ok;
    document.getElementById('sNa').textContent      = na;
    document.getElementById('sPct').textContent     = scanned > 0 ? pct + '%' : '—';
    document.getElementById('progressFill').style.width = ((scanned / rows.length) * 100) + '%';
}

/* Update a row in the DOM */
function updateRow(r) {
    const namEl = document.getElementById('n-' + r.idx);
    const pricEl = document.getElementById('p-' + r.idx);
    const curEl  = document.getElementById('c-' + r.idx);
    const statEl = document.getElementById('s-' + r.idx);
    if (namEl)  namEl.textContent  = r.name || '—';
    if (curEl)  curEl.textContent  = r.cur  || '—';
    if (pricEl) {
        pricEl.textContent = r.price || '—';
        pricEl.className   = r.status === 'ok' ? 'price' : 'price-na';
    }
    if (statEl) {
        statEl.textContent = r.status === 'ok' ? 'HAS NAV' : r.status === 'na' ? 'NO DATA' : r.status === 'load' ? 'LOADING…' : 'PENDING';
        statEl.className   = 'badge ' + (r.status === 'ok' ? 'badge-ok' : r.status === 'na' ? 'badge-na' : r.status === 'load' ? 'badge-load' : 'badge-pend');
    }
}

/* Verify one symbol */
async function verifySymbol(r) {
    r.status = 'load';
    updateRow(r);
    try {
        const res  = await fetch(AI_BOT + '/eod/realtime/' + encodeURIComponent(r.sym) + '?fmt=json');
        const data = await res.json();
        const prev = data.previousClose;
        if (prev && prev !== 'NA' && !isNaN(parseFloat(prev))) {
            r.price  = parseFloat(prev).toFixed(4);
            r.cur    = data.currency || 'EUR';
            r.name   = data.name || '';
            r.status = 'ok';
        } else {
            r.status = 'na';
        }
    } catch {
        r.status = 'na';
    }
    updateRow(r);
    updateStats();
    applyFilters();
}

/* Main scan loop */
async function startVerify() {
    if (running) return;
    running = true;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled  = false;
    document.getElementById('statusMsg').textContent = 'SCANNING...';

    const pending = rows.filter(r => r.status === 'pend' || r.status === 'na');
    const batchSz = parseInt(document.getElementById('batchSize').value) || 8;
    const delay   = parseInt(document.getElementById('batchDelay').value) || 600;
    const t0      = Date.now();

    for (let i = 0; i < pending.length && running; i += batchSz) {
        const batch = pending.slice(i, i + batchSz);
        await Promise.all(batch.map(r => verifySymbol(r)));
        const done  = rows.filter(r => r.status !== 'pend').length;
        const rem   = rows.length - done;
        const rate  = done / ((Date.now() - t0) / 1000);
        const eta   = rate > 0 ? Math.round(rem / rate) : '?';
        document.getElementById('sEta').textContent = eta + 's';
        document.getElementById('statusMsg').textContent = `Batch ${Math.ceil((i+batchSz)/batchSz)} / ${Math.ceil(pending.length/batchSz)}`;
        if (running && i + batchSz < pending.length) await new Promise(r => setTimeout(r, delay));
    }

    running = false;
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled  = true;
    const ok  = rows.filter(r => r.status === 'ok').length;
    const na  = rows.filter(r => r.status === 'na').length;
    document.getElementById('statusMsg').textContent = `DONE — ${ok} HAS NAV / ${na} NO DATA`;
    document.getElementById('sEta').textContent = '—';
}

function stopVerify() {
    running = false;
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled  = true;
    document.getElementById('statusMsg').textContent = 'STOPPED';
}

function resetVerify() {
    running = false;
    rows.forEach(r => { r.status = 'pend'; r.price = ''; r.name = ''; r.cur = ''; });
    rows.forEach(r => updateRow(r));
    updateStats();
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled  = true;
    document.getElementById('statusMsg').textContent = 'RESET — READY';
    document.getElementById('sEta').textContent = '—';
    document.getElementById('progressFill').style.width = '0%';
}

function exportCSV() {
    const lines = ['Symbol,Name,PrevClose,Currency,Status'];
    rows.forEach(r => {
        lines.push(`"${r.sym}","${(r.name||'').replace(/"/g,'""')}","${r.price||''}","${r.cur||''}","${r.status}"`);
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type:'text/csv' }));
    a.download = 'DWS_FUND_VERIFY_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
}

/* Boot */
initTable();
