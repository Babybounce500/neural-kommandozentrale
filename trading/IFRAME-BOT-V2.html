<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURAL IFRAME-BOT v2 // Tool-Calling Finance Agent</title>
<style>
:root{
  --bg:#05070a; --panel:#0c1118; --border:rgba(0,212,255,.22); --accent:#00d4ff;
  --green:#00ff88; --red:#ff3b5c; --gold:#ffd23f; --muted:#7c8a94; --text:#e8f2f6;
  --mono:'JetBrains Mono','Courier New',monospace; --head:'Orbitron',sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.h-title{font-family:var(--head);font-size:13px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 10px rgba(0,212,255,.5)}
.h-sub{font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.toolsel{background:#0a0e14;border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:4px;}
.layout{display:grid;grid-template-columns:1fr 420px;height:calc(100vh - 54px)}
.iframe-pane{position:relative;background:#000;border-right:1px solid var(--border);}
.iframe-pane iframe{width:100%;height:100%;border:none;background:#fff;}
.pane-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);border:1px solid var(--border);color:var(--accent);font-size:9px;padding:4px 8px;border-radius:4px;z-index:5;}
.chat-pane{display:flex;flex-direction:column;background:var(--panel);}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg{font-size:11.5px;line-height:1.6;padding:8px 10px;border-radius:6px;max-width:100%;white-space:pre-wrap;word-break:break-word;}
.msg.user{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);align-self:flex-end;}
.msg.assistant{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
.msg.tool-chip{background:rgba(255,210,63,.08);border:1px solid rgba(255,210,63,.3);color:var(--gold);font-size:10px;}
.msg.sys{color:var(--muted);font-size:10px;border:none;background:none;padding:2px 4px;}
.msg.err{color:var(--red);}
.chat-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);}
.chat-input-row input{flex:1;background:#0a0e14;border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:9px 10px;border-radius:4px;}
.btn{font-family:var(--head);font-size:9px;letter-spacing:1px;padding:9px 14px;border-radius:4px;border:none;cursor:pointer;background:var(--accent);color:#000;font-weight:700;white-space:nowrap;}
.btn:disabled{background:#1a3a42;color:#3a6a75;cursor:not-allowed;}
.btn-sec{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border);}
.quick-row{display:flex;gap:6px;padding:0 10px 8px;flex-wrap:wrap;}
.quick-btn{font-size:9px;background:rgba(0,212,255,.08);border:1px solid var(--border);color:var(--accent);padding:4px 8px;border-radius:3px;cursor:pointer;}
.quick-btn:hover{background:rgba(0,212,255,.18);}
@media(max-width:900px){.layout{grid-template-columns:1fr;grid-template-rows:55vh 1fr;}.iframe-pane{border-right:none;border-bottom:1px solid var(--border);}}
</style>
</head>
<body>
<header>
  <div>
    <div class="h-title">⬡ NEURAL IFRAME-BOT v2</div>
    <div class="h-sub">TOOL-CALLING AGENT · SAME-ORIGIN DOM CONTROL · NO CLIENT-SIDE KEYS</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <select class="toolsel" id="toolSelect" onchange="switchTool(this.value)"></select>
    <select class="toolsel" id="modelSelect">
      <option value="gpt-4o-mini">GPT-4o-mini</option>
      <option value="claude">Claude (proxy)</option>
    </select>
  </div>
</header>

<div class="layout">
  <div class="iframe-pane">
    <div class="pane-badge" id="frameBadge">lädt…</div>
    <iframe id="targetFrame" src=""></iframe>
  </div>
  <div class="chat-pane">
    <div class="chat-log" id="chatLog"></div>
    <div class="quick-row">
      <button class="quick-btn" onclick="sendQuick('Analysiere die aktuelle Ansicht und fasse die 3 wichtigsten Punkte zusammen.')">🔍 Analysieren</button>
      <button class="quick-btn" onclick="sendQuick('Exportiere die aktuelle Analyse als Report.')">📥 Export</button>
      <button class="quick-btn" onclick="sendQuick('Was zeigt dieses Tool gerade für die Standard-Auswahl an?')">❓ Was zeigt das?</button>
    </div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="z.B. 'wähle DAX 40 und starte den Scan'" onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="btn" id="sendBtn" onclick="sendMessage()">SENDEN</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   APP MATRIX — same-origin finance tools this bot can navigate/control
   ════════════════════════════════════════════════════════════════════ */
const APP_MATRIX = {
  trendrider:   'TREND-RIDER.html',
  trendchart:   'TREND-RIDER-CHART.html',
  quantumvol:   'QUANTUM-VOLUME-FINAL.html',
  fundsmix:     'FUNDS-MIX (1).html',
  bonds:        'BONDS-BLOOMBERG.html',
  xtrackers:    'XTRACKERS-FINAL-UPDATED.html',
  hedging:      'HEDGING-FINAL (2).html',
  dudebank:     'DUDE-BANK-INDEX.html'
};
const TOOL_LABELS = {
  trendrider: '📈 Trend-Rider (EMA-Ribbon-Scanner)', trendchart: '📊 Trend-Rider Chart',
  quantumvol: '📦 Quantum-Volume (OBV/ATR)', fundsmix: '🏦 Funds-Mix (Neural Funds Global)',
  bonds: '💵 Bonds-Bloomberg (YTM/Duration)', xtrackers: '📑 Xtrackers ETF-Terminal',
  hedging: '🛡️ Hedging-Engine (IB-Bracket-Codegen)', dudebank: '📚 Dude-Bank-Index'
};

const PROXY_URL = 'https://theserver-open-ai.replit.app/api/chat'; // secure proxy, no client-side key — ever

const iframe      = document.getElementById('targetFrame');
const chatLog      = document.getElementById('chatLog');
const chatInput     = document.getElementById('chatInput');
const sendBtn       = document.getElementById('sendBtn');
const frameBadge    = document.getElementById('frameBadge');
let currentToolKey  = 'trendrider';
let messages        = [];
let lastExtract     = null; // last extract_data result, for export_report to reuse

/* ════════════════════════════════════════════════════════════════════
   UI bootstrap
   ════════════════════════════════════════════════════════════════════ */
(function initToolSelect() {
  const sel = document.getElementById('toolSelect');
  sel.innerHTML = Object.keys(APP_MATRIX).map(k => `<option value="${k}">${TOOL_LABELS[k]}</option>`).join('');
  sel.value = currentToolKey;
})();

function switchTool(key) {
  if (!APP_MATRIX[key]) return;
  currentToolKey = key;
  frameBadge.textContent = 'lädt: ' + TOOL_LABELS[key];
  iframe.src = APP_MATRIX[key];
  document.getElementById('toolSelect').value = key;
}
iframe.addEventListener('load', () => { frameBadge.textContent = TOOL_LABELS[currentToolKey] || currentToolKey; });
switchTool(currentToolKey);

function logMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}
function logToolChip(name, args) {
  logMsg('tool-chip', '🔧 ' + name + '(' + JSON.stringify(args) + ')');
}

/* ════════════════════════════════════════════════════════════════════
   DOM-CONTROL ENGINE — kept verbatim from IFRAME-BOT.html (proven, same-origin only)
   ════════════════════════════════════════════════════════════════════ */
function iframeDoc() {
  try {
    const doc = iframe.contentDocument || iframe.contentWindow?.document;
    return doc?.querySelector ? doc : null;
  } catch (e) { return null; }
}

function getFieldLabel(el, doc) {
  const trim = s => (s || '').replace(/\s+/g, ' ').trim().substring(0, 60);
  if (el.id) { const lbl = doc.querySelector(`label[for="${CSS.escape(el.id)}"]`); if (lbl) return trim(lbl.textContent); }
  const al = el.getAttribute('aria-label'); if (al) return trim(al);
  const alby = el.getAttribute('aria-labelledby');
  if (alby) { const lblEl = doc.getElementById(alby); if (lblEl) return trim(lblEl.textContent); }
  const parentLabel = el.closest('label'); if (parentLabel) return trim(parentLabel.textContent);
  let prev = el.previousElementSibling;
  while (prev) {
    const t = trim(prev.textContent);
    if (t && !['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(prev.tagName)) return t;
    prev = prev.previousElementSibling;
  }
  const parentText = trim(el.parentElement?.textContent?.replace(el.textContent, ''));
  if (parentText) return parentText.substring(0, 40);
  return trim(el.placeholder || el.name || el.id || '');
}

function getVisibleFields(doc) {
  const QUERY = 'input:not([type="hidden"]):not([type="submit"]):not([type="button"]):not([type="image"]),textarea, select, [contenteditable="true"], [contenteditable=""]';
  const seen = new Set(); const items = [];
  doc.querySelectorAll(QUERY).forEach(el => {
    if (seen.has(el)) return; seen.add(el);
    const r = el.getBoundingClientRect();
    const ce = el.getAttribute('contenteditable') != null;
    if (ce ? r.width <= 10 : (r.width <= 0 || r.height <= 0)) return;
    const elType = el.type?.toLowerCase() || el.tagName.toLowerCase();
    const ph = (el.placeholder || '').toLowerCase(), id = (el.id || '').toLowerCase(), nm = (el.name || '').toLowerCase();
    const label = getFieldLabel(el, doc); const lbl = label.toLowerCase();
    const big = r.height > 80 || ce;
    let kind;
    if (elType === 'select-one' || elType === 'select-multiple' || el.tagName === 'SELECT') kind = 'select';
    else if (elType === 'checkbox') kind = 'checkbox';
    else if (elType === 'radio') kind = 'radio';
    else if (['date', 'datetime-local', 'time', 'month'].includes(elType)) kind = 'date';
    else if (elType === 'number' || elType === 'range') kind = 'number';
    else if (elType === 'file') kind = 'file';
    else if (elType === 'color') kind = 'color';
    else if (big) kind = 'editor';
    else kind = 'input';
    if (['input', 'editor'].includes(kind)) {
      const sig = ph + id + nm + lbl;
      if (/ask|ai|prompt|gpt|claude|chat/i.test(sig)) kind = 'ai-input';
      if (/search|query|suche|find/i.test(sig)) kind = 'search';
      if (/email|mail/i.test(sig)) kind = 'email';
    }
    const options = el.tagName === 'SELECT' ? Array.from(el.options).map(o => o.text.trim()).filter(Boolean).slice(0, 10) : null;
    const currentVal = el.type === 'checkbox' ? (el.checked ? 'checked' : 'unchecked')
      : el.type === 'radio' ? (el.checked ? 'selected' : 'unselected')
      : (el.value || el.textContent || '').trim().substring(0, 40);
    items.push({ el, top: r.top, left: r.left, kind, ph, id: el.id, nm, tag: el.tagName, label, options, currentVal, required: el.required });
  });
  items.sort((a, b) => (Math.round(a.top / 10) - Math.round(b.top / 10)) || (a.left - b.left));
  return items.map((item, i) => ({ ...item, index: i + 1 }));
}

function writeToField(el, rawText) {
  const text = rawText.replace(/\\n/g, '\n');
  const elDoc = el.ownerDocument;
  const elType = el.type?.toLowerCase();
  if (el.tagName === 'SELECT') { selectOption(el, text); return; }
  if (elType === 'checkbox') { const want = /true|yes|ja|1/i.test(text); if (el.checked !== want) el.click(); return; }
  if (elType === 'radio') { el.checked = true; el.dispatchEvent(new Event('change', { bubbles: true })); return; }
  if (['date', 'datetime-local', 'time', 'month'].includes(elType)) {
    el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); return;
  }
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
    try {
      const win = elDoc.defaultView;
      const proto = el.tagName === 'INPUT' ? win.HTMLInputElement.prototype : win.HTMLTextAreaElement.prototype;
      const setter = Object.getOwnPropertyDescriptor(proto, 'value')?.set;
      if (setter) setter.call(el, text); else el.value = text;
    } catch { el.value = text; }
  } else {
    el.focus(); el.innerHTML = '';
    text.split('\n').forEach((line, i) => { if (i > 0) el.appendChild(elDoc.createElement('br')); if (line) el.appendChild(elDoc.createTextNode(line)); });
  }
  ['keydown', 'keyup', 'input', 'change'].forEach(ev => el.dispatchEvent(new Event(ev, { bubbles: true, cancelable: true })));
  el.focus();
}

function selectOption(el, query) {
  const q = query.toLowerCase();
  let opt = Array.from(el.options).find(o => o.text.toLowerCase() === q)
    || Array.from(el.options).find(o => o.value.toLowerCase() === q)
    || Array.from(el.options).find(o => o.text.toLowerCase().includes(q));
  if (!opt && /^\d+$/.test(query)) opt = el.options[parseInt(query) - 1];
  if (!opt) return false;
  el.value = opt.value;
  ['input', 'change'].forEach(ev => el.dispatchEvent(new Event(ev, { bubbles: true })));
  return true;
}

function resolveField(fields, ref) {
  if (!ref || ref === '') return fields[0] || null;
  if (/^\d+$/.test(ref)) return fields[parseInt(ref, 10) - 1] || null;
  const q = ref.toLowerCase();
  return fields.find(f => f.label.toLowerCase() === q)
    || fields.find(f => f.kind === q)
    || fields.find(f => f.label.toLowerCase().includes(q))
    || fields.find(f => f.ph.includes(q) || f.id.toLowerCase().includes(q) || f.nm.includes(q))
    || null;
}

function getButtonLabel(el) {
  const txt = el.textContent.trim();
  if (txt) return txt.substring(0, 50);
  return (el.getAttribute('aria-label') || el.getAttribute('title') || el.value || el.name || el.id || el.tagName).substring(0, 50);
}

/* ════════════════════════════════════════════════════════════════════
   TOOL FUNCTIONS — each returns a plain JSON-serializable result object,
   fed back to the model as {role:'tool', tool_call_id, content}, exactly
   like genitus-midpoint-terminal/ai-agent.html's TOOL_FNS pattern.
   ════════════════════════════════════════════════════════════════════ */
const TOOL_FNS = {
  write_field(args) {
    const doc = iframeDoc(); if (!doc) return { ok: false, error: 'iframe inaccessible' };
    const fields = getVisibleFields(doc);
    const target = resolveField(fields, args.field || '');
    if (!target) return { ok: false, error: 'field not found', available: fields.map(f => f.label || f.kind) };
    writeToField(target.el, String(args.text ?? ''));
    return { ok: true, field: target.label || target.kind, index: target.index };
  },
  click_element(args) {
    const doc = iframeDoc(); if (!doc) return { ok: false, error: 'iframe inaccessible' };
    const isVis = el => { try { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; } catch { return false; } };
    const q = (args.target || '').toLowerCase();
    let el = null;
    if (q.startsWith('#') || q.startsWith('.')) { try { const f = doc.querySelector(args.target); if (f && isVis(f)) el = f; } catch {} }
    if (!el) {
      const candidates = Array.from(doc.querySelectorAll('button, a[href], [role="button"], input[type="submit"], input[type="button"]')).filter(isVis);
      el = candidates.find(e => getButtonLabel(e).toLowerCase() === q)
        || candidates.find(e => getButtonLabel(e).toLowerCase().includes(q));
    }
    if (!el) return { ok: false, error: 'element not found', visibleButtons: Array.from(doc.querySelectorAll('button,[role="button"]')).filter(isVis).map(getButtonLabel) };
    el.click();
    return { ok: true, clicked: getButtonLabel(el) };
  },
  select_option(args) {
    const doc = iframeDoc(); if (!doc) return { ok: false, error: 'iframe inaccessible' };
    const fields = getVisibleFields(doc).filter(f => f.kind === 'select');
    const field = resolveField(fields, args.field || '') || fields[0];
    if (!field) return { ok: false, error: 'no dropdown found' };
    const success = selectOption(field.el, args.option || '');
    return success ? { ok: true, field: field.label, selected: args.option } : { ok: false, error: 'option not found', options: field.options };
  },
  fill_form(args) {
    const doc = iframeDoc(); if (!doc) return { ok: false, error: 'iframe inaccessible' };
    const fields = getVisibleFields(doc);
    const used = new Set(); const results = [];
    for (const [key, value] of Object.entries(args.fields || {})) {
      const field = resolveField(fields.filter(f => !used.has(f)), key);
      if (!field) { results.push({ key, ok: false }); continue; }
      used.add(field); writeToField(field.el, String(value));
      results.push({ key, ok: true, matchedLabel: field.label });
    }
    return { ok: true, results };
  },
  scroll_iframe(args) {
    const dir = (args.direction || 'down').toLowerCase();
    const amount = Number(args.amount) || 300;
    try { iframe.contentWindow.scrollBy({ top: (dir === 'up' ? -1 : 1) * amount, behavior: 'smooth' }); return { ok: true, direction: dir, amount }; }
    catch (e) { return { ok: false, error: e.message }; }
  },
  navigate_to_tool(args) {
    const key = (args.tool || '').toLowerCase();
    if (!APP_MATRIX[key]) return { ok: false, error: 'unknown tool', available: Object.keys(APP_MATRIX) };
    switchTool(key);
    return { ok: true, navigatedTo: TOOL_LABELS[key], note: 'page is loading -- wait a moment before the next action' };
  },
  extract_data() {
    const doc = iframeDoc(); if (!doc) return { ok: false, error: 'iframe inaccessible' };
    const fields = getVisibleFields(doc).map(f => ({ index: f.index, kind: f.kind, label: f.label, value: f.currentVal, options: f.options }));
    const isVis = el => { try { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; } catch { return false; } };
    const buttons = Array.from(doc.querySelectorAll('button,[role="button"]')).filter(isVis).map(getButtonLabel).slice(0, 20);
    const headings = Array.from(doc.querySelectorAll('h1,h2,h3')).map(h => h.textContent.trim()).filter(Boolean).slice(0, 8);
    // table extraction -- most of these finance tools render results as <table>
    const tables = Array.from(doc.querySelectorAll('table')).slice(0, 3).map(t => {
      const rows = Array.from(t.querySelectorAll('tr')).slice(0, 40).map(tr => Array.from(tr.children).map(td => td.textContent.trim()));
      return rows;
    });
    const result = { ok: true, url: iframe.src, title: doc.title, headings, fields, buttons, tables };
    lastExtract = result;
    return result;
  },
  export_report(args) {
    const data = lastExtract || TOOL_FNS.extract_data();
    const format = (args.format || 'html').toLowerCase();
    const chatSummary = args.summary || '(keine Zusammenfassung übergeben)';
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    if (format === 'csv') {
      const rows = (data.tables?.[0] || []).map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
      downloadBlob(rows || 'keine Tabellendaten gefunden', 'report-' + stamp + '.csv', 'text/csv');
      return { ok: true, format: 'csv', filename: 'report-' + stamp + '.csv' };
    }
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>IFRAME-BOT Report</title>
      <style>body{font-family:monospace;background:#0b0e14;color:#e8f2f6;padding:24px;}h1{color:#00d4ff;}table{border-collapse:collapse;width:100%;margin-top:12px;}td,th{border:1px solid #334;padding:6px 10px;font-size:12px;}pre{white-space:pre-wrap;background:#141b24;padding:12px;border-radius:6px;}</style>
      </head><body><h1>IFRAME-BOT v2 Report</h1><p>Quelle: ${escapeHtml(data.url || '')} · ${escapeHtml(data.title || '')}</p>
      <h2>Analyse</h2><pre>${escapeHtml(chatSummary)}</pre>
      ${(data.tables || []).map(rows => '<table>' + rows.map(r => '<tr>' + r.map(c => '<td>' + escapeHtml(c) + '</td>').join('') + '</tr>').join('') + '</table>').join('')}
      </body></html>`;
    downloadBlob(html, 'report-' + stamp + '.html', 'text/html');
    return { ok: true, format: 'html', filename: 'report-' + stamp + '.html' };
  }
};

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c])); }
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ════════════════════════════════════════════════════════════════════
   TOOL SCHEMAS — OpenAI tools/tool_choice contract
   ════════════════════════════════════════════════════════════════════ */
const TOOLS = [
  { type: 'function', function: { name: 'write_field', description: 'Schreibt Text in ein Formularfeld der aktuellen Tool-Seite (per Label, Index oder Art erkannt).', parameters: { type: 'object', properties: { field: { type: 'string', description: 'Label, Index oder Art des Feldes (z.B. "Symbol" oder "1")' }, text: { type: 'string' } }, required: ['field', 'text'] } } },
  { type: 'function', function: { name: 'click_element', description: 'Klickt einen Button oder Link auf der aktuellen Tool-Seite anhand seines sichtbaren Textes.', parameters: { type: 'object', properties: { target: { type: 'string', description: 'sichtbarer Text des Buttons, z.B. "SCAN STARTEN"' } }, required: ['target'] } } },
  { type: 'function', function: { name: 'select_option', description: 'Wählt eine Option in einem Dropdown-Feld.', parameters: { type: 'object', properties: { field: { type: 'string' }, option: { type: 'string' } }, required: ['field', 'option'] } } },
  { type: 'function', function: { name: 'fill_form', description: 'Füllt mehrere Formularfelder gleichzeitig aus einem Objekt {Feldname: Wert}.', parameters: { type: 'object', properties: { fields: { type: 'object', description: 'Map von Feld-Label zu Wert' } }, required: ['fields'] } } },
  { type: 'function', function: { name: 'scroll_iframe', description: 'Scrollt die aktuelle Tool-Seite.', parameters: { type: 'object', properties: { direction: { type: 'string', enum: ['up', 'down'] }, amount: { type: 'number' } } } } },
  { type: 'function', function: { name: 'navigate_to_tool', description: 'Wechselt zu einem anderen der 8 verfügbaren Finance-Tools.', parameters: { type: 'object', properties: { tool: { type: 'string', enum: Object.keys(APP_MATRIX) } }, required: ['tool'] } } },
  { type: 'function', function: { name: 'extract_data', description: 'Liest den aktuellen Zustand der Tool-Seite aus (Formularfelder, Buttons, Tabellen-Zeilen) als strukturierte Daten.', parameters: { type: 'object', properties: {} } } },
  { type: 'function', function: { name: 'export_report', description: 'Exportiert die aktuell extrahierten Daten + eine Zusammenfassung als Datei (HTML oder CSV).', parameters: { type: 'object', properties: { format: { type: 'string', enum: ['html', 'csv'] }, summary: { type: 'string', description: 'Kurze Analyse-Zusammenfassung, die im Report erscheinen soll' } }, required: ['summary'] } } }
];

const SYSTEM_PROMPT = `Du bist der NEURAL IFRAME-BOT -- ein KI-Agent, der die eingebettete Finance-Tool-Seite über echte Funktionsaufrufe steuert (write_field, click_element, select_option, fill_form, scroll_iframe, navigate_to_tool, extract_data, export_report). Rufe IMMER extract_data auf, bevor du eine Behauptung über den aktuellen Zustand der Seite machst -- rate nichts. Für Aktionen (klicken, ausfüllen) führe sie direkt per Tool-Call aus, erkläre danach kurz was passiert ist. Antworte auf Deutsch, knapp und konkret.`;

/* ════════════════════════════════════════════════════════════════════
   CHAT / AGENT LOOP — secure proxy, no client-side API key, structured
   tool-calling, 5-round cap. Pattern copied from ai-agent.html.
   ════════════════════════════════════════════════════════════════════ */
async function callProxy(msgsForApi, model) {
  const res = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model, stream: false, messages: msgsForApi, tools: TOOLS, tool_choice: 'auto' }),
    signal: AbortSignal.timeout(45000)
  });
  if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
  return res.json();
}

async function runAgent(userText) {
  if (!messages.length) messages.push({ role: 'system', content: SYSTEM_PROMPT });
  messages.push({ role: 'user', content: userText });
  const model = document.getElementById('modelSelect').value;

  for (let round = 0; round < 5; round++) {
    let data;
    try { data = await callProxy(messages, model); }
    catch (e) { logMsg('err', '✗ Proxy-Fehler: ' + e.message); return; }

    const msg = data.choices?.[0]?.message;
    if (!msg) { logMsg('err', '✗ Unerwartete Antwort vom Proxy.'); return; }
    messages.push(msg);

    if (msg.tool_calls && msg.tool_calls.length) {
      for (const tc of msg.tool_calls) {
        let args = {};
        try { args = JSON.parse(tc.function.arguments || '{}'); } catch (e) {}
        logToolChip(tc.function.name, args);
        const fn = TOOL_FNS[tc.function.name];
        let result;
        try { result = fn ? await fn(args) : { ok: false, error: 'unknown tool: ' + tc.function.name }; }
        catch (e) { result = { ok: false, error: e.message }; }
        messages.push({ role: 'tool', tool_call_id: tc.id, content: JSON.stringify(result) });
      }
      continue; // let the model see tool results and respond or call more tools
    }
    logMsg('assistant', msg.content || '(keine Textantwort)');
    return;
  }
  logMsg('sys', '⚠ Zu viele Tool-Runden -- abgebrochen.');
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  logMsg('user', text);
  sendBtn.disabled = true;
  await runAgent(text);
  sendBtn.disabled = false;
}
function sendQuick(text) { chatInput.value = text; sendMessage(); }

logMsg('sys', 'Bereit. Aktuelles Tool: ' + TOOL_LABELS[currentToolKey] + '. Alle Aktionen laufen über echte Tool-Calls (sichtbar als 🔧-Chips), kein API-Key im Browser.');
</script>
