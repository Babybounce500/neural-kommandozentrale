<script>
(function(){
  window.ST_BASE = 'https://glow-up-gemini.replit.app';
  async function st_getJSON(p, params) {
    const qs = params ? '?' + new URLSearchParams(params).toString() : '';
    const res = await fetch(ST_BASE + p + qs);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  window.ST_API = { eod: { historical: (s,p) => st_getJSON('/eod/historical/'+s, p) } };
  window.st_isoDaysAgo = function(n) { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };

  window.st_normCDF = function(x) {
    const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
    const sign=x<0?-1:1; const z=Math.abs(x)/Math.sqrt(2); const t=1/(1+p*z);
    const erf=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-z*z);
    return 0.5*(1+sign*erf);
  };
  window.st_estimateSigmaMu = function(prices) {
    const lr=[]; for(let i=1;i<prices.length;i++) if(prices[i]>0&&prices[i-1]>0) lr.push(Math.log(prices[i]/prices[i-1]));
    if (lr.length<20) return null;
    const mean=lr.reduce((a,b)=>a+b,0)/lr.length;
    const variance=lr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(lr.length-1);
    const sigma=Math.sqrt(variance*252); const mu=mean*252+0.5*sigma*sigma;
    return { sigma, mu };
  };
  window.st_probHitTarget = function(S,K,mu,sigma,T) {
    if (S===K) return 1.0; if (sigma<=0||T<=0) return 0.0;
    const v=mu-0.5*sigma*sigma, b=Math.abs(Math.log(K/S)), sst=sigma*Math.sqrt(T);
    const d1=(-b+v*T)/sst, d2=(-b-v*T)/sst;
    return Math.min(Math.max(st_normCDF(d1)+Math.exp((2*v*b)/(sigma*sigma))*st_normCDF(d2),0),1);
  };
  window.st_volBucketOf = function(p){ return p<0.40?'far_lowP':p<0.70?'mid_P':'near_highP'; };
  window.ST_VOL_LABEL = { far_lowP:'🔴 Ruhiges Regime', mid_P:'🟡 Mittleres Regime', near_highP:'🟢 Volatiles Regime' };
  window.ST_STOP_PCT = 4; window.ST_HOLD_DAYS = 10; window.ST_T_YEARS = 10/252;

  window.st_getVolRegime = async function(symbol, price, direction) {
    try {
      const hist = await ST_API.eod.historical(symbol, { from: st_isoDaysAgo(400) });
      const closes = (Array.isArray(hist)?hist:[]).map(h=>h.close).filter(c=>c>0);
      if (closes.length < 20) return null;
      const params = st_estimateSigmaMu(closes);
      if (!params) return null;
      const stopLevel = direction==='LONG' ? price*(1-ST_STOP_PCT/100) : price*(1+ST_STOP_PCT/100);
      const pTouchStop = st_probHitTarget(price, stopLevel, params.mu, params.sigma, ST_T_YEARS);
      return { pTouchStop, sigma: params.sigma, bucket: st_volBucketOf(pTouchStop) };
    } catch(e) { console.error('st_getVolRegime failed', e); return null; }
  };
})();
</script>

<script>
const ST_BACKTEST = { n: 2524, avgRet: 0.1334, winRate: 32.53, sharpeLike: 0.301, bestBucket: 'near_highP', status: 'warning', buckets: { far_lowP: null, mid_P: null, near_highP: 0.1334 }, winBuckets: { far_lowP: null, mid_P: null, near_highP: 8.2684 }, winRateBuckets: { far_lowP: 46.95, mid_P: 43.11, near_highP: 32.53 } };
document.getElementById('st_intro').innerHTML = "<b style=\"color:#b91c1c;\">Audit-Ergebnis: Peak-Valley ist NICHT robust</b> -- selbst der beste Bucket (near_highP) fällt von Sharpe 0.476 (ältere Hälfte) auf 0.156 (neuere Hälfte). Reale Zahlen unten, aber als Warnung markiert, nicht als Edge verkauft.";

// Echtes Limit statt Erwartungswert: Target = Entry +/- Oe-Groesse der tatsaechlichen GEWINNER-Trades
// in diesem Bucket (winBuckets), nicht der ueber alle Trades gemittelte avgRet (der war 0.02-0.58%
// und erzeugte gegen den festen 4%-Stop ein absurdes Chance/Risiko -- siehe Nutzer-Report). Wenn der
// Bucket keine Win-Daten hat (nicht validiert fuer dieses Regime), wird "kein Trade" statt eines
// erfundenen Zielkurses angezeigt.
function st_smartStopTarget(price, direction, bucket) {
  const sign = direction==='LONG'?1:-1;
  const bucketAvgRet = ST_BACKTEST.buckets[bucket] != null ? ST_BACKTEST.buckets[bucket] : null;
  const noEdge = !ST_BACKTEST.winBuckets || bucketAvgRet == null || bucketAvgRet < 0 || ST_BACKTEST.winBuckets[bucket] == null;
  const winPct = (ST_BACKTEST.winBuckets && ST_BACKTEST.winBuckets[bucket] != null) ? ST_BACKTEST.winBuckets[bucket] : ST_STOP_PCT;
  const hitRate = (ST_BACKTEST.winRateBuckets && ST_BACKTEST.winRateBuckets[bucket] != null) ? ST_BACKTEST.winRateBuckets[bucket] : ST_BACKTEST.winRate;
  const target = price*(1+sign*(winPct/100));
  const stop = price*(1-sign*(ST_STOP_PCT/100));
  return { target: target.toFixed(2), stop: stop.toFixed(2), winPct, hitRate, bucketAvgRet, noEdge };
}

function st_renderCard(sym, price, direction, vts, volRegime) {
  const container = document.getElementById('st_results');
  const card = document.createElement('div');
  card.style.cssText = 'background:#eaf1f6;border:1px solid #d6e2ea;border-radius:6px;padding:10px;margin-bottom:8px;';
  const statusBadge = ST_BACKTEST.status === 'validated'
    ? '<span style="color:#15803d;font-weight:700;">✅ validiert, robust</span>'
    : ST_BACKTEST.status === 'warning'
      ? '<span style="color:#b91c1c;font-weight:700;">⚠️ geprüft, NICHT robust (reale Zahlen, aber Edge schwächt stark ab)</span>'
      : '<span style="color:#b45309;font-weight:700;">ℹ️ informativ, kein eigener Backtest für dieses Signal</span>';
  const noEdgeBanner = vts.noEdge ? '<div style="background:#fde2e2;border:1px solid #f5a3a3;color:#991b1b;font-size:10.5px;font-weight:700;padding:5px 8px;border-radius:4px;text-align:center;margin-bottom:6px;">⛔ KEIN TRADE EMPFOHLEN -- ausserhalb des validierten Vola-Buckets</div>' : '';
  const targetLine = vts.noEdge
    ? '<div>Entry: <b>' + price.toFixed(2) + '</b> &nbsp; Smart Target: <b style="color:#9aa5a9;">(unplausibel)</b> &nbsp; Smart Stop (-4%): <b style="color:#b45309;">' + vts.stop + '</b></div>'
    : '<div>Entry: <b>' + price.toFixed(2) + '</b> &nbsp; Smart Target (Limit): <b style="color:#0e7490;">' + vts.target + '</b> &nbsp; Smart Stop (-4%, hart): <b style="color:#b45309;">' + vts.stop + '</b></div>' +
      '<div style="font-size:10px;color:#9aa5a9;margin-top:2px;">🎯 Echtes Limit: Ø-Größe der tatsächlichen Gewinner-Trades in diesem Bucket (±' + vts.winPct.toFixed(2) + '%), trifft ca. in ' + vts.hitRate + '% der Fälle. R:R ≈ ' + (vts.winPct/ST_STOP_PCT).toFixed(1) + ':1 gegen den festen ' + ST_STOP_PCT + '%-Stop.</div>';
  card.innerHTML = noEdgeBanner + '<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><b>' + sym + '</b><span style="font-weight:700;color:' + (direction==='LONG'?'#15803d':'#b91c1c') + ';">' + direction + '</span></div>' +
    targetLine +
    (volRegime ? '<div style="margin-top:4px;font-size:10.5px;color:#5f7277;">P(Touch Stop in 10d) = ' + (volRegime.pTouchStop*100).toFixed(0) + '% (σ=' + (volRegime.sigma*100).toFixed(1) + '%) · ' + ST_VOL_LABEL[volRegime.bucket] + '</div>' : '') +
    '<div style="margin-top:4px;font-size:10px;color:#9aa5a9;">' + statusBadge + ' -- n=' + ST_BACKTEST.n.toLocaleString('de-DE') + ', Ø' + ST_BACKTEST.avgRet + '%, Sharpe ' + ST_BACKTEST.sharpeLike + ' (Bucket: ' + ST_BACKTEST.bestBucket + ')</div>';
  container.appendChild(card);
}

async function st_detectSignal(symbol) {

  const data = await ST_API.eod.historical(symbol, { from: st_isoDaysAgo(10) });
  data.sort((a,b)=>new Date(a.date)-new Date(b.date));
  if (data.length < 3) throw new Error('Zu wenige Daten');
  const n = data.length;
  const c0 = data[n-1].close, c1 = data[n-2].close, c2 = data[n-3].close;
  const isValley = c1 === Math.min(c0,c1,c2) && c1 !== c0 && c1 !== c2;
  const isPeak = c1 === Math.max(c0,c1,c2) && c1 !== c0 && c1 !== c2;
  if (!isValley && !isPeak) throw new Error('Kein Peak/Valley-Signal');
  return { price: c0, direction: isValley ? 'LONG' : 'SHORT' };
  
}

async function st_runScan() {
  const symbols = document.getElementById('st_symbolInput').value.split(',').map(s=>s.trim()).filter(Boolean);
  document.getElementById('st_scanBtn').disabled = true;
  document.getElementById('st_results').innerHTML = '';
  const status = document.getElementById('st_status');
  for (const sym of symbols) {
    status.textContent = 'Scanne ' + sym + '...';
    try {
      const { price, direction } = await st_detectSignal(sym);
      const volRegime = await st_getVolRegime(sym, price, direction);
      const vts = st_smartStopTarget(price, direction, volRegime ? volRegime.bucket : ST_BACKTEST.bestBucket);
      st_renderCard(sym, price, direction, vts, volRegime);
    } catch (e) {
      const container = document.getElementById('st_results');
      const card = document.createElement('div');
      card.style.cssText = 'background:#f4f7fb;border-radius:4px;padding:6px 10px;margin-bottom:4px;font-size:10.5px;color:#9aa5a9;';
      card.textContent = sym + ': ' + e.message;
      container.appendChild(card);
    }
  }
  status.textContent = 'Fertig: ' + symbols.length + ' Symbole geprüft.';
  document.getElementById('st_scanBtn').disabled = false;
}
document.getElementById('st_symbolInput').value = 'SAP.XETRA, SIE.XETRA, BMW.XETRA, IFX.XETRA';
</script>

    function init() {
      const select = document.getElementById('categorySelect');
      marketUniverse.categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id; opt.textContent = cat.label;
        select.appendChild(opt);
      });
    }
    document.addEventListener('DOMContentLoaded', init);

    async function startBulkScan() {
      if (isScanning) return;
      const category = document.getElementById('categorySelect').value;
      const delay = parseInt(document.getElementById('delayInput').value) || 2500;
      
      isScanning = true;
      validatedSignals = [];
      
      document.getElementById('longGrid').innerHTML = '';
      document.getElementById('shortGrid').innerHTML = '';
      document.getElementById('progressSection').classList.add('active');

      const targetCategory = marketUniverse.categories.find(c => c.id === category);
      const targetSymbols = targetCategory.symbols;
      
      for (let i = 0; i < targetSymbols.length; i++) {
        const symbol = targetSymbols[i];
        const percent = Math.round((i / targetSymbols.length) * 100);
        
        document.getElementById('progressText').textContent = `SCANNING STRUCTURAL DATA // ${symbol}...`;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('progressFill').textContent = percent + '%';
        document.getElementById('statusMsg').textContent = `${i} / ${targetSymbols.length}`;
        
        await fetchAndAnalyzeStructure(symbol);
        await new Promise(r => setTimeout(r, delay));
      }

      document.getElementById('progressSection').classList.remove('active');
      isScanning = false;
      renderSignals();
    }

    async function fetchAndAnalyzeStructure(symbol) {
      try {
        const res = await fetch(`${API_URL}?symbol=${symbol}&endpoint=historical&period=d`);
        if (!res.ok) return;
        let data = await res.json();
        
        if (data && data.length >= 5) {
          data.sort((a, b) => new Date(b.date) - new Date(a.date));
          
          const t0 = data[0]; 
          const t1 = data[1]; 
          const t2 = data[2]; 

          const c0 = parseFloat(t0.close);
          const c1 = parseFloat(t1.close);
          const c2 = parseFloat(t2.close);

          let formationSignal = null;

          // Pure geometric 3-candle closing price query
          if (c1 === Math.min(c0, c1, c2) && c1 !== c0 && c1 !== c2) {
            formationSignal = "Valley LONG";
          } else if (c1 === Math.max(c0, c1, c2) && c1 !== c0 && c1 !== c2) {
            formationSignal = "Peak SHORT";
          }

          // Strict dynamic filter: Process ONLY if a closed formation exists
          if (formationSignal) {
            const rangePct = ((parseFloat(t0.high) - parseFloat(t0.low)) / parseFloat(t0.low)) * 100;
            const volChange = t1.volume ? ((parseFloat(t0.volume) - parseFloat(t1.volume)) / parseFloat(t1.volume)) * 100 : 0;
            const absoluteDelta = c0 - c1;

            // ====================================================
            // REAL PERFORMANCE VOLUME-CONFIDENCE ENGINE LOGIC v7.0
            // ====================================================
            let confidence = 50; // Neutral baseline
            
            // Reale Ausbruchsamplitude berechnen
            const amplitude = (Math.abs(c0 - c1) / c1) * 100;

            if (formationSignal === "Peak SHORT") {
              // Ein bearishes Top verlangt idealerweise ein anziehendes Volumen (Verkaufsdruck)
              if (volChange > 0) {
                confidence += 15 + Math.min(volChange * 0.4, 15);
                confidence += Math.min(amplitude * 8, 15);
              } else {
                // Volumen bricht weg bei Short-Ausbruch -> Illiquides Absacken (Strafabzug)
                confidence -= 10;
                confidence -= Math.abs(volChange) * 0.3;
              }
            } else if (formationSignal === "Valley LONG") {
              // Ein bullishes Bottom verlangt idealerweise anziehendes Volumen (Käuferinteresse)
              if (volChange > 0) {
                confidence += 15 + Math.min(volChange * 0.4, 15);
                confidence += Math.min(amplitude * 8, 15);
              } else {
                // Volumen fehlt beim Rebound -> Risiko einer Bullenfalle (Strafabzug)
                confidence -= 12;
                confidence -= Math.abs(volChange) * 0.25;
              }
            }

            // Sicherstellen, dass die Confidence mathematisch in den Grenzen [15% - 95%] operiert
            confidence = Math.min(Math.max(Math.round(confidence), 15), 95);

            validatedSignals.push({
              symbol,
              signal: formationSignal,
              date: t0.date,
              close: c0,
              yesterdayClose: c1,
              beforeYesterdayClose: c2,
              delta: absoluteDelta,
              range: rangePct,
              volTrend: volChange,
              confidence: confidence,
              decimals: c0 < 2 ? 4 : 2,
              candles: [
                { open: parseFloat(t2.open), high: parseFloat(t2.high), low: parseFloat(t2.low), close: c2 },
                { open: parseFloat(t1.open), high: parseFloat(t1.high), low: parseFloat(t1.low), close: c1 },
                { open: parseFloat(t0.open), high: parseFloat(t0.high), low: parseFloat(t0.low), close: c0 }
              ]
            });
          }
        }
      } catch (e) { console.error("Pipeline Sync Error for: " + symbol, e); }
    }

    function renderSignals() {
      const longGrid = document.getElementById('longGrid');
      const shortGrid = document.getElementById('shortGrid');

      if (validatedSignals.length === 0) {
        longGrid.innerHTML = '<div style="color: var(--txt-muted); text-align:center; padding: 20px;">Keine geschlossene Valley-Formation gefunden.</div>';
        shortGrid.innerHTML = '<div style="color: var(--txt-muted); text-align:center; padding: 20px;">Keine geschlossene Peak-Formation gefunden.</div>';
        return;
      }

      // Sort by confidence descending
      validatedSignals.sort((a, b) => b.confidence - a.confidence);

      validatedSignals.forEach(sig => {
        const isLong = sig.signal === "Valley LONG";
        const container = isLong ? longGrid : shortGrid;
        
        const card = document.createElement('div');
        card.className = `result-card ${isLong ? 'long' : 'short'}`;
        
        const formattedDate = new Date(sig.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });

        card.innerHTML = `
          <canvas class="result-candle-matrix" width="110" height="110"></canvas>
          <div class="result-info">
            <div class="result-header">
              <div>
                <span class="result-symbol">${sig.symbol}</span>
                <span class="result-timestamp">EOD: ${formattedDate}</span>
              </div>
              <span class="sig-badge ${isLong ? 'badge-long' : 'badge-short'}">${sig.signal.toUpperCase()}</span>
            </div>
            <div class="result-metrics">
              <div class="result-metric"><span class="result-label">Trigger Price:</span><span class="val-white">$${sig.close.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">Net Delta:</span><span class="${sig.delta >= 0 ? 'text-up' : 'text-down'}">${sig.delta >= 0 ? '+' : ''}${sig.delta.toFixed(sig.decimals)}</span></div>
              <div class="result-metric"><span class="result-label">Intraday Range:</span><span class="val-white">${sig.range.toFixed(2)}%</span></div>
              <div class="result-metric"><span class="result-label">Volume Trend:</span><span class="${sig.volTrend >= 0 ? 'text-up' : 'text-down'}">${sig.volTrend >= 0 ? '▲' : '▼'} ${Math.abs(sig.volTrend).toFixed(1)}%</span></div>
              <div class="result-metric" style="grid-column: span 2; border:none;">
                <span class="result-label" style="font-size:0.68rem;">3-Day Sequence:</span>
                <span style="color: var(--accent); font-size:0.68rem;">${sig.beforeYesterdayClose.toFixed(sig.decimals)} → ${sig.yesterdayClose.toFixed(sig.decimals)} → ${sig.close.toFixed(sig.decimals)}</span>
              </div>
              <div class="confidence-container">
                <div style="display:flex; justify-content:space-between; font-size:0.7rem;">
                  <span class="result-label">Reale Confidence:</span><span style="color:var(--gold); font-weight:bold;">${sig.confidence}%</span>
                </div>
                <div class="confidence-mini-bar"><div class="confidence-mini-fill" style="width: ${sig.confidence}%"></div></div>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
        drawThreeDayMatrix(card.querySelector('canvas'), sig.candles);
      });
    }

    function drawThreeDayMatrix(canvas, candles) {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#010204';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const globalHigh = Math.max(...candles.map(c => c.high));
      const globalLow = Math.min(...candles.map(c => c.low));
      const globalRange = globalHigh - globalLow || 1;

      const padding = 12;
      const usableHeight = canvas.height - (padding * 2);
      const candleWidth = 18;
      const spacing = 12;
      const startX = 14;

      candles.forEach((c, i) => {
        const x = startX + i * (candleWidth + spacing);
        const isBullish = c.close >= c.open;
        
        const highY = padding + (1 - (c.high - globalLow) / globalRange) * usableHeight;
        const lowY = padding + (1 - (c.low - globalLow) / globalRange) * usableHeight;
        const openY = padding + (1 - (c.open - globalLow) / globalRange) * usableHeight;
        const closeY = padding + (1 - (c.close - globalLow) / globalRange) * usableHeight;

        ctx.strokeStyle = '#3a4b5c';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + candleWidth / 2, highY);
        ctx.lineTo(x + candleWidth / 2, lowY);
        ctx.stroke();

        ctx.fillStyle = isBullish ? '#00ff88' : '#ff003c';
        const bodyY = Math.min(openY, closeY);
        const bodyHeight = Math.abs(closeY - openY) || 2;
        ctx.fillRect(x, bodyY, candleWidth, bodyHeight);
      });
    }

    function downloadReport() {
      if(validatedSignals.length === 0) {
        alert("Keine aktiven Signaldaten für den Export vorhanden.");
        return;
      }
      let reportLines = ["=== PEAK VALLEY REAL CONFIDENCE REPORT ==="];
      validatedSignals.forEach(s => {
        reportLines.push(`Symbol: ${s.symbol} | Formation: ${s.signal} | Confidence: ${s.confidence}%`);
        reportLines.push(`EOD Date: ${s.date} | Close: $${s.close}`);
        reportLines.push(`Sequence: ${s.beforeYesterdayClose} -> ${s.yesterdayClose} -> ${s.close}`);
        reportLines.push(`VolTrend: ${s.volTrend.toFixed(2)}% | DayRange: ${s.range.toFixed(2)}%`);
        reportLines.push("------------------------------------");
      });
      
      const blob = new Blob([reportLines.join('\n')], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `peak_valley_v7_report.txt`;
      a.click();
      window.URL.revokeObjectURL(url);
    }
